    :root {

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--cbe-bg);

    .cbe-btn-tool {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: 4px; font-size: 13px; font-weight: 500;

    .cbe-btn-tool:hover { background: #e2e8f0; border-color: #94a3b8; }
    .cbe-btn-tool.active { background: #1b365d; color: #ffffff; border-color: #1b365d; }
    .cbe-btn-tool.flagged { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
    .cbe-option-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 6px;
      background: #ffffff; transition: all 0.15s ease; cursor: pointer;
    }
    .cbe-option-row:hover { border-color: #1b365d; background: #f8fafc; }
    .cbe-option-row.selected { border-color: #1b365d; background: #eff6ff; box-shadow: inset 3px 0 0 #1b365d; }
    .cbe-option-row.struck .opt-text { text-decoration: line-through; color: #94a3b8; }
    .cbe-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13.5px; }
    .cbe-table th, .cbe-table td { border: 1px solid #94a3b8; padding: 8px 12px; text-align: left; }
    .cbe-table th { background: #e8edf2; font-weight: 600; color: #0f172a; }
    .cbe-table td.num, .cbe-table th.num { text-align: right; font-variant-numeric: tabular-nums; }

    .cbe-scroll::-webkit-scrollbar-thumb:hover { background: #64748b; }
    .floating-window {
      position: fixed; z-index: 60; background: #ffffff;
      border: 1px solid #94a3b8; border-radius: 8px;
      box-shadow: 0 20px 35px -5px rgba(15, 23, 42, 0.25), 0 8px 12px -6px rgba(15, 23, 42, 0.15);

      0%, 100% { background-color: #dc2626; }

    }
    .timer-critical { animation: pulseWarn 1.2s infinite; }
    .calc-btn {
      padding: 10px 6px; border-radius: 5px; font-weight: 600; font-size: 14px;
      border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a;
      transition: background 0.1s; cursor: pointer;

    .calc-btn:hover { background: #e2e8f0; }
    .calc-btn.op { background: #e0e7ff; color: #1e3a8a; border-color: #c7d2fe; }
    .calc-btn.op:hover { background: #c7d2fe; }
    .calc-btn.eq { background: #1b365d; color: #ffffff; border-color: #1b365d; }
    .calc-btn.eq:hover { background: #132744; }

const EXAMS = [
  {
    id: 'exam1',
    code: 'FR-MOCK-OCT26',
    title: 'Financial Reporting (FR) — Mock Test',
    subtitle: 'BCOM ACCA FR B1 • Oct 2026 • Indian Institute of Commerce Lakshya',
    totalQuestions: 30,
    totalMarks: 60,
    marksPerQuestion: 2,
    accaMinutes: 108, // ACCA Standard: 1.8 mins per mark (180 mins / 100 marks)
    paperMinutes: 100, // Stated on paper
    sections: [
      { id: 'A', name: 'Section A — Objective Test Questions', range: [1, 15], description: '15 individual questions (2 marks each = 30 marks)' },
      { id: 'B', name: 'Section B — Objective Test Case Scenarios', range: [16, 30], description: '3 scenarios × 5 questions each (2 marks each = 30 marks)' }
    ],
    scenarios: {
      grinnit: {
        id: 'grinnit',
        title: 'GRINNIT CO',
        rangeLabel: 'Questions 16 – 20',
        topic: 'IAS 12 & IAS 16',
        html: `
          <p class="font-semibold text-slate-900 mb-3">The following scenario relates to questions 16 – 20.</p>
          <p class="mb-3">Grinnit Co is preparing its financial statements for the year ended 31 October 20X7.</p>
          <p class="mb-3">Grinnit Co has a deferred tax liability at 1 November 20X6 of <strong>$62,000</strong>. This had been caused by differences between depreciation charges and tax allowances.</p>
          <p class="mb-3">At 31 October 20X7, the tax base of Grinnit Co's net assets was <strong>$180,000</strong> less than the carrying amount. This has been caused by the differences between depreciation charges and tax allowances and excludes the following effects of a revaluation of land.</p>
          <p class="mb-3">Grinnit Co decided to revalue its land for the first time on 1 August 20X7. A qualified surveyor valued the land on that date at <strong>$300,000</strong>. The land had been purchased four years ago for <strong>$240,000</strong>.</p>
          <p class="mb-1">The income tax rate is <strong>30%</strong>.</p>
        `
      },
      gammon: {
        id: 'gammon',
        title: 'GAMMON CO',
        rangeLabel: 'Questions 21 – 25',
        topic: 'IFRS 5 & IAS 33',
        html: `
          <p class="font-semibold text-slate-900 mb-3">The following scenario relates to questions 21 – 25.</p>
          <p class="mb-3">Gammon Co manufactures and sells a wide variety of furniture. Its year-end date is 31 October 20X4.</p>
          <p class="mb-3">During the year, Gammon Co commenced restructuring and, as part of this, the Garden Furniture division was classified as held for sale. The Garden Furniture division was sold on 12 January 20X5. Prior to its classification as 'held for sale', the division's current assets were realised and the proceeds were used to settle its liabilities.</p>
          <p class="mb-2">Relevant information on the non-current assets of the Garden Furniture division at 31 October 20X4 is presented below:</p>
          <table class="cbe-table">
            <thead>
              <tr>
                <th>Non-current assets of the Garden Furniture division at 31 October 20X4</th>
                <th class="num">$'000</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>Carrying amount</td><td class="num">31,350</td></tr>
              <tr><td>Value in use</td><td class="num">20,010</td></tr>
              <tr><td>Fair value</td><td class="num">26,940</td></tr>
              <tr><td>Selling costs</td><td class="num">2,040</td></tr>
            </tbody>
          </table>
          <p class="mt-3 mb-2 font-medium text-slate-900">On 1 August 20X4, to partly-fund the restructuring:</p>
          <ol class="list-none pl-2 space-y-1.5 mb-3">
            <li>(1) 18m equity (ordinary) shares were issued at market value.</li>
            <li>(2) $60m of 8% convertible loan notes were issued at par. The effective interest rate was also 8%.</li>
          </ol>
          <p class="mb-2 font-medium text-slate-900">Additional relevant information for Gammon Co:</p>
          <ol class="list-none pl-2 space-y-1.5">
            <li>(1) 60m equity (ordinary) shares were in issue on 1 November 20X3.</li>
            <li>(2) On 1 March 20X4, a one-for-four issue of bonus shares was made.</li>
            <li>(3) Profit for the year from continuing operations for the year ended 31 October 20X4 was $103.8m.</li>
            <li>(4) The income tax rate is 20%.</li>
          </ol>
        `
      },
      shawler: {
        id: 'shawler',
        title: 'SHAWLER CO',
        rangeLabel: 'Questions 26 – 30',
        topic: 'IAS 16, IAS 20 & IAS 37',
        html: `
          <p class="font-semibold text-slate-900 mb-3">The following scenario relates to questions 26 – 30.</p>
          <p class="mb-3">Shawler Co is a small manufacturing company specialising in making alloy castings. Its main item of plant is a furnace which was purchased on 1 October 20X5. The furnace has two components: the main body (cost <strong>$42,000</strong>) which has a ten-year life, and a replaceable liner (cost <strong>$10,000</strong>) with a five-year life.</p>
          <p class="mb-3">The manufacturing process produces toxic chemicals which pollute the nearby environment. Legislation requires that a clean-up operation must be undertaken by Shawler Co on 30 September 20Y5 at the latest. The cost of the clean-up operation has been estimated at <strong>$38,900</strong>.</p>
          <p class="mb-3">On 1 October 20X5 the present value of this amount was calculated at <strong>$18,000</strong>, using the company's cost of capital of <strong>8%</strong>. On 1 October 20X5 Shawler Co received a government grant of <strong>$12,000</strong> relating to the cost of the main body of the furnace only. No other conditions were attached to the grant.</p>
          <p class="mb-1">On 1 April 20X6, the government introduced further environmental legislation which had the effect of requiring Shawler Co to fit anti-pollution filters to its furnace within two years. An environmental consultant has calculated that fitting the filters will reduce Shawler Co's required environmental costs (and therefore its provision) by <strong>33%</strong>. At 30 September 20X6 Shawler Co had not yet fitted the filters.</p>
        `
      }
    },
    questions: [
      {
        num: 1, section: 'A', type: 'mcq', topic: 'IFRS 15 Revenue', marks: 2,
        stem: `<p class="mb-3">Gim sells a laptop and a two-year support package for a total of $1,200. Stand-alone selling prices are: laptop $1,000, support $500 (for the two years). The laptop is delivered and support begins on 1 January 20X4.</p><p class="font-semibold text-slate-900">What total revenue should Gim recognise in the year ended 31 December 20X4?</p>`,
        options: [
          { key: 'A', text: '$1,200' },
          { key: 'B', text: '$1,000' },
          { key: 'C', text: '$800' },
          { key: 'D', text: '$700' }
        ],
        correct: 'B',
        explanation: `Under <strong>IFRS 15</strong>, allocate the transaction price ($1,200) based on relative stand-alone selling prices (total = $1,000 + $500 = $1,500):<br>• Laptop: $1,200 × ($1,000 / $1,500) = $800 (recognised at point in time on 1 Jan 20X4).<br>• Support (2 years): $1,200 × ($500 / $1,500) = $400 → $200 per year (recognised over time).<br>• Total revenue in 20X4 = $800 + $200 = <strong>$1,000</strong>.`
      },
      {
        num: 2, section: 'A', type: 'mcq', topic: 'IFRS 15 Revenue', marks: 2,
        stem: `<p class="font-semibold text-slate-900">Which of the following is NOT a criterion for recognising revenue over time under IFRS 15?</p>`,
        options: [
          { key: 'A', text: 'The contract term is longer than one year' },
          { key: 'B', text: 'The customer simultaneously receives and consumes the benefits as the entity performs' },
          { key: 'C', text: "The entity's performance creates or enhances an asset that the customer controls" },
          { key: 'D', text: "The entity's performance creates an asset with no alternative use and the entity has an enforceable right to payment for performance to date" }
        ],
        correct: 'A',
        explanation: `<strong>IFRS 15.35</strong> sets out three criteria for over-time revenue recognition (options B, C, and D). The length of the contract term (e.g. longer than one year) is <strong>not</strong> a criterion.`
      },
      {
        num: 3, section: 'A', type: 'mcq', topic: 'IFRS 15 / IAS 37', marks: 2,
        stem: `<p class="mb-3">Wix sells a machine with a standard one-year warranty that it meets its specification. Customers can also buy an extended three-year warranty separately.</p><p class="font-semibold text-slate-900">How should these warranties be accounted for?</p>`,
        options: [
          { key: 'A', text: 'Both are separate performance obligations' },
          { key: 'B', text: 'Both are provisions under IAS 37' },
          { key: 'C', text: 'Both are expensed when claims are paid' },
          { key: 'D', text: 'The standard warranty is an IAS 37 provision; the extended warranty is a separate performance obligation recognised over three years' }
        ],
        correct: 'D',
        explanation: `Under <strong>IFRS 15 (B28–B33)</strong>, an assurance-type (standard) warranty is accounted for as a provision under <strong>IAS 37</strong>, whereas an optional service-type (extended) warranty purchased separately is a distinct performance obligation recognised over the three-year service period.`
      },
      {
        num: 4, section: 'A', type: 'mcq', topic: 'IFRS 15 Repurchase', marks: 2,
        stem: `<p class="mb-3">Zed sells a machine for $100,000 and agrees to repurchase it after two years for $70,000. The transaction is not part of a sale and leaseback.</p><p class="font-semibold text-slate-900">How is the transaction treated?</p>`,
        options: [
          { key: 'A', text: 'As a sale, with revenue of $100,000' },
          { key: 'B', text: 'As a financing arrangement' },
          { key: 'C', text: 'As a sale with a right of return' },
          { key: 'D', text: 'As a lease under IFRS 16' }
        ],
        correct: 'D',
        explanation: `Under <strong>IFRS 15.B66(a)</strong>, when an entity has an obligation (forward) or right (call option) to repurchase an asset for <em>less than</em> the original selling price ($70,000 &lt; $100,000) and it is not a sale and leaseback, the contract is accounted for as a <strong>lease under IFRS 16</strong>.`
      },
      {
        num: 5, section: 'A', type: 'mcq', topic: 'IFRS 15 Financing', marks: 2,
        stem: `<p class="mb-3">On 1 January 20X1 Glass Co sells goods to Vase Co for $350,000, payable on 31 December 20X4. The relevant discount rate is 8%. The present value of $1 receivable at the end of year 4 based on a discount rate of 8% is $0.74.</p><p class="font-semibold text-slate-900">What amounts of revenue and interest income should be recognised in profit or loss for the year ended 31 December 20X2?</p>`,
        options: [
          { key: 'A', text: 'Revenue $259,000; interest income $20,720' },
          { key: 'B', text: 'Revenue $350,000; interest income nil' },
          { key: 'C', text: 'Revenue nil; interest income $22,378' },
          { key: 'D', text: 'Revenue nil; interest income $20,720' }
        ],
        correct: 'C',
        explanation: `• 1 Jan 20X1: Revenue recognised = $350,000 × 0.74 = $259,000.<br>• Year ended 31 Dec 20X1: Interest income = $259,000 × 8% = $20,720 → Closing receivable = $279,720.<br>• Year ended 31 Dec 20X2: Revenue = <strong>nil</strong>; Interest income = $279,720 × 8% = $22,377.60 ≈ <strong>$22,378</strong>.`
      },
      {
        num: 6, section: 'A', type: 'multi', selectCount: 2, topic: 'IFRS 15 Control', marks: 2,
        stem: `<p class="mb-3">Jentil Co is a company which manufactures ovens and supplies them to retailers. There are no direct sales to the public.</p><p class="font-semibold text-slate-900">Which TWO of the following would indicate that Jentil Co should recognise revenue at the point of delivery?</p>`,
        options: [
          { key: 'A', text: 'The retailer must pay a penalty to Jentil Co if it returns new ovens which are in full working order' },
          { key: 'B', text: 'The retailer has signed proof of delivery and unconditionally accepted the delivery of the ovens from Jentil Co' },
          { key: 'C', text: 'Jentil Co has a statutory right to request the return of the ovens in exchange for the original consideration, without further compensating the retailer' },
          { key: 'D', text: 'Obsolete models of ovens may be returned by the retailer to Jentil Co in exchange for the original consideration, without being further compensated' }
        ],
        correct: ['A', 'B'],
        explanation: `<strong>A</strong> and <strong>B</strong> indicate transfer of control to the retailer at delivery (IFRS 15.38: customer acceptance and significant risks/rewards of ownership). C (repurchase right) and D (unconditional right to return obsolete stock) indicate a consignment/no transfer of control.`
      },
      {
        num: 7, section: 'A', type: 'mcq', topic: 'IFRS 9 Financial Assets', marks: 2,
        stem: `<p class="mb-3">On 1 January 20X8 Penfold purchased a debt instrument for its fair value of $500,000. It has a principal amount of $550,000 and is due to mature in five years. The debt instrument carries fixed interest of 6% paid annually in arrears and has an effective interest rate of 8%. The debt instrument meets the business model test to be measured at amortised cost.</p><p class="font-semibold text-slate-900">At what amount will the debt instrument be presented in the statement of financial position of Penfold as at 31 December 20X9?</p>`,
        options: [
          { key: 'A', text: '$514,560' },
          { key: 'B', text: '$566,000' },
          { key: 'C', text: '$564,560' },
          { key: 'D', text: '$520,800' }
        ],
        correct: 'A',
        explanation: `Annual coupon received = $550,000 × 6% = $33,000.<br>• 20X8: $500,000 + ($500,000 × 8% = $40,000) − $33,000 = $507,000.<br>• 20X9: $507,000 + ($507,000 × 8% = $40,560) − $33,000 = <strong>$514,560</strong>.`
      },
      {
        num: 8, section: 'A', type: 'mcq', topic: 'IFRS 9 Financial Liabilities', marks: 2,
        stem: `<p class="mb-3">On 1 January 20X5 Dune Co issued a $500,000 3% bond redeemable at par in five years. Issue costs were $40,000, so the net proceeds were $460,000. The effective rate of interest is 6%. Interest is paid annually in arrears.</p><p class="font-semibold text-slate-900">What is the carrying amount of the bond in Dune Co's statement of financial position at 31 December 20X5?</p>`,
        options: [
          { key: 'A', text: '$445,000' },
          { key: 'B', text: '$460,000' },
          { key: 'C', text: '$472,600' },
          { key: 'D', text: '$487,600' }
        ],
        correct: 'C',
        explanation: `Opening liability = $460,000.<br>• Effective interest (6%) = $460,000 × 6% = $27,600.<br>• Cash interest paid (3% of $500,000) = $15,000.<br>• Closing carrying amount = $460,000 + $27,600 − $15,000 = <strong>$472,600</strong>.`
      },
      {
        num: 9, section: 'A', type: 'mcq', topic: 'IAS 37 Provisions', marks: 2,
        stem: `<p class="mb-3">Raycroft operates a nuclear power station. The power station is due to be decommissioned on 31 December 20Y4 and will be fully operational up to that date. It has been estimated that the cost of decommissioning the power station and cleaning up any environmental damage, as required by legislation, will be $60 million. Raycroft recognised a provision for the present value of this expenditure at 31 December 20X6. A suitable discount rate for evaluating costs of this nature is 12%, equivalent to a present value factor after eight years of 0.404. The decommissioning cost will be depreciated over eight years.</p><p class="font-semibold text-slate-900">What is the TOTAL charge to profit or loss in respect of this provision for the year ended 31 December 20X7?</p>`,
        options: [
          { key: 'A', text: '$7,500,000' },
          { key: 'B', text: '$5,938,800' },
          { key: 'C', text: '$3,030,000' },
          { key: 'D', text: '$2,908,800' }
        ],
        correct: 'B',
        explanation: `Initial provision &amp; capitalised asset at 31 Dec 20X6 = $60,000,000 × 0.404 = $24,240,000.<br>• Depreciation (20X7): $24,240,000 ÷ 8 years = $3,030,000.<br>• Finance cost (unwinding @ 12%): $24,240,000 × 12% = $2,908,800.<br>• Total P&amp;L charge = $3,030,000 + $2,908,800 = <strong>$5,938,800</strong>.`
      },
      {
        num: 10, section: 'A', type: 'multi', selectCount: 2, topic: 'IAS 20 Grants', marks: 2,
        stem: `<p class="mb-3">Theo Co acquired new plant on 1 January 20X3 for $6m. This was partly funded by the receipt of a $2m government grant on the same date. The plant has a useful life of ten years. Theo Co is unsure whether to deduct the grant to calculate the carrying amount of the plant or to use the deferred income method.</p><p class="font-semibold text-slate-900">Based on the different ways to account for government grants, which TWO of the following options can be recognised in the statement of financial position as at 31 December 20X3?</p>`,
        options: [
          { key: 'A', text: 'Non-current asset of $3.6m' },
          { key: 'B', text: 'Non-current liability of $1.8m' },
          { key: 'C', text: 'Non-current asset of $4m' },
          { key: 'D', text: 'Non-current liability of $1.6m' }
        ],
        correct: ['A', 'D'],
        explanation: `• <strong>Deduct from asset method:</strong> Net cost = $6m − $2m = $4m. After 1 year's depreciation ($0.4m), Non-current asset = <strong>$3.6m (A)</strong>.<br>• <strong>Deferred income method:</strong> Total deferred income at 31 Dec 20X3 = $2m − $0.2m = $1.8m, split into Current liability ($0.2m) and <strong>Non-current liability of $1.6m (D)</strong>.`
      },
      {
        num: 11, section: 'A', type: 'mcq', topic: 'IAS 21 Foreign Exchange', marks: 2,
        stem: `<p class="mb-3">On 1 January 20X7 Vega took out a loan of Zenar 1.5 million. Vega's functional currency is the dollar. The loan is to be repaid in 10 equal instalments of Zenar 150,000 on 31 December each year, the first being on 31 December 20X7. Exchange rates are as follows:</p>
          <table class="cbe-table max-w-md">
            <tbody>
              <tr><td>1 January 20X7</td><td>Zenar 1 = $1.85</td></tr>
              <tr><td>31 December 20X7</td><td>Zenar 1 = $1.92</td></tr>
            </tbody>
          </table>
          <p class="font-semibold text-slate-900 mt-3">What is the carrying amount of the non-current liability in Vega's statement of financial position as at 31 December 20X7?</p>`,
        options: [
          { key: 'A', text: '$2,497,500' },
          { key: 'B', text: '$2,304,000' },
          { key: 'C', text: '$2,592,000' },
          { key: 'D', text: '$2,220,000' }
        ],
        correct: 'B',
        explanation: `• Remaining loan at 31 Dec 20X7 after 1st instalment = Z1,500,000 − Z150,000 = Z1,350,000.<br>• Current liability (instalment due 31 Dec 20X8) = Z150,000.<br>• Non-current liability = Z1,200,000.<br>• Monetary liabilities are retranslated at the closing rate ($1.92): Z1,200,000 × $1.92 = <strong>$2,304,000</strong>.`
      },
      {
        num: 12, section: 'A', type: 'mcq', topic: 'IAS 21 Foreign Exchange', marks: 2,
        stem: `<p class="mb-3">IAS 21 <em>The Effects of Changes in Foreign Exchange Rates</em> distinguishes between functional currency and presentation currency.</p>
          <p class="font-semibold text-slate-900 mb-2">Which of the following statements regarding presentation currency is/are correct in accordance with IAS 21?</p>
          <ol class="list-none pl-2 space-y-1.5 mb-2">
            <li>(1) An entity may choose to present its financial statements in a currency other than its functional currency</li>

const STORAGE_KEY = 'acca_fr_cbe_state_v1';

let state = {
  view: 'home', // 'home' | 'instructions' | 'exam' | 'review_screen' | 'results'
  activeExamId: null,
  timerMode: { exam1: 'acca', exam2: 'acca', exam3: 'acca' }, // 'acca' | 'paper' | 'untimed'
  currentQIndex: 0,
  answers: {},      // { [examId]: { [qNum]: value } }
  flags: {},        // { [examId]: { [qNum]: true } }
  visited: {},      // { [examId]: { [qNum]: true } }
  struck: {},       // { [examId]: { [`${qNum}_${key}`]: true } }
  scratchpad: { exam1: '', exam2: '', exam3: '' },
  highlights: {},   // { [examId]: { [key]: html } }
  savedTimers: {},  // { [examId]: { timeRemainingSec, elapsedSec, mode } }
  timeRemainingSec: 0,
  elapsedSec: 0,
  timerHidden: false,
  timerPaused: false,
  highlightMode: false,
  strikeMode: false,
  showCalc: false,
  showScratch: false,
  calcPos: { left: null, top: 112 },
  scratchPos: { left: 16, top: 112 },
  showNavigator: false,
  navFilter: 'all', // 'all' | 'incomplete' | 'flagged'
  showHelpModal: false,
  showSubmitModal: false,
  resultsFilter: 'all', // 'all' | 'incorrect' | 'correct' | 'flagged'
  multiNotice: '',
  toastMsg: '',
  history: {}, // { [examId]: { score, total, pct, date, timeTakenSec, mode } }
  calcDisplay: '0',
  calcExpr: '',
  calcResetNext: false
};

let timerInterval = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.history) state.history = parsed.history;
      if (parsed.scratchpad) state.scratchpad = Object.assign(state.scratchpad, parsed.scratchpad);
      if (parsed.answers) state.answers = parsed.answers;
      if (parsed.flags) state.flags = parsed.flags;
      if (parsed.visited) state.visited = parsed.visited;
      if (parsed.struck) state.struck = parsed.struck;
      if (parsed.timerMode) state.timerMode = Object.assign(state.timerMode, parsed.timerMode);
      if (parsed.savedTimers) state.savedTimers = parsed.savedTimers;
    }
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      history: state.history,
      scratchpad: state.scratchpad,
      answers: state.answers,
      flags: state.flags,
      visited: state.visited,
      struck: state.struck,
      timerMode: state.timerMode,
      savedTimers: state.savedTimers
    }));
  } catch (e) {}
}

function getExam(id = state.activeExamId) {
  return EXAMS.find(e => e.id === id);
}

function getExamAnswers(examId = state.activeExamId) {
  if (!state.answers[examId]) state.answers[examId] = {};
  return state.answers[examId];
}

function getExamFlags(examId = state.activeExamId) {
  if (!state.flags[examId]) state.flags[examId] = {};
  return state.flags[examId];
}

function getExamVisited(examId = state.activeExamId) {
  if (!state.visited[examId]) state.visited[examId] = {};
  return state.visited[examId];
}

function getExamStruck(examId = state.activeExamId) {
  if (!state.struck[examId]) state.struck[examId] = {};
  return state.struck[examId];
}

function isQuestionAnswered(q, ans) {
  if (ans === undefined || ans === null) return false;
  if (q.type === 'mcq') return typeof ans === 'string' && ans.length > 0;
  if (q.type === 'multi') return Array.isArray(ans) && ans.length === q.selectCount;
  if (q.type === 'number') return typeof ans === 'string' && ans.trim().length > 0;
  if (q.type === 'tf_matrix') return typeof ans === 'object' && q.rows.every(r => ans[r.id] === 'True' || ans[r.id] === 'False');
  if (q.type === 'dropdown_table') return typeof ans === 'object' && q.rows.every(r => ans[r.id] && ans[r.id].length > 0);
  return false;
}

function isQuestionPartial(q, ans) {
  if (!ans) return false;
  if (isQuestionAnswered(q, ans)) return false;
  if (q.type === 'multi') return Array.isArray(ans) && ans.length > 0;
  if (q.type === 'tf_matrix' || q.type === 'dropdown_table') return typeof ans === 'object' && Object.values(ans).some(v => v && v.length > 0);
  return false;
}

function normalizeNum(str) {
  return String(str || '').toLowerCase().replace(/[\$,\s]/g, '').replace(/million/g, 'million');
}

function isAnswerCorrect(q, ans) {
  if (!isQuestionAnswered(q, ans)) return false;
  if (q.type === 'mcq') return ans === q.correct;
  if (q.type === 'multi') {
    const a = [...ans].sort().join(',');
    const c = [...q.correct].sort().join(',');
    return a === c;
  }
  if (q.type === 'number') {
    const norm = normalizeNum(ans);
    return q.accepted.some(acc => {
      const aNorm = normalizeNum(acc);
      if (norm === aNorm) return true;
      const n1 = parseFloat(norm);
      const n2 = parseFloat(aNorm);
      return !isNaN(n1) && !isNaN(n2) && norm.replace(/[^\d.-]/g,'') === norm && Math.abs(n1 - n2) < 0.001;
    });
  }
  if (q.type === 'tf_matrix' || q.type === 'dropdown_table') {
    return q.rows.every(r => ans[r.id] === r.correct);
  }
  return false;
}

function formatTime(totalSec) {
  const s = Math.max(0, Math.floor(totalSec));
  const hrs = Math.floor(s / 3600);
  const mins = Math.floor((s % 3600) / 60);
  const secs = s % 60;
  const pad = n => String(n).padStart(2, '0');
  return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
}

function startTimer() {
  stopTimer();
  const exam = getExam();
  const mode = state.timerMode[exam.id] || 'acca';
  timerInterval = setInterval(() => {
    if (state.view !== 'exam' && state.view !== 'review_screen') return;
    if (state.timerPaused) return;
    state.elapsedSec += 1;
    if (mode !== 'untimed') {
      state.timeRemainingSec -= 1;
      if (state.timeRemainingSec <= 0) {
        state.timeRemainingSec = 0;
        stopTimer();
        submitExam(true);
        return;
      }
    }
    state.savedTimers[exam.id] = { timeRemainingSec: state.timeRemainingSec, elapsedSec: state.elapsedSec, mode };
    if (state.elapsedSec % 5 === 0) saveState();
    updateTimerDOM();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function updateTimerDOM() {
  const el = document.getElementById('cbe-timer-val');
  const pill = document.getElementById('cbe-timer-pill');
  if (!el || !pill) return;
  const exam = getExam();
  const mode = state.timerMode[exam.id] || 'acca';
  if (state.timerHidden) {
    el.textContent = 'Hidden';
    pill.className = 'flex items-center gap-2 px-3 py-1 rounded text-xs sm:text-sm font-mono-num bg-slate-700/70 text-slate-200 cursor-pointer border border-slate-500/50';
    return;
  }
  if (mode === 'untimed') {
    el.textContent = formatTime(state.elapsedSec);
    pill.className = 'flex items-center gap-2 px-3 py-1 rounded text-xs sm:text-sm font-mono-num bg-slate-800/70 text-white cursor-pointer border border-slate-500/50';
  } else {
    el.textContent = formatTime(state.timeRemainingSec);
    let cls = 'flex items-center gap-2 px-3 py-1 rounded text-xs sm:text-sm font-mono-num cursor-pointer border ';
    if (state.timeRemainingSec <= 300) {
      cls += 'timer-critical text-white border-red-400 font-bold';
    } else if (state.timeRemainingSec <= 900) {
      cls += 'bg-amber-600 text-white border-amber-400 font-semibold';
    } else {
      cls += 'bg-slate-900/50 text-white border-slate-500/50';
    }
    pill.className = cls;
  }
}

// ============================================================================
// EXAM FLOW ACTIONS
// ============================================================================
function openInstructions(examId) {
  state.activeExamId = examId;
  state.view = 'instructions';
  render();
}

function launchExam(examId, resetAnswers = false) {
  state.activeExamId = examId;
  const exam = getExam(examId);
  const mode = state.timerMode[examId] || 'acca';
  const mins = mode === 'acca' ? exam.accaMinutes : (mode === 'paper' ? exam.paperMinutes : 0);
  if (resetAnswers) {
    state.answers[examId] = {};
    state.flags[examId] = {};
    state.visited[examId] = {};
    state.struck[examId] = {};
    state.highlights[examId] = {};
    delete state.savedTimers[examId];
    state.timeRemainingSec = mins * 60;
    state.elapsedSec = 0;
    saveState();
  } else {
    const saved = state.savedTimers[examId];
    if (saved && saved.mode === mode && saved.elapsedSec > 0) {
      state.timeRemainingSec = saved.timeRemainingSec;
      state.elapsedSec = saved.elapsedSec;
    } else {
      state.timeRemainingSec = mins * 60;
      state.elapsedSec = 0;
    }
  }
  state.multiNotice = '';
  state.currentQIndex = 0;
  state.timerPaused = false;
  state.timerHidden = false;
  state.highlightMode = false;
  state.strikeMode = false;
  state.showNavigator = false;
  state.showSubmitModal = false;
  state.showHelpModal = false;
  getExamVisited(examId)[1] = true;
  state.view = 'exam';
  startTimer();
  render();
}

function goToQuestion(index) {
  const exam = getExam();
  if (index < 0 || index >= exam.questions.length) return;
  state.currentQIndex = index;
  state.multiNotice = '';
  const q = exam.questions[index];
  getExamVisited(exam.id)[q.num] = true;
  state.view = 'exam';
  state.showNavigator = false;
  saveState();
  render();
  const mainPane = document.getElementById('question-pane');
  if (mainPane) mainPane.scrollTop = 0;
}

function submitExam(autoTimeout = false) {
  stopTimer();
  const exam = getExam();
  const ansMap = getExamAnswers(exam.id);
  let correctCount = 0;
  exam.questions.forEach(q => {
    if (isAnswerCorrect(q, ansMap[q.num])) correctCount += 1;
  });
  const score = correctCount * exam.marksPerQuestion;
  const pct = Math.round((score / exam.totalMarks) * 100);
  state.history[exam.id] = {
    score,
    total: exam.totalMarks,
    correctCount,
    pct,
    date: new Date().toLocaleString(),
    timeTakenSec: state.elapsedSec,
    mode: state.timerMode[exam.id] || 'acca',
    autoTimeout
  };
  state.showSubmitModal = false;
  state.showNavigator = false;
  state.showCalc = false;
  state.showScratch = false;
  state.resultsFilter = 'all';
  delete state.savedTimers[exam.id];
  state.view = 'results';
  saveState();
  render();
}

// ============================================================================
// HIGHLIGHTER TOOL (Authentic ACCA CBE yellow highlight)
// ============================================================================
function applyHighlightSelection() {
  if (!state.highlightMode) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const container = range.commonAncestorContainer;
  const host = (container.nodeType === 1 ? container : container.parentElement).closest('[data-highlightable="true"]');
  if (!host) return;
  try {
    const span = document.createElement('span');
    span.className = 'cbe-highlight';
    range.surroundContents(span);
    sel.removeAllRanges();
    const key = host.getAttribute('data-hl-key');
    if (!state.highlights[state.activeExamId]) state.highlights[state.activeExamId] = {};
    state.highlights[state.activeExamId][key] = host.innerHTML;
  } catch (e) {
    // Selection spans across multiple block nodes
    sel.removeAllRanges();
  }
}

function clearCurrentHighlights() {
  if (state.highlights[state.activeExamId]) {
    const exam = getExam();
    const q = exam.questions[state.currentQIndex];
    delete state.highlights[state.activeExamId][`q_${q.num}`];
    if (q.scenarioId) delete state.highlights[state.activeExamId][`sc_${q.scenarioId}`];
  }
  render();
}

// ============================================================================
// CALCULATOR LOGIC
// ============================================================================
function calcPress(val) {
  if (val === 'C') {
    state.calcDisplay = '0';
    state.calcExpr = '';
    state.calcResetNext = false;
  } else if (val === 'CE') {
    state.calcDisplay = '0';
  } else if (val === 'BACK') {
    state.calcDisplay = state.calcDisplay.length > 1 ? state.calcDisplay.slice(0, -1) : '0';
  } else if (val === 'SQRT') {
    const n = parseFloat(state.calcDisplay);
    state.calcDisplay = (!isNaN(n) && n >= 0) ? String(Number(Math.sqrt(n).toFixed(8))) : 'Error';
    state.calcResetNext = true;
  } else if (val === 'SIGN') {
    if (state.calcDisplay !== '0' && state.calcDisplay !== 'Error') {
      state.calcDisplay = state.calcDisplay.startsWith('-') ? state.calcDisplay.slice(1) : '-' + state.calcDisplay;
    }
  } else if (val === '%') {
    const n = parseFloat(state.calcDisplay);
    if (!isNaN(n)) state.calcDisplay = String(Number((n / 100).toFixed(8)));
  } else if (['+', '-', '*', '/'].includes(val)) {
    state.calcExpr = state.calcDisplay + ' ' + val + ' ';
    state.calcResetNext = true;
  } else if (val === '=') {
    try {
      const expr = (state.calcExpr + state.calcDisplay).replace(/[^0-9+\-*/.() ]/g, '');
      const result = Function('"use strict"; return (' + expr + ')')();
      if (!isFinite(result) || isNaN(result)) {
        state.calcDisplay = 'Error';
      } else {
        state.calcDisplay = String(Number(result.toFixed(8)));
      }
      state.calcExpr = '';
      state.calcResetNext = true;
    } catch (e) {
      state.calcDisplay = 'Error';
      state.calcExpr = '';
      state.calcResetNext = true;
    }
  } else {
    if (state.calcResetNext || state.calcDisplay === '0' || state.calcDisplay === 'Error') {
      state.calcDisplay = val === '.' ? '0.' : val;
      state.calcResetNext = false;
    } else {
      if (val === '.' && state.calcDisplay.includes('.')) return;
      state.calcDisplay += val;
    }
  }
  const disp = document.getElementById('calc-display');
  const expEl = document.getElementById('calc-expr');
  if (disp) disp.textContent = state.calcDisplay;
  if (expEl) expEl.textContent = state.calcExpr || '\u00A0';
}

function updateAnsweredCountDOM() {
  const el = document.getElementById('cbe-answered-count');
  if (!el) return;
  const exam = getExam();
  if (!exam) return;
  const ansMap = getExamAnswers(exam.id);
  const answeredCount = exam.questions.filter(item => isQuestionAnswered(item, ansMap[item.num])).length;
  el.textContent = `${answeredCount}/${exam.totalQuestions}`;
}

function updateNumPreviewDOM(q, rawVal) {
  const prev = document.getElementById('num-preview-val');
  if (!prev) return;
  const cleaned = String(rawVal || '').trim();
  if (!cleaned) {
    prev.textContent = '';
    return;
  }
  prev.textContent = `Preview: ${q.prefix || ''}${cleaned}${q.suffix ? ' ' + q.suffix : ''}`;
}

let toastTimer = null;
function showToast(msg) {
  state.toastMsg = msg;
  const el = document.getElementById('cbe-toast');
  if (el) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    state.toastMsg = '';
    const t = document.getElementById('cbe-toast');
    if (t) t.classList.add('hidden');
  }, 2200);
}

function render() {
  const root = document.getElementById('app');
  if (state.view === 'home') {
    root.innerHTML = renderHome();
  } else if (state.view === 'instructions') {
    root.innerHTML = renderInstructions();
  } else if (state.view === 'exam') {
    root.innerHTML = renderExamShell();
    updateTimerDOM();
  } else if (state.view === 'review_screen') {
    root.innerHTML = renderReviewScreen();
    updateTimerDOM();
  } else if (state.view === 'results') {
    root.innerHTML = renderResults();
  }
  attachEventListeners();
}

  return `

              <div class="text-xs text-slate-500">${mode === 'acca' ? 'ACCA Standard (1.8 min/mark)' : (mode === 'paper' ? 'Paper Stated Time' : 'Practice Mode')}</div>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded p-3.5">
              <div class="text-xs text-slate-500 uppercase font-semibold">Total Marks</div>
              <div class="text-lg font-bold text-[#1b365d] mt-0.5">${exam.totalMarks} Marks</div>
              <div class="text-xs text-slate-500">${exam.totalQuestions} questions × 2 marks each</div>

            <div class="bg-slate-50 border border-slate-200 rounded p-3.5">

            </div>

            <ul class="list-disc pl-5 space-y-1.5">
              ${exam.sections.map(s => `<li><strong>${s.name} (Questions ${s.range[0]} to ${s.range[1]}):</strong> ${s.description}.</li>`).join('')}

  // Get highlighted HTML if stored
  const hlMap = state.highlights[exam.id] || {};
  const stemHtml = hlMap[`q_${q.num}`] || q.stem;
  const scenarioHtml = scenario ? (hlMap[`sc_${scenario.id}`] || scenario.html) : '';

  // Scenario sibling questions

  return `

          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>

        </button>

        <button type="button" data-action="toggle-pause" title="${state.timerPaused ? 'Resume Timer' : 'Pause Timer'}"

    ${state.timerPaused ? `

        <button type="button" data-action="toggle-navigator"
          class="flex items-center gap-1.5 px-3.5 py-1.5 rounded bg-white/15 hover:bg-white/25 border border-white/25 text-xs sm:text-sm font-semibold transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Navigator</span>
        </button>
        <button type="button" data-action="open-review-screen"
          class="px-3.5 py-1.5 rounded bg-[#d31245] hover:bg-[#a80d36] text-white text-xs sm:text-sm font-semibold transition">
          End Exam
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" data-action="prev-q" ${state.currentQIndex === 0 ? 'disabled' : ''}
          class="px-3.5 sm:px-4 py-1.5 rounded bg-white/15 hover:bg-white/25 disabled:opacity-40 disabled:cursor-not-allowed border border-white/25 text-xs sm:text-sm font-semibold transition">
          ← Previous
        </button>
        ${state.currentQIndex < exam.questions.length - 1 ? `
          <button type="button" data-action="next-q"
            class="px-4 sm:px-5 py-1.5 rounded bg-white text-[#1b365d] hover:bg-slate-100 text-xs sm:text-sm font-bold transition shadow-sm">
            Next →
          </button>
        ` : `
          <button type="button" data-action="open-review-screen"
            class="px-4 sm:px-5 py-1.5 rounded bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-bold transition shadow-sm">
            Review &amp; Finish →
          </button>
        `}
      </div>
    </footer>

    ${state.showCalc ? renderCalculatorModal() : ''}
    ${state.showScratch ? renderScratchpadModal() : ''}
    ${state.showNavigator ? renderNavigatorModal() : ''}
    ${state.showHelpModal ? renderHelpModal() : ''}
    <div id="cbe-toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg ${state.toastMsg ? '' : 'hidden'}">${state.toastMsg}</div>
    </div>
  `;
}

function renderQuestionInput(q, currentAns, struckMap) {
  if (q.type === 'mcq') {
    return `
      <div class="space-y-2.5">
        ${q.options.map(opt => {
          const isSelected = currentAns === opt.key;
          const isStruck = !!struckMap[`${q.num}_${opt.key}`];
          return `
            <div data-action="select-mcq" data-qnum="${q.num}" data-key="${opt.key}"
              class="cbe-option-row ${isSelected ? 'selected' : ''} ${isStruck ? 'struck' : ''}">
              <input type="radio" name="q_${q.num}" value="${opt.key}" ${isSelected ? 'checked' : ''} class="mt-1 w-4 h-4 accent-[#1b365d] pointer-events-none shrink-0" />
              <div class="opt-text text-[14.5px] leading-snug text-slate-800">
                <strong class="mr-1.5 text-[#1b365d]">${opt.key}.</strong>${opt.text}
              </div>
            </div>
          `;
        }).join('')}
        <p class="text-[11px] text-slate-400 pt-1">Tip: Right-click any option (or enable Strikethrough) to cross out eliminated answers.</p>
      </div>
    `;
  }

  if (q.type === 'multi') {
    const selectedArr = Array.isArray(currentAns) ? currentAns : [];
    return `
      <div class="space-y-2.5">
        <div class="flex items-center justify-between text-xs mb-1">
          <span class="font-semibold text-[#1b365d]">Select exactly ${q.selectCount} options</span>
          <span class="px-2 py-0.5 rounded ${selectedArr.length === q.selectCount ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} font-semibold">
            Selected: ${selectedArr.length} / ${q.selectCount}
          </span>
        </div>
        ${state.multiNotice ? `<div class="text-xs px-3 py-1.5 rounded bg-amber-50 border border-amber-300 text-amber-900 font-medium">${state.multiNotice}</div>` : ''}
        ${q.options.map(opt => {
          const isSelected = selectedArr.includes(opt.key);
          const isStruck = !!struckMap[`${q.num}_${opt.key}`];
          return `
            <div data-action="toggle-multi" data-qnum="${q.num}" data-key="${opt.key}" data-limit="${q.selectCount}"
              class="cbe-option-row ${isSelected ? 'selected' : ''} ${isStruck ? 'struck' : ''}">
              <input type="checkbox" ${isSelected ? 'checked' : ''} class="mt-1 w-4 h-4 accent-[#1b365d] pointer-events-none shrink-0" />
              <div class="opt-text text-[14.5px] leading-snug text-slate-800">
                <strong class="mr-1.5 text-[#1b365d]">${opt.key}.</strong>${opt.text}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  if (q.type === 'number') {
    const val = typeof currentAns === 'string' ? currentAns : '';
    return `
      <div class="bg-slate-50 border border-slate-300 rounded-lg p-5 max-w-md">
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-2">Enter your numerical answer</label>
        <div class="flex items-center gap-2">
          ${q.prefix ? `<span class="text-base font-bold text-slate-700">${q.prefix}</span>` : ''}
          <input type="text" inputmode="decimal" id="num-answer-input" data-qnum="${q.num}" value="${val.replace(/"/g, '&quot;')}"
            placeholder="Type figure..."
            class="flex-1 bg-white border-2 border-[#1b365d] rounded px-3 py-2 text-base font-mono-num font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-400" />
          ${q.suffix ? `<span class="text-sm font-semibold text-slate-700">${q.suffix}</span>` : ''}
        </div>
        <div id="num-preview-val" class="text-xs font-semibold text-[#1b365d] mt-2 h-4">${val.trim() ? `Preview: ${q.prefix || ''}${val.trim()}${q.suffix ? ' ' + q.suffix : ''}` : ''}</div>
        <p class="text-[11px] text-slate-500 mt-1">Enter digits without currency signs (commas are accepted). Pay attention to any unit shown on the right.</p>
      </div>
    `;
  }

  if (q.type === 'tf_matrix') {
    const valObj = (currentAns && typeof currentAns === 'object') ? currentAns : {};
    return `
      <div class="overflow-x-auto">
        <table class="cbe-table">
          <thead>
            <tr>
              <th>Statement</th>
              <th class="text-center w-24">True</th>
              <th class="text-center w-24">False</th>
            </tr>
          </thead>
          <tbody>
            ${q.rows.map(row => `
              <tr>
                <td class="text-slate-800">${row.text}</td>
                <td class="text-center">
                  <label class="inline-flex items-center justify-center w-full py-1 cursor-pointer">
                    <input type="radio" name="tf_${q.num}_${row.id}" data-action="select-tf" data-qnum="${q.num}" data-rowid="${row.id}" value="True" ${valObj[row.id] === 'True' ? 'checked' : ''} class="w-4 h-4 accent-[#1b365d]" />
                  </label>
                </td>
                <td class="text-center">
                  <label class="inline-flex items-center justify-center w-full py-1 cursor-pointer">
                    <input type="radio" name="tf_${q.num}_${row.id}" data-action="select-tf" data-qnum="${q.num}" data-rowid="${row.id}" value="False" ${valObj[row.id] === 'False' ? 'checked' : ''} class="w-4 h-4 accent-[#1b365d]" />
                  </label>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  if (q.type === 'dropdown_table') {
    const valObj = (currentAns && typeof currentAns === 'object') ? currentAns : {};
    return `
      <div class="overflow-x-auto max-w-xl">
        <table class="cbe-table">
          <thead>
            <tr>
              <th>${q.headers[0]}</th>
              <th class="w-56">${q.headers[1]}</th>
            </tr>
          </thead>
          <tbody>
            ${q.rows.map(row => `
              <tr>
                <td class="font-medium text-slate-800">${row.label}</td>
                <td>
                  <select data-action="select-dropdown" data-qnum="${q.num}" data-rowid="${row.id}"
                    class="w-full bg-white border border-slate-400 rounded px-2.5 py-1.5 text-sm font-medium text-slate-900 focus:outline-none focus:border-[#1b365d] focus:ring-1 focus:ring-[#1b365d]">
                    <option value="">-- Select --</option>
                    ${row.options.map(opt => `<option value="${opt}" ${valObj[row.id] === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                  </select>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  return '';
}

function renderCalculatorModal() {
  const keys = [
    { l: 'C', v: 'C', cls: 'clr' }, { l: 'CE', v: 'CE', cls: 'clr' }, { l: '⌫', v: 'BACK', cls: 'op' }, { l: '÷', v: '/', cls: 'op' },
    { l: '7', v: '7', cls: '' }, { l: '8', v: '8', cls: '' }, { l: '9', v: '9', cls: '' }, { l: '×', v: '*', cls: 'op' },
    { l: '4', v: '4', cls: '' }, { l: '5', v: '5', cls: '' }, { l: '6', v: '6', cls: '' }, { l: '−', v: '-', cls: 'op' },
    { l: '1', v: '1', cls: '' }, { l: '2', v: '2', cls: '' }, { l: '3', v: '3', cls: '' }, { l: '+', v: '+', cls: 'op' },
    { l: '±', v: 'SIGN', cls: 'op' }, { l: '0', v: '0', cls: '' }, { l: '.', v: '.', cls: '' }, { l: '=', v: '=', cls: 'eq' },
    { l: '√', v: 'SQRT', cls: 'op col-span-2' }, { l: '%', v: '%', cls: 'op col-span-2' }
  ];
  const posStyle = state.calcPos.left !== null
    ? `left:${state.calcPos.left}px; top:${state.calcPos.top}px;`
    : `right:16px; top:${state.calcPos.top}px;`;
  return `
    <div id="calc-window" class="floating-window w-72 overflow-hidden" style="${posStyle}">
      <div data-drag-target="calc" class="drag-handle bg-[#1b365d] text-white px-3.5 py-2 flex items-center justify-between text-xs font-semibold">
        <span>ACCA CBE Calculator</span>
        <div class="flex items-center gap-2">
          <button type="button" data-action="copy-calc" class="text-[11px] bg-white/15 hover:bg-white/25 px-1.5 py-0.5 rounded text-slate-100">Copy</button>
          <button type="button" data-action="toggle-calc" class="text-slate-300 hover:text-white text-base leading-none">&times;</button>
        </div>
      </div>
      <div class="p-3 bg-slate-100">
        <div class="bg-white border border-slate-300 rounded px-3 py-2 text-right mb-2.5">
          <div id="calc-expr" class="text-[11px] text-slate-400 font-mono-num h-4 truncate">${state.calcExpr || '&nbsp;'}</div>
          <div id="calc-display" class="text-xl font-bold font-mono-num text-slate-900 truncate">${state.calcDisplay}</div>
        </div>
        <div class="grid grid-cols-4 gap-1.5">
          ${keys.map(k => `<button type="button" data-action="calc-key" data-val="${k.v}" class="calc-btn ${k.cls}">${k.l}</button>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderScratchpadModal() {
  const txt = state.scratchpad[state.activeExamId] || '';
  const posStyle = `left:${state.scratchPos.left}px; top:${state.scratchPos.top}px;`;
  return `
    <div id="scratch-window" class="floating-window w-80 sm:w-96 overflow-hidden" style="${posStyle}">
      <div data-drag-target="scratch" class="drag-handle bg-[#1b365d] text-white px-3.5 py-2 flex items-center justify-between text-xs font-semibold">
        <span>Scratch Pad (Workings)</span>
        <div class="flex items-center gap-2">
          <button type="button" data-action="clear-scratch" class="text-[11px] text-slate-300 hover:text-white underline">Clear</button>
          <button type="button" data-action="toggle-scratch" class="text-slate-300 hover:text-white text-base leading-none">&times;</button>
        </div>
      </div>
      <div class="p-3 bg-slate-50">
        <textarea id="scratchpad-area" rows="10" placeholder="Write rough workings here (e.g. Lease liability table, WANOS, Deferred Tax movement)..."
          class="w-full border border-slate-300 rounded p-2.5 text-xs font-mono-num text-slate-800 bg-white focus:outline-none focus:border-[#1b365d]">${txt.replace(/</g, '&lt;')}</textarea>
      </div>
    </div>
  `;
}

function renderNavigatorModal() {
  const exam = getExam();
  const ansMap = getExamAnswers(exam.id);
  const flagMap = getExamFlags(exam.id);
  const visMap = getExamVisited(exam.id);

  const filtered = exam.questions.filter(q => {
    const done = isQuestionAnswered(q, ansMap[q.num]);
    const flg = !!flagMap[q.num];
    if (state.navFilter === 'incomplete') return !done;
    if (state.navFilter === 'flagged') return flg;
    return true;
  });

  return `
    <div class="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
      <div class="bg-white border border-slate-300 rounded-lg shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden">
        <div class="bg-[#1b365d] text-white px-5 py-3 flex items-center justify-between">
          <div>
            <h3 class="font-bold text-sm sm:text-base">Navigator</h3>
            <p class="text-[11px] text-slate-300">Click any question number to jump directly to it</p>
          </div>
          <button type="button" data-action="toggle-navigator" class="text-slate-300 hover:text-white text-xl leading-none">&times;</button>
        </div>

        <div class="bg-slate-100 border-b border-slate-200 px-5 py-2.5 flex items-center justify-between flex-wrap gap-2">
          <div class="flex items-center gap-1.5 text-xs">
            <button type="button" data-action="set-nav-filter" data-filter="all" class="px-2.5 py-1 rounded font-semibold ${state.navFilter === 'all' ? 'bg-[#1b365d] text-white' : 'bg-white border border-slate-300 text-slate-700'}">All (${exam.totalQuestions})</button>
            <button type="button" data-action="set-nav-filter" data-filter="incomplete" class="px-2.5 py-1 rounded font-semibold ${state.navFilter === 'incomplete' ? 'bg-[#1b365d] text-white' : 'bg-white border border-slate-300 text-slate-700'}">Incomplete</button>
            <button type="button" data-action="set-nav-filter" data-filter="flagged" class="px-2.5 py-1 rounded font-semibold ${state.navFilter === 'flagged' ? 'bg-[#1b365d] text-white' : 'bg-white border border-slate-300 text-slate-700'}">Flagged</button>
          </div>
          <div class="flex items-center gap-3 text-[11px] text-slate-600">
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>Complete</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>Flagged</span>
          </div>
        </div>

        <div class="p-4 overflow-y-auto cbe-scroll flex-1">
          ${filtered.length === 0 ? `<p class="text-center text-sm text-slate-500 py-8">No questions match this filter.</p>` : `
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
              ${filtered.map(q => {
                const idx = exam.questions.findIndex(item => item.num === q.num);
                const done = isQuestionAnswered(q, ansMap[q.num]);
                const partial = isQuestionPartial(q, ansMap[q.num]);
                const flg = !!flagMap[q.num];
                const seen = !!visMap[q.num];
                const isCur = idx === state.currentQIndex;
                return `
                  <button type="button" data-action="goto-q" data-index="${idx}"
                    class="flex items-center justify-between px-3 py-2 rounded border text-left text-xs transition ${
                      isCur ? 'border-[#1b365d] bg-blue-50 ring-1 ring-[#1b365d]' :
                      done ? 'border-emerald-200 bg-emerald-50/60 hover:bg-emerald-50' :
                      'border-slate-200 bg-white hover:bg-slate-50'
                    }">
                    <div>
                      <div class="font-bold text-slate-900">Question ${q.num}</div>
                      <div class="text-[11px] ${done ? 'text-emerald-700' : partial ? 'text-amber-700' : 'text-slate-500'}">
                        ${done ? 'Complete' : partial ? 'Partial' : seen ? 'Incomplete' : 'Unseen'}
                      </div>
                    </div>
                    <div class="flex items-center gap-1">
                      ${flg ? '<span class="text-amber-500 text-sm" title="Flagged">⚑</span>' : ''}
                      <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">Sec ${q.section}</span>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          `}
        </div>

        <div class="bg-slate-100 border-t border-slate-200 px-5 py-3 flex justify-between items-center">
          <button type="button" data-action="open-review-screen" class="text-xs font-semibold text-[#d31245] hover:underline">Go to Item Review Screen</button>
          <button type="button" data-action="toggle-navigator" class="px-4 py-1.5 rounded bg-[#1b365d] text-white text-xs font-semibold">Close</button>
        </div>
      </div>
    </div>
  `;
}

function renderHelpModal() {
  return `
    <div class="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
      <div class="bg-white border border-slate-300 rounded-lg shadow-2xl w-full max-w-md overflow-hidden">
        <div class="bg-[#1b365d] text-white px-5 py-3 flex items-center justify-between">
          <h3 class="font-bold text-sm">ACCA CBE Exam Help</h3>
          <button type="button" data-action="toggle-help" class="text-slate-300 hover:text-white text-xl leading-none">&times;</button>
        </div>
        <div class="p-5 text-xs sm:text-sm text-slate-700 space-y-2.5">
          <p><strong>Highlight:</strong> Click <em>Highlight</em>, then drag across any text in the scenario or question stem to highlight key figures in yellow.</p>
          <p><strong>Strikethrough:</strong> Enable <em>Strikethrough</em> (or right-click any MCQ option) to cross out eliminated answers.</p>
          <p><strong>Flag for Review:</strong> Mark tricky questions to revisit them quickly via the <em>Navigator</em> or <em>Item Review</em> screen.</p>
          <p><strong>Timer:</strong> Click the timer in the top-right to hide or show it at any time. At 15 mins remaining it turns amber; at 5 mins it flashes red.</p>
        </div>
        <div class="bg-slate-100 px-5 py-3 text-right">
          <button type="button" data-action="toggle-help" class="px-4 py-1.5 rounded bg-[#1b365d] text-white text-xs font-semibold">Got it</button>
        </div>
      </div>
    </div>
  `;
}

function renderReviewScreen() {
  const exam = getExam();
  const ansMap = getExamAnswers(exam.id);
  const flagMap = getExamFlags(exam.id);
  const completeCount = exam.questions.filter(q => isQuestionAnswered(q, ansMap[q.num])).length;
  const incompleteCount = exam.totalQuestions - completeCount;
  const flaggedCount = Object.values(flagMap).filter(Boolean).length;
  const mode = state.timerMode[exam.id] || 'acca';

  return `
    <header class="cbe-header text-white px-4 sm:px-6 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="px-2 py-0.5 rounded bg-[#d31245] font-bold text-xs">ACCA</span>
        <span class="font-semibold text-sm">${exam.title} — Item Review</span>
      </div>
      <div id="cbe-timer-pill" class="flex items-center gap-2 px-3 py-1 rounded text-xs sm:text-sm font-mono-num bg-slate-900/50 text-white border border-slate-500/50">
        <span id="cbe-timer-val">${mode === 'untimed' ? formatTime(state.elapsedSec) : formatTime(state.timeRemainingSec)}</span>
      </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6">
      <div class="bg-white border border-slate-300 rounded-lg shadow-sm overflow-hidden">
        <div class="bg-[#eef2f6] border-b border-slate-300 px-6 py-4 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-lg font-bold text-slate-900">Item Review Screen</h2>
            <p class="text-xs text-slate-600 mt-0.5">Review your question statuses before submitting your exam for marking.</p>
          </div>
          <div class="flex items-center gap-3 text-xs font-semibold">
            <span class="px-2.5 py-1 rounded bg-emerald-100 text-emerald-800">Complete: ${completeCount}</span>
            <span class="px-2.5 py-1 rounded bg-rose-100 text-rose-800">Incomplete: ${incompleteCount}</span>
            <span class="px-2.5 py-1 rounded bg-amber-100 text-amber-800">Flagged: ${flaggedCount}</span>
          </div>
        </div>

        <div class="p-5 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5">
          ${exam.questions.map((q, idx) => {
            const done = isQuestionAnswered(q, ansMap[q.num]);
            const flg = !!flagMap[q.num];
            return `
              <button type="button" data-action="goto-q" data-index="${idx}"
                class="p-2.5 rounded border text-left transition ${done ? 'border-emerald-300 bg-emerald-50/70 hover:bg-emerald-100' : 'border-rose-200 bg-rose-50/50 hover:bg-rose-100'}">
                <div class="flex items-center justify-between">
                  <span class="font-bold text-xs text-slate-900">Q${q.num}</span>
                  ${flg ? '<span class="text-amber-600 text-xs">⚑</span>' : ''}
                </div>
                <div class="text-[11px] mt-0.5 ${done ? 'text-emerald-700' : 'text-rose-700'} font-medium">${done ? 'Complete' : 'Incomplete'}</div>
                <div class="text-[10px] text-slate-500">Section ${q.section}</div>
              </button>
            `;
          }).join('')}
        </div>

        <div class="bg-[#eef2f6] border-t border-slate-300 px-6 py-4 flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" data-action="back-to-exam"
              class="px-4 py-2 rounded border border-slate-300 bg-white text-slate-800 hover:bg-slate-100 text-sm font-semibold">
              ← Return to Exam
            </button>
            ${incompleteCount > 0 ? `
              <button type="button" data-action="jump-first-incomplete"
                class="px-3.5 py-2 rounded border border-rose-300 bg-rose-50 text-rose-800 hover:bg-rose-100 text-xs font-semibold">
                Review Incomplete (${incompleteCount})
              </button>
            ` : ''}
            ${flaggedCount > 0 ? `
              <button type="button" data-action="jump-first-flagged"
                class="px-3.5 py-2 rounded border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 text-xs font-semibold">
                Review Flagged (${flaggedCount})
              </button>
            ` : ''}
          </div>
          <button type="button" data-action="confirm-submit"

            ${incompleteCount > 0 ? `<p class="text-rose-700 font-medium">Warning: ${incompleteCount} question(s) are still incomplete and will receive 0 marks.</p>` : ''}
            <p>Are you sure you want to finish and view your results and IFRS/IAS worked solutions?</p>
          </div>
          <div class="bg-slate-100 px-5 py-3 flex justify-end gap-2">

            <button type="button" data-action="final-submit" class="px-5 py-1.5 rounded bg-[#d31245] text-white text-xs font-bold">Yes, End Exam</button>
          </div>
        </div>
      </div>
    ` : ''}
  `;
}

function formatUserAnswer(q, ans) {
  if (!isQuestionAnswered(q, ans)) return '<span class="italic text-slate-400">Not answered</span>';
  if (q.type === 'mcq') {
    const opt = q.options.find(o => o.key === ans);
    return `<strong>${ans}.</strong> ${opt ? opt.text : ans}`;
  }
  if (q.type === 'multi') {
    return ans.map(k => {
      const opt = q.options.find(o => o.key === k);
      return `<div><strong>${k}.</strong> ${opt ? opt.text : k}</div>`;
    }).join('');
  }
  if (q.type === 'number') return `${q.prefix || ''}${ans} ${q.suffix || ''}`;
  if (q.type === 'tf_matrix' || q.type === 'dropdown_table') {
    return q.rows.map(r => `<div>${r.label || r.text}: <strong>${ans[r.id] || '—'}</strong></div>`).join('');
  }
  return String(ans);
}

function formatCorrectAnswer(q) {
  if (q.type === 'mcq') {
    const opt = q.options.find(o => o.key === q.correct);
    return `<strong>${q.correct}.</strong> ${opt ? opt.text : q.correct}`;
  }
  if (q.type === 'multi') {
    return q.correct.map(k => {
      const opt = q.options.find(o => o.key === k);
      return `<div><strong>${k}.</strong> ${opt ? opt.text : k}</div>`;
    }).join('');
  }
  if (q.type === 'number') return `<strong>${q.displayCorrect}</strong>`;
  if (q.type === 'tf_matrix' || q.type === 'dropdown_table') {
    return q.rows.map(r => `<div>${r.label || r.text}: <strong>${r.correct}</strong></div>`).join('');
  }
  return '';
}

            <button type="button" data-action="set-results-filter" data-filter="flagged" class="px-2.5 py-1 rounded font-semibold ${state.resultsFilter === 'flagged' ? 'bg-amber-600 text-white' : 'bg-white border border-slate-300 text-slate-700'}">Flagged</button>

function attachEventListeners() {
  const root = document.getElementById('app');

  // Number input live binding
  const numInput = document.getElementById('num-answer-input');
  if (numInput) {
    numInput.addEventListener('input', (e) => {
      const qnum = Number(e.target.getAttribute('data-qnum'));
      const exam = getExam();
      const q = exam ? exam.questions.find(item => item.num === qnum) : null;
      getExamAnswers()[qnum] = e.target.value;
      saveState();
      updateAnsweredCountDOM();
      if (q) updateNumPreviewDOM(q, e.target.value);
    });
  }

  // Click-to-unhighlight individual yellow highlight when Highlight mode is active
  if (state.highlightMode) {
    root.querySelectorAll('.cbe-highlight').forEach(span => {
      span.addEventListener('click', (e) => {
        e.stopPropagation();
        const host = span.closest('[data-highlightable="true"]');
        const parent = span.parentNode;
        while (span.firstChild) parent.insertBefore(span.firstChild, span);
        parent.removeChild(span);
        if (host) {
          const key = host.getAttribute('data-hl-key');
          if (!state.highlights[state.activeExamId]) state.highlights[state.activeExamId] = {};
          state.highlights[state.activeExamId][key] = host.innerHTML;
        }
      });
    });
  }

  // Draggable floating windows (Calculator & Scratch Pad)
  root.querySelectorAll('[data-drag-target]').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      if (e.target.closest('button')) return;
      const which = handle.getAttribute('data-drag-target');
      const win = handle.closest('.floating-window');
      if (!win) return;
      const rect = win.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      const offsetY = e.clientY - rect.top;
      function onMove(ev) {
        const nx = Math.max(4, Math.min(window.innerWidth - rect.width - 4, ev.clientX - offsetX));
        const ny = Math.max(4, Math.min(window.innerHeight - 48, ev.clientY - offsetY));
        win.style.left = nx + 'px';
        win.style.right = 'auto';
        win.style.top = ny + 'px';
        if (which === 'calc') state.calcPos = { left: nx, top: ny };
        else state.scratchPos = { left: nx, top: ny };
      }
      function onUp() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      }
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });
  });

  // Scratchpad live binding
  const scratchArea = document.getElementById('scratchpad-area');
  if (scratchArea) {
    scratchArea.addEventListener('input', (e) => {
      state.scratchpad[state.activeExamId] = e.target.value;
      saveState();
    });
  }

  // Dropdown select bindings
  root.querySelectorAll('select[data-action="select-dropdown"]').forEach(sel => {
    sel.addEventListener('change', (e) => {
      const qnum = Number(e.target.getAttribute('data-qnum'));
      const rowid = e.target.getAttribute('data-rowid');
      const ansMap = getExamAnswers();
      if (!ansMap[qnum] || typeof ansMap[qnum] !== 'object') ansMap[qnum] = {};
      ansMap[qnum][rowid] = e.target.value;
      saveState();
      render();
    });
  });

  // TF matrix radio bindings
  root.querySelectorAll('input[data-action="select-tf"]').forEach(inp => {
    inp.addEventListener('change', (e) => {
      const qnum = Number(e.target.getAttribute('data-qnum'));
      const rowid = e.target.getAttribute('data-rowid');
      const ansMap = getExamAnswers();
      if (!ansMap[qnum] || typeof ansMap[qnum] !== 'object') ansMap[qnum] = {};
      ansMap[qnum][rowid] = e.target.value;
      saveState();
      render();
    });
  });

  // Highlight mouseup
  root.querySelectorAll('[data-highlightable="true"]').forEach(el => {
    el.addEventListener('mouseup', applyHighlightSelection);
  });

  // Right-click strikethrough on MCQ/Multi options
  root.querySelectorAll('.cbe-option-row').forEach(row => {
    row.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const qnum = row.getAttribute('data-qnum');
      const key = row.getAttribute('data-key');
      const struck = getExamStruck();
      const sk = `${qnum}_${key}`;
      struck[sk] = !struck[sk];
      saveState();
      render();
    });
  });
}

// Global click delegation on #app
document.getElementById('app').addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.getAttribute('data-action');

  if (action === 'set-timer-mode') {
    const examId = target.getAttribute('data-exam');
    const mode = target.getAttribute('data-mode');
    state.timerMode[examId] = mode;
    saveState();
    render();
  } else if (action === 'open-instructions') {
    openInstructions(target.getAttribute('data-exam'));
  } else if (action === 'fresh-start') {
    const examId = target.getAttribute('data-exam');
    state.answers[examId] = {};
    state.flags[examId] = {};
    state.visited[examId] = {};
    state.struck[examId] = {};
    delete state.history[examId];
    delete state.savedTimers[examId];
    saveState();
    render();
  } else if (action === 'view-last-results') {
    state.activeExamId = target.getAttribute('data-exam');
    state.resultsFilter = 'all';
    state.view = 'results';
    render();
  } else if (action === 'go-home') {
    stopTimer();
    state.view = 'home';
    render();
  } else if (action === 'start-exam-fresh') {
    launchExam(target.getAttribute('data-exam'), true);
  } else if (action === 'start-exam-resume') {
    launchExam(target.getAttribute('data-exam'), false);
  } else if (action === 'select-mcq') {
    const qnum = Number(target.getAttribute('data-qnum'));
    const key = target.getAttribute('data-key');
    if (state.strikeMode) {
      const struck = getExamStruck();
      struck[`${qnum}_${key}`] = !struck[`${qnum}_${key}`];
    } else {
      getExamAnswers()[qnum] = key;
    }
    saveState();
    render();
  } else if (action === 'toggle-multi') {
    const qnum = Number(target.getAttribute('data-qnum'));
    const key = target.getAttribute('data-key');
    const limit = Number(target.getAttribute('data-limit'));
    if (state.strikeMode) {
      const struck = getExamStruck();
      struck[`${qnum}_${key}`] = !struck[`${qnum}_${key}`];
    } else {
      const ansMap = getExamAnswers();
      let arr = Array.isArray(ansMap[qnum]) ? [...ansMap[qnum]] : [];
      if (arr.includes(key)) {
        arr = arr.filter(k => k !== key);
        state.multiNotice = '';
      } else if (arr.length >= limit) {
        state.multiNotice = `You have already selected ${limit} options. Deselect one option before choosing another.`;
      } else {
        arr.push(key);
        state.multiNotice = '';
      }
      ansMap[qnum] = arr;
    }
    saveState();
    render();
  } else if (action === 'prev-q') {
    goToQuestion(state.currentQIndex - 1);
  } else if (action === 'next-q') {
    goToQuestion(state.currentQIndex + 1);
  } else if (action === 'goto-q') {
    goToQuestion(Number(target.getAttribute('data-index')));
  } else if (action === 'toggle-flag') {
    const exam = getExam();
    const q = exam.questions[state.currentQIndex];
    const flagMap = getExamFlags();
    flagMap[q.num] = !flagMap[q.num];
    saveState();
    render();
  } else if (action === 'toggle-calc') {
    state.showCalc = !state.showCalc;
    render();
  } else if (action === 'calc-key') {
    calcPress(target.getAttribute('data-val'));
  } else if (action === 'toggle-scratch') {
    state.showScratch = !state.showScratch;
    render();
  } else if (action === 'clear-scratch') {
    state.scratchpad[state.activeExamId] = '';
    saveState();
    render();
  } else if (action === 'toggle-highlight') {
    state.highlightMode = !state.highlightMode;
    if (state.highlightMode) state.strikeMode = false;
    render();
  } else if (action === 'clear-highlights') {
    clearCurrentHighlights();
  } else if (action === 'toggle-strike') {
    state.strikeMode = !state.strikeMode;
    if (state.strikeMode) state.highlightMode = false;
    render();
  } else if (action === 'toggle-navigator') {
    state.showNavigator = !state.showNavigator;
    render();
  } else if (action === 'set-nav-filter') {
    state.navFilter = target.getAttribute('data-filter');
    render();
  } else if (action === 'toggle-help') {
    state.showHelpModal = !state.showHelpModal;
    render();
  } else if (action === 'toggle-timer-visibility') {
    state.timerHidden = !state.timerHidden;
    updateTimerDOM();
  } else if (action === 'toggle-pause') {
    state.timerPaused = !state.timerPaused;
    render();
  } else if (action === 'open-review-screen') {
    state.showNavigator = false;
    state.showCalc = false;
    state.showScratch = false;
    state.view = 'review_screen';
    render();
  } else if (action === 'back-to-exam') {
    state.view = 'exam';
    render();
  } else if (action === 'confirm-submit') {
    state.showSubmitModal = true;
    render();
  } else if (action === 'cancel-submit') {
    state.showSubmitModal = false;
    render();
  } else if (action === 'final-submit') {
    submitExam(false);
  } else if (action === 'set-results-filter') {
    state.resultsFilter = target.getAttribute('data-filter');
    render();
  } else if (action === 'copy-calc') {
    const val = state.calcDisplay;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(val).catch(() => {});
    } else {
      const ta = document.createElement('textarea');
      ta.value = val;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(ta);
    }
    showToast(`Copied ${val} to clipboard`);
  } else if (action === 'jump-first-incomplete') {
    const exam = getExam();
    const ansMap = getExamAnswers(exam.id);
    const idx = exam.questions.findIndex(q => !isQuestionAnswered(q, ansMap[q.num]));
    if (idx !== -1) goToQuestion(idx);
  } else if (action === 'jump-first-flagged') {
    const exam = getExam();
    const flagMap = getExamFlags(exam.id);
    const idx = exam.questions.findIndex(q => !!flagMap[q.num]);
    if (idx !== -1) goToQuestion(idx);
  }
});

// Keyboard shortcuts during exam (Alt+N / Alt+Right = Next, Alt+P / Alt+Left = Prev, Alt+F = Flag, Alt+C = Calc)
document.addEventListener('keydown', (e) => {
  if (state.view !== 'exam') return;
  const tag = (e.target && e.target.tagName || '').toUpperCase();
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag)) return;
  if (e.altKey && (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight')) {
    e.preventDefault();
    goToQuestion(state.currentQIndex + 1);
  } else if (e.altKey && (e.key === 'p' || e.key === 'P' || e.key === 'ArrowLeft')) {
    e.preventDefault();
    goToQuestion(state.currentQIndex - 1);
  } else if (e.altKey && (e.key === 'f' || e.key === 'F')) {
    e.preventDefault();
    const exam = getExam();
    const q = exam.questions[state.currentQIndex];
    const flagMap = getExamFlags();
    flagMap[q.num] = !flagMap[q.num];
    saveState();
    render();
  } else if (e.altKey && (e.key === 'c' || e.key === 'C')) {
    e.preventDefault();
    state.showCalc = !state.showCalc;
    render();
  }
});

// Init
loadState();
render();
</script>
</body>
</html>
