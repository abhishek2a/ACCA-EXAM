 deposit ($10,000) + Modification/initial direct costs ($7,500) + PV of restoration costs ($2,500) = <strong>$51,700</strong>."}, {"num": 24, "section": "B", "scenarioId": "otq5", "type": "mcq", "topic": "IFRS 16 Lease Liability", "marks": 2, "stem": "<p class='mb-2'>As of 31 December 20X6, the total lease liability is $17,357.</p><p class='font-semibold text-slate-900'>What amount should be recorded as a current liability in respect of the lease at 31 December 20X6?</p>", "options": [{"key": "A", "text": "$8,093"}, {"key": "B", "text": "$8,264"}, {"key": "C", "text": "$9,264"}, {"key": "D", "text": "$9,093"}], "correct": "B", "explanation": "Closing liability at 31 Dec 20X7 (NCL at 31 Dec 20X6) = $17,357 × 1.10 − $10,000 = $9,093. Current liability at 31 Dec 20X6 = $17,357 − $9,093 = <strong>$8,264</strong>."}, {"num": 25, "section": "B", "scenarioId": "otq5", "type": "multi", "selectCount": 2, "topic": "IFRS 16 Exemptions", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IFRS 16 <em>Leases</em>, which TWO of the following would allow a lessee to recognise the lease payments on a straight-line basis as an expense in the statement of profit or loss, instead of recognising a right-of-use asset and a lease liability in the statement of financial position?</p>", "options": [{"key": "A", "text": "The leased asset is of a specialized nature so only the lessee can use it without major modifications being made"}, {"key": "B", "text": "The lease term is for 12 months or less"}, {"key": "C", "text": "The underlying asset, when it is new, is of low value"}, {"key": "D", "text": "The ownership of the leased asset passes to the lessee by the end of the lease term"}, {"key": "E", "text": "The lease term is for the major part of the asset's life"}, {"key": "F", "text": "There is an option to extend the lease term for a secondary period at a rent which is lower than the market rent for a similar asset"}], "correct": ["B", "C"], "explanation": "IFRS 16.5 provides optional exemptions only for short-term leases (&le;12 months, <strong>B</strong>) and low-value underlying assets when new (<strong>C</strong>)."}, {"num": 26, "section": "B", "scenarioId": "otq6", "type": "number", "topic": "IAS 16 Initial Cost", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 16 <em>Property, Plant and Equipment</em>, what is the value of additions to plant for Artem Co for the year ended 30 June 20X5?</p>", "prefix": "$", "suffix": "", "accepted": ["542000"], "displayCorrect": "$542,000", "explanation": "Capitalise purchase price ($525k) + delivery ($3k) + building alterations ($12k) + initial testing ($2k) = <strong>$542,000</strong>. Staff training ($8k) is expensed (IAS 16.19)."}, {"num": 27, "section": "B", "scenarioId": "otq6", "type": "mcq", "topic": "IAS 8 Estimates", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which of the following is TRUE in relation to the change in the remaining useful life of the fixtures and fittings?</p>", "options": [{"key": "A", "text": "It is a change of accounting policy which should be retrospectively applied"}, {"key": "B", "text": "It is a change of accounting policy which should be disclosed in the notes to the financial statements"}, {"key": "C", "text": "It is a change of accounting estimate which should be retrospectively applied"}, {"key": "D", "text": "It is a change of accounting estimate which should be prospectively applied"}], "correct": "D", "explanation": "A revision to useful economic life is a <strong>change in accounting estimate</strong> and is applied <strong>prospectively</strong> under IAS 8.36."}, {"num": 28, "section": "B", "scenarioId": "otq6", "type": "mcq", "topic": "IAS 16 Depreciation", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 16 <em>Property, Plant and Equipment</em>, what is the depreciation charge for the fixtures and fittings for Artem Co for the year ended 30 June 20X5?</p>", "options": [{"key": "A", "text": "$7,500"}, {"key": "B", "text": "$9,000"}, {"key": "C", "text": "$7,750"}, {"key": "D", "text": "$6,750"}], "correct": "D", "explanation": "Annual dep (20X3 &amp; 20X4) = ($50,000 − $5,000) ÷ 8 = $5,625/yr. Carrying amount at 1 Jul 20X4 = $50,000 − (2 × $5,625) = $38,750. Revised dep for 20X5 = ($38,750 − $5,000) ÷ 5 = <strong>$6,750</strong>."}, {"num": 29, "section": "B", "scenarioId": "otq6", "type": "dropdown_table", "topic": "IAS 38 Research", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Identify the correct accounting treatment for the $25,000 costs incurred on the research project during the year ended 30 June 20X4 and select the reason why it is correct in accordance with IAS 38 <em>Intangible Assets</em>.</p>", "headers": ["Requirement", "Selection"], "rows": [{"id": "tr", "label": "Accounting treatment", "options": ["Capitalised as PPE", "Written off to profit or loss", "Provide for", "Capitalise as research"], "correct": "Written off to profit or loss"}, {"id": "rs", "label": "Reason", "options": ["As they are research costs at 30 June 20X4", "As future economic benefits are expected from the use and sale of the machinery", "As machinery will be put into use once completed"], "correct": "As they are research costs at 30 June 20X4"}], "explanation": "Feasibility studies and market research are research costs under IAS 38.54 and must be <strong>written off to profit or loss</strong>."}, {"num": 30, "section": "B", "scenarioId": "otq6", "type": "mcq", "topic": "IAS 38 Development", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 38, which of the following is true when Artem Co moves to the production and testing stage of the prototype during the year ended 30 June 20X5?</p>", "options": [{"key": "A", "text": "The project has moved to the development stage. If the IAS 38 development expenditure criteria are met, Artem Co can choose whether or not to recognise the $80,000 costs as an intangible non-current asset"}, {"key": "B", "text": "The project is still in its research stage and the $80,000 costs incurred by Artem Co cannot be recognised as an intangible non-current asset until a product is ready for sale"}, {"key": "C", "text": "The project has moved to the development stage. If the IAS 38 development expenditure criteria are met, Artem Co must recognise the $80,000 costs as an intangible non-current asset"}, {"key": "D", "text": "The project is still in its research stage and so Artem Co must expense the $80,000 costs to profit or loss"}], "correct": "C", "explanation": "Capitalisation of qualifying development expenditure under IAS 38.57 is <strong>mandatory</strong> (must recognise), not optional."}, {"num": 31, "section": "B", "scenarioId": "otq7", "type": "multi", "selectCount": 2, "topic": "IAS 38 Definition", "marks": 2, "stem": "<p class='mb-2'>IAS 38 <em>Intangible Assets</em> defines such assets as \"an identifiable non-monetary asset without physical substance\".</p><p class='font-semibold text-slate-900'>Which TWO of the following makes an asset identifiable?</p>", "options": [{"key": "A", "text": "It can be separated from the rest of the entity"}, {"key": "B", "text": "It has a cost which can be reliably measured"}, {"key": "C", "text": "It has a useful life in excess of 12 months"}, {"key": "D", "text": "It arises from contractual or legal rights"}], "correct": ["A", "D"], "explanation": "Under <strong>IAS 38.12</strong>, an asset is identifiable if it is separable (<strong>A</strong>) or arises from contractual or other legal rights (<strong>D</strong>)."}, {"num": 32, "section": "B", "scenarioId": "otq7", "type": "number", "topic": "IAS 38 Brands", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the carrying amount of brands in the statement of financial position of Arknee Co as at 31 December 20X5?</p>", "prefix": "$", "suffix": "", "accepted": ["236000"], "displayCorrect": "$236,000", "explanation": "• CollYo: Cannot revalue upward without an active market (IAS 38.75) → Cost $140k − 1 yr amortisation ($14k) = $126,000.<br>• FlowLo: Indefinite life (no amortisation), impaired to recoverable amount = $110,000.<br>• Total = $126,000 + $110,000 = <strong>$236,000</strong>."}, {"num": 33, "section": "B", "scenarioId": "otq7", "type": "tf_matrix", "topic": "IAS 38 Recognition", "marks": 2, "cols": ["Capitalize as intangible asset", "Expense in statement of profit or loss"], "stem": "<p class='mb-2'>The accountant of Arknee Co is considering the accounting treatment of four different types of expenditure.</p><p class='font-semibold text-slate-900'>Match each type of expenditure as described below to its correct accounting treatment.</p>", "rows": [{"id": "r1", "text": "$70,000 developing a new packaging process which will generate no revenue but the management is confident that it will lead to significant cost savings", "correct": "Capitalize as intangible asset"}, {"id": "r2", "text": "$100,000 training staff to operate specialized machinery. Staff are expected to remain with Arknee Co for five years on average", "correct": "Expense in statement of profit or loss"}, {"id": "r3", "text": "$130,000 purchasing a profitable patent from a competitor which went into liquidation during the year due to losses on other products", "correct": "Capitalize as intangible asset"}, {"id": "r4", "text": "$50,000 spent developing a new perfume range, using new production techniques yet to receive government approval", "correct": "Expense in statement of profit or loss"}], "explanation": "Cost savings qualify as future economic benefits (Capitalize); staff training lacks control (Expense); separately purchased patent (Capitalize); awaiting government approval fails technical/commercial feasibility (Expense)."}, {"num": 34, "section": "B", "scenarioId": "otq7", "type": "mcq", "topic": "IAS 38 Development", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What will be the carrying amount of development costs in the statement of financial position of Arknee Co as at 31 December 20X5?</p>", "options": [{"key": "A", "text": "$480,000"}, {"key": "B", "text": "$600,000"}, {"key": "C", "text": "$966,667"}, {"key": "D", "text": "$580,000"}], "correct": "D", "explanation": "All PIRATE criteria are only met from <strong>1 May 20X5</strong> (when funding was approved). Capitalised (1 May – 31 Oct = 6m × $100k) = $600,000. Less 2 months amortisation (Nov–Dec) over 5 yrs: ($600k/5) × 2/12 = $20,000 → <strong>$580,000</strong>."}, {"num": 35, "section": "B", "scenarioId": "otq7", "type": "mcq", "topic": "IFRS 3 Goodwill", "marks": 2, "stem": "<p class='mb-2'>Arknee Co has several subsidiaries. The following notes relate to goodwill:</p><ul class='list-disc pl-5 space-y-1.5 mb-3'><li>During the current year, Arknee Co purchased Orms Co for $500,000. At the date of acquisition, the fair value of Orms Co's net assets was $550,000.</li><li>Goodwill relating to Kerk Co was recognized as $200,000 at acquisition. It is estimated that its value was $230,000 by 31 December 20X5.</li><li>On 1 January 20X4, $600,000 of goodwill arose on the acquisition of Meirs Co. This has been impaired by $40,000 each year since then.</li></ul><p class='font-semibold text-slate-900'>What is total goodwill recognized in the statement of financial position as at 31 December 20X5?</p>", "options": [{"key": "A", "text": "$670,000"}, {"key": "B", "text": "$720,000"}, {"key": "C", "text": "$750,000"}, {"key": "D", "text": "$760,000"}], "correct": "B", "explanation": "• Orms Co: Bargain purchase ($50k gain in P&L) → Goodwill = $0.<br>• Kerk Co: Goodwill cannot be revalued upwards → $200,000.<br>• Meirs Co: $600,000 − (2 yrs × $40,000) = $520,000.<br>• Total = $200,000 + $520,000 = <strong>$720,000</strong>."}, {"num": 36, "section": "B", "scenarioId": "otq8", "type": "mcq", "topic": "IAS 12 Current Tax", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What amount should be shown for income tax expense in the statement of profit or loss for the year ended 30 September 20X4?</p>", "options": [{"key": "A", "text": "$167,000"}, {"key": "B", "text": "$143,000"}, {"key": "C", "text": "$128,000"}, {"key": "D", "text": "$155,000"}], "correct": "B", "explanation": "20X3 provision was $140,000 vs tax paid in 20X4 of $128,000 → over-provision of $12,000 (credit). 20X4 tax expense = $155,000 − $12,000 = <strong>$143,000</strong>."}, {"num": 37, "section": "B", "scenarioId": "otq8", "type": "multi", "selectCount": 2, "topic": "IAS 12 Temporary Differences", "marks": 2, "stem": "<p class='mb-2'>Temporary differences, for the purpose of deferred tax, arise when the carrying amount of an asset or liability does not equal its tax base.</p><p class='font-semibold text-slate-900'>In which TWO of the following circumstances would there be NO temporary differences?</p>", "options": [{"key": "A", "text": "Prepaid expenses which have already been deducted on a cash basis in determining taxable profit of current or previous periods"}, {"key": "B", "text": "Accrued income which will never be taxable"}, {"key": "C", "text": "Accrued expenses which have already been deducted in determining taxable profits for the current or previous periods"}, {"key": "D", "text": "Development expenditure which has been amortised for the year for accounting purposes but which has been deducted in full from taxable profits in the period in which the expense was incurred"}], "correct": ["B", "C"], "explanation": "Non-taxable accrued income has a tax base equal to carrying amount (<strong>B</strong>), and accrued expenses already deducted for tax have a tax base equal to carrying amount (<strong>C</strong>) → nil temporary difference."}, {"num": 38, "section": "B", "scenarioId": "otq8", "type": "mcq", "topic": "IAS 8 Prior Period Errors", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which of the following shows the correct accounting treatment for correction of the error in the 20X6 financial statements?</p>", "options": [{"key": "A", "text": "There will be no impact on the financial statements for the year ended 30 September 20X6 due to additional $37,000 payable"}, {"key": "B", "text": "The additional $37,000 will only be included in SOPL as an expense for the year ended 30 September 20X6"}, {"key": "C", "text": "The additional $37,000 will be included as a reduction in opening retained earnings at 1 October 20X5 and in SOFP as current tax payable for the year ended 30 September 20X6"}, {"key": "D", "text": "The additional $37,000 will be included in both SOFP (payable) and SOPL (expense) for the year ended 30 September 20X6"}], "correct": "C", "explanation": "Under <strong>IAS 8.42</strong>, a material prior period error is corrected retrospectively by adjusting opening retained earnings at 1 October 20X5 and recognising the current tax payable in the SOFP."}, {"num": 39, "section": "B", "scenarioId": "otq8", "type": "tf_matrix", "topic": "IAS 12 DTA vs DTL", "marks": 2, "cols": ["Deferred tax liability", "Deferred tax asset"], "stem": "<p class='font-semibold text-slate-900'>Match each of the following events to the appropriate heading to signify whether it creates a deferred tax asset or liability.</p>", "rows": [{"id": "r1", "text": "Losses carried forward that are likely to result in tax reduction in future", "correct": "Deferred tax asset"}, {"id": "r2", "text": "Interest receivable that has been included in accounting profits but will not be included in taxable profits until cash is received", "correct": "Deferred tax liability"}, {"id": "r3", "text": "The carrying amount of an asset is higher than its tax base", "correct": "Deferred tax liability"}, {"id": "r4", "text": "Research expenditure which has been deducted from accounting profits but will not be tax deductible until a later date", "correct": "Deferred tax asset"}], "explanation": "Tax losses and future deductible expenses create <strong>Deferred tax assets</strong>; future taxable interest receivable and CA &gt; TB on assets create <strong>Deferred tax liabilities</strong>."}, {"num": 40, "section": "B", "scenarioId": "otq8", "type": "mcq", "topic": "IAS 12 Rate Change", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which of the following is the correct adjustment to income tax expense for the year ended 30 September 20X6 in respect of deferred tax?</p>", "options": [{"key": "A", "text": "$2,000 credit"}, {"key": "B", "text": "$5,800 credit"}, {"key": "C", "text": "$2,000 debit"}, {"key": "D", "text": "$5,800 debit"}], "correct": "D", "explanation": "Use the enacted 22% rate: Closing DTL = $390,000 × 22% = $85,800. Opening DTL = $80,000. Increase = <strong>$5,800 debit</strong> to income tax expense."}, {"num": 41, "section": "B", "scenarioId": "otq9", "type": "multi", "selectCount": 2, "topic": "IFRS 16 Leases", "marks": 2, "stem": "<p class='mb-2'>If Vessel Co's jet-ski lease is incorrectly treated as a short-term lease, there will be an impact on the financial statements.</p><p class='font-semibold text-slate-900'>Which TWO of the following will be true if the lease is incorrectly treated as a short-term lease?</p>", "options": [{"key": "A", "text": "Lease payments will be reduced"}, {"key": "B", "text": "Finance cost will be understated"}, {"key": "C", "text": "Non-current liabilities will be overstated"}, {"key": "D", "text": "Total assets will be understated"}], "correct": ["B", "D"], "explanation": "Omitting the ROU asset and lease liability understates total assets (<strong>D</strong>), understates liabilities, and understates finance costs (<strong>B</strong>)."}, {"num": 42, "section": "B", "scenarioId": "otq9", "type": "mcq", "topic": "IFRS 16 Current Liability", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What amount should be included as a current liability on the statement of financial position for the year ended 31 December 20X2 in respect of the jet-ski lease?</p>", "options": [{"key": "A", "text": "$34,020"}, {"key": "B", "text": "$41,400"}, {"key": "C", "text": "$113,580"}, {"key": "D", "text": "$147,600"}], "correct": "A", "explanation": "31 Dec 20X2 liability = $180,000 × 1.05 − $41,400 = $147,600. 31 Dec 20X3 liability (NCL) = $147,600 × 1.05 − $41,400 = $113,580. Current liability = $147,600 − $113,580 = <strong>$34,020</strong>."}, {"num": 43, "section": "B", "scenarioId": "otq9", "type": "mcq", "topic": "IFRS 16 Sale & Leaseback", "marks": 2, "stem": "<p class='mb-2'>On 1 January 20X3, Vessel Co entered a sale and five-year leaseback agreement for a yacht which they had previously owned. It had a carrying amount of $800,000. The yacht's fair value was agreed at $1,050,000. The present value of future lease payments is $900,000 and the transaction satisfies IFRS 15 criteria to be recognized as a sale.</p><p class='font-semibold text-slate-900'>What is the amount to be recognized as right-of-use asset as at 1 January 20X3?</p>", "options": [{"key": "A", "text": "$933,333"}, {"key": "B", "text": "$685,714"}, {"key": "C", "text": "$0"}, {"key": "D", "text": "$1,050,000"}], "correct": "B", "explanation": "Under <strong>IFRS 16.100(a)</strong>, ROU asset = Carrying amount × (PV of lease payments / Fair value) = $800,000 × ($900,000 / $1,050,000) = <strong>$685,714</strong>."}, {"num": 44, "section": "B", "scenarioId": "otq9", "type": "tf_matrix", "topic": "IFRS 16 Lease Identification", "marks": 2, "cols": ["Meets requirement", "Does not meet requirement"], "stem": "<p class='mb-2'>Vessel Co is considering leasing a yacht and has a potential lessor. The terms of the contract proposed by the lessor include:</p><ol class='list-none pl-2 space-y-1.5 mb-3'><li>1) The yacht will be five years old at the start of lease but is expected to have a remaining useful life of ten years. It will be leased for an initial non-cancellable five-year period.</li><li>2) The interest rate implicit in the lease is not readily determinable but Vessel Co has a cost of capital of 6%.</li><li>3) The lessor has the right to substitute the yacht for a similar yacht at any time during the lease term if the lessor requires use of the yacht for its own purpose.</li><li>4) The lessor will perform any necessary repairs and will provide Vessel Co with a substitute yacht while repairs are ongoing.</li></ol><p class='font-semibold text-slate-900'>Match each of the terms with whether it meets the requirements of a lease under IFRS 16 <em>Leases</em>.</p>", "rows": [{"id": "r1", "text": "Term 1 (5-year lease of 5-year-old yacht)", "correct": "Meets requirement"}, {"id": "r2", "text": "Term 2 (Implicit rate not determinable; incremental borrowing rate 6%)", "correct": "Meets requirement"}, {"id": "r3", "text": "Term 3 (Lessor has substantive right to substitute at any time)", "correct": "Does not meet requirement"}, {"id": "r4", "text": "Term 4 (Substitution only during repairs)", "correct": "Meets requirement"}], "explanation": "Term 3 gives the lessor a substantive right of substitution (no identified asset → does not meet IFRS 16 lease definition). Terms 1, 2, and 4 all meet IFRS 16 requirements."}, {"num": 45, "section": "B", "scenarioId": "otq9", "type": "mcq", "topic": "IFRS 16 Short-Term Lease", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In respect of the outboard motor lease, what amount should be included in the statement of profit or loss for the year ended 31 December 20X2?</p>", "options": [{"key": "A", "text": "$5,000"}, {"key": "B", "text": "$108,000"}, {"key": "C", "text": "$27,000"}, {"key": "D", "text": "$100,000"}], "correct": "B", "explanation": "Short-term lease payments are expensed on a straight-line basis over the lease term. Total payments = (4 × $25,000) + (8 × $28,000) = $324,000 ($27,000/month). For 4 months (1 Sep – 31 Dec 20X2): 4 × $27,000 = <strong>$108,000</strong>."}, {"num": 46, "section": "B", "scenarioId": "otq10", "type": "multi", "selectCount": 2, "topic": "IFRS 15 Progress", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In relation to Ahmed Co's contract to build an asset for the customer, which TWO of the following are acceptable methods to measure the progress towards completion according to IFRS 15 <em>Revenue from Contracts with Customers</em>?</p>", "options": [{"key": "A", "text": "Fair value method"}, {"key": "B", "text": "Input method"}, {"key": "C", "text": "Output method"}, {"key": "D", "text": "Amortized cost method"}], "correct": ["B", "C"], "explanation": "IFRS 15.41 permits <strong>Input methods (B)</strong> and <strong>Output methods (C)</strong>."}, {"num": 47, "section": "B", "scenarioId": "otq10", "type": "mcq", "topic": "IFRS 15 Contract Balances", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In respect of the contract to construct a new office for a customer, what is the contract asset or liability as at 30 September 20X5?</p>", "options": [{"key": "A", "text": "A contract liability of $760,000"}, {"key": "B", "text": "A contract asset of $760,000"}, {"key": "C", "text": "A contract asset of $240,000"}, {"key": "D", "text": "A contract liability of $240,000"}], "correct": "A", "explanation": "Revenue recognised = 20% × $1,200,000 = $240,000. Cash received / invoiced = $1,000,000. Excess billed over revenue = $1,000,000 − $240,000 = <strong>Contract liability of $760,000</strong>."}, {"num": 48, "section": "B", "scenarioId": "otq10", "type": "mcq", "topic": "IFRS 15 Financing", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the total amount to be recorded in Ahmed Co's statement of profit or loss for the year ending 30 September 20X5 in respect of the sale of the plant (to the nearest $'000)?</p>", "options": [{"key": "A", "text": "$2,030,000"}, {"key": "B", "text": "$1,915,000"}, {"key": "C", "text": "$2,000,000"}, {"key": "D", "text": "$1,887,000"}], "correct": "B", "explanation": "PV of revenue on 1 Jul 20X5 = $2,000,000 ÷ 1.06 = $1,886,792. Unwinding of interest for 3 months (Jul–Sep) = $1,886,792 × 6% × 3/12 = $28,302. Total P&L = $1,915,094 ≈ <strong>$1,915,000</strong>."}, {"num": 49, "section": "B", "scenarioId": "otq10", "type": "mcq", "topic": "IFRS 15 Bundled Servicing", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In respect of the current year sale of equipment, what is the total revenue that should be recognised by Ahmed Co in profit or loss for the year ended 30 September 20X5?</p>", "options": [{"key": "A", "text": "$3,583,000"}, {"key": "B", "text": "$3,540,000"}, {"key": "C", "text": "$3,620,000"}, {"key": "D", "text": "$4,420,000"}], "correct": "C", "explanation": "2-yr servicing stand-alone price = $400k × 2 × 1.20 = $960,000 ($40k/month). Equipment revenue (residual) = $4,500,000 − $960,000 = $3,540,000. Servicing earned in 2 months (Aug–Sep) = 2 × $40,000 = $80,000. Total = $3,540,000 + $80,000 = <strong>$3,620,000</strong>."}, {"num": 50, "section": "B", "scenarioId": "otq10", "type": "mcq", "topic": "IFRS 15 Discounts", "marks": 2, "stem": "<p class='mb-2'>From 1 October 20X6, Ahmed Co is considering combining two products into a single package. The package will be sold at a discount when compared to the sum of the stand-alone selling prices for the individual items. It is expected that customers will rarely buy the products individually if the above proposal is taken forward.</p><p class='font-semibold text-slate-900'>Which of the following describes the correct accounting treatment for the above proposal?</p>", "options": [{"key": "A", "text": "Apply the discount to the product with the highest individual stand-alone selling price only"}, {"key": "B", "text": "Allocate the discount proportionately to both of the products in the package"}, {"key": "C", "text": "Apply the discount to the product with the lowest individual stand-alone selling price only"}, {"key": "D", "text": "Recognise revenue at the sum of the stand-alone selling prices for the individual items and recognise the discount separately in cost of sales"}], "correct": "B", "explanation": "Under <strong>IFRS 15.81</strong>, allocate the package discount <strong>proportionately to both products</strong> based on their stand-alone selling prices."}, {"num": 51, "section": "B", "scenarioId": "otq11", "type": "mcq", "topic": "IAS 36 Recoverable Amount", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 36 <em>Impairment of Assets</em>, which of the following statements correctly defines the recoverable amount of an asset?</p>", "options": [{"key": "A", "text": "Recoverable amount is the higher of fair value less costs of disposal and value in use."}, {"key": "B", "text": "Recoverable amount is the amount which would be received if the item was to be sold at arm's length."}, {"key": "C", "text": "Recoverable amount is the lower of carrying amount and fair value less costs of disposal."}, {"key": "D", "text": "Recoverable amount is the lower of carrying amount and value in use."}], "correct": "A", "explanation": "Under <strong>IAS 36.6</strong>, recoverable amount is the higher of an asset's fair value less costs of disposal and its value in use."}, {"num": 52, "section": "B", "scenarioId": "otq11", "type": "mcq", "topic": "IAS 36 Annual Review", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 36 <em>Impairment of Assets</em>, which of the following Matti Co assets requires an annual impairment review?</p>", "options": [{"key": "A", "text": "The brand only"}, {"key": "B", "text": "The brand, the building, and the plant"}, {"key": "C", "text": "The building only"}, {"key": "D", "text": "The plant only"}], "correct": "A", "explanation": "Under <strong>IAS 36.10</strong>, intangible assets with an <em>indefinite useful life</em> (the brand) require a mandatory annual impairment review regardless of indicators."}, {"num": 53, "section": "B", "scenarioId": "otq11", "type": "mcq", "topic": "IAS 36 Plant", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What should be recorded in relation to the impairment of the plant at 31 December 20X8?</p>", "options": [{"key": "A", "text": "No gain and no loss"}, {"key": "B", "text": "$0.2m gain in other comprehensive income"}, {"key": "C", "text": "$0.2m loss in the statement of profit or loss"}, {"key": "D", "text": "$0.7m loss in the statement of profit or loss"}], "correct": "A", "explanation": "Recoverable amount = higher of VIU ($6.9m) and FVLCD ($6.0m) = $6.9m. Since RA ($6.9m) &gt; Carrying amount ($6.7m), there is no impairment and no gain is recognised under the cost model."}, {"num": 54, "section": "B", "scenarioId": "otq11", "type": "mcq", "topic": "IAS 36 Reversal", "marks": 2, "stem": "<p class='mb-2'>The building has been previously impaired due to a fall in property prices and has a carrying amount of $16m on 31 December 20X8. Property prices have since recovered. The recoverable amount of the building is based on fair value. On 31 December 20X8 the fair value is $21m and disposal costs are estimated to be $1m.</p><p class='font-semibold text-slate-900'>What amount should Matti Co recognize in the statement of profit or loss for the year ended 31 December 20X8 in respect of the reversal of the impairment?</p>", "options": [{"key": "A", "text": "$4m"}, {"key": "B", "text": "$0m"}, {"key": "C", "text": "$3m"}, {"key": "D", "text": "$5m"}], "correct": "C", "explanation": "Under <strong>IAS 36.117</strong>, an impairment reversal cannot increase carrying amount above depreciated historical cost had no impairment occurred: $25m − (6/25 × $25m) = $19m. Even though FVLCD is $20m, the reversal is capped at $19m − $16m = <strong>$3m</strong>."}, {"num": 55, "section": "B", "scenarioId": "otq11", "type": "mcq", "topic": "IAS 36 CGU Allocation", "marks": 2, "stem": "<p class='font-semibold text-slate-900 mb-2'>Which of the following statements regarding any impairment of the investment in Waheedullah Co is correct?</p><ol class='list-decimal pl-5 space-y-1 mb-2'><li>Any impairment in Waheedullah Co should first be allocated to goodwill</li><li>Any impairment in Waheedullah Co should be allocated to intangible assets before being allocated to tangible assets</li></ol>", "options": [{"key": "A", "text": "Both 1 and 2"}, {"key": "B", "text": "1 only"}, {"key": "C", "text": "Neither 1 nor 2"}, {"key": "D", "text": "2 only"}], "correct": "B", "explanation": "Under <strong>IAS 36.104</strong>, CGU impairment is allocated first to goodwill (1 is true), then pro-rata across all remaining non-current assets within scope (tangible and intangible alike — 2 is false)."}, {"num": 56, "section": "B", "scenarioId": "otq12", "type": "mcq", "topic": "IFRS 16 Definition", "marks": 2, "stem": "<p class='font-semibold text-slate-900 mb-2'>Which of the following criteria indicates that a contract should be classified as a lease as per IFRS 16 <em>Leases</em>?</p><ol class='list-none pl-2 space-y-1 mb-2'><li>1) The lessee has the right to control an identified asset for a period of time.</li><li>2) The control of the asset is in exchange for consideration.</li></ol>", "options": [{"key": "A", "text": "1 only"}, {"key": "B", "text": "2 only"}, {"key": "C", "text": "Neither 1 nor 2"}, {"key": "D", "text": "Both 1 and 2"}], "correct": "D", "explanation": "<strong>IFRS 16.9</strong> requires BOTH the right to control the use of an identified asset for a period of time AND in exchange for consideration."}, {"num": 57, "section": "B", "scenarioId": "otq12", "type": "mcq", "topic": "IFRS 16 Current Liability", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the lease liability within current liabilities as at 31 December 20X7 in respect of the building lease?</p>", "options": [{"key": "A", "text": "$0.661m"}, {"key": "B", "text": "$0.212m"}, {"key": "C", "text": "$2m"}, {"key": "D", "text": "$0.624m"}], "correct": "A", "explanation": "31 Dec 20X7 liability = $22.94m × 1.06 − $2.0m = $22.3164m. 31 Dec 20X8 liability (NCL) = $22.3164m × 1.06 − $2.0m = $21.6554m. Current liability = $22.3164m − $21.6554m = <strong>$0.661m</strong>."}, {"num": 58, "section": "B", "scenarioId": "otq12", "type": "mcq", "topic": "IFRS 16 Payments in Advance", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the finance cost in the statement of profit or loss for the year ending 31 December 20X7 in respect of the machinery lease?</p>", "options": [{"key": "A", "text": "$113,650"}, {"key": "B", "text": "$44,325"}, {"key": "C", "text": "$88,650"}, {"key": "D", "text": "$56,825"}], "correct": "B", "explanation": "Payments are in <strong>advance</strong> (on 1 July each year). Liability after 1 July 20X7 payment = $2,273,000 − $500,000 = $1,773,000. Finance cost for 6 months (Jul–Dec) @ 5% = $1,773,000 × 5% × 6/12 = <strong>$44,325</strong>."}, {"num": 59, "section": "B", "scenarioId": "otq12", "type": "mcq", "topic": "IFRS 16 Low-Value Exemption", "marks": 2, "stem": "<p class='font-semibold text-slate-900 mb-2'>Which of the following should be recorded in the financial statements of Bajwa Co for the year ended 31 December 20X7 in respect of the lease of telephone equipment?</p><ol class='list-none pl-2 space-y-1 mb-2'><li>(1) A right-of-use asset</li><li>(2) An accrual</li><li>(3) Lease expense</li><li>(4) Finance costs</li></ol>", "options": [{"key": "A", "text": "2 and 3"}, {"key": "B", "text": "1 and 3"}, {"key": "C", "text": "2 and 4"}, {"key": "D", "text": "1 and 4"}], "correct": "A", "explanation": "Under the low-value exemption, no ROU asset or lease liability/finance cost is recognised; instead, total lease payments are spread straight-line as a <strong>lease expense (3)</strong>, creating an <strong>accrual (2)</strong> because of the 6-month rent-free period."}, {"num": 60, "section": "B", "scenarioId": "otq12", "type": "mcq", "topic": "IFRS 16 Sale & Leaseback", "marks": 2, "stem": "<p class='mb-2'>In 20X8, Bajwa Co proposes to sell some of its assets and lease them back. These items meet the definition of a sale as per IFRS 15 <em>Revenue from Contracts with Customers</em>.</p><p class='font-semibold text-slate-900 mb-2'>How should the sale and leaseback be recorded in Bajwa Co's financial statements?</p><ol class='list-none pl-2 space-y-1 mb-2'><li>(1) A proportion of the total profit on the sale and leaseback should be recorded in the statement of profit or loss.</li><li>(2) The sale and leaseback should be recognised as a secured loan, with interest recorded in profit or loss.</li></ol>", "options": [{"key": "A", "text": "Both 1 and 2"}, {"key": "B", "text": "2 only"}, {"key": "C", "text": "1 only"}, {"key": "D", "text": "Neither 1 nor 2"}], "correct": "C", "explanation": "When the transfer satisfies IFRS 15 as a sale, only the proportion of total gain relating to rights transferred to the buyer-lessor is recognised in P&L (<strong>1 only</strong>). Statement (2) applies only if it fails IFRS 15."}, {"num": 61, "section": "B", "scenarioId": "otq13", "type": "mcq", "topic": "IAS 32 Financial Liability", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which of the following meets the definition of a financial liability in accordance with IAS 32 <em>Financial Instruments: Presentation</em>?</p>", "options": [{"key": "A", "text": "A contractual obligation to pay shareholders the residual value of the business following the settlement of all debts"}, {"key": "B", "text": "A contractual obligation to deliver cash or another financial asset to another entity"}, {"key": "C", "text": "A contractual right of ownership for the equity instrument of another entity"}, {"key": "D", "text": "A contractual right to receive cash or another financial asset from another entity"}], "correct": "B", "explanation": "<strong>IAS 32.11</strong> defines a financial liability as a contractual obligation to deliver cash or another financial asset to another entity."}, {"num": 62, "section": "B", "scenarioId": "otq13", "type": "number", "topic": "IFRS 9 Initial Measurement", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In respect of the loan notes, what will be the initial measurement amount of the liability (to the nearest $)?</p>", "prefix": "$", "suffix": "", "accepted": ["44000"], "displayCorrect": "$44,000", "explanation": "Proceeds after 10% discount = $50,000 × 90% = $45,000. Less issue costs ($1,000) = <strong>$44,000</strong>."}, {"num": 63, "section": "B", "scenarioId": "otq13", "type": "mcq", "topic": "IFRS 9 Amortised Cost", "marks": 2, "stem": "<p class='mb-2'>The carrying amount of the loan notes at 30 November 20X8 was $46,340.</p><p class='font-semibold text-slate-900'>Providing there are no changes in circumstance, what is the expected carrying amount of the loan notes at 30 November 20X9 (to the nearest $)?</p>", "options": [{"key": "A", "text": "$56,330"}, {"key": "B", "text": "$50,000"}, {"key": "C", "text": "$55,098"}, {"key": "D", "text": "$48,937"}], "correct": "D", "explanation": "$46,340 + 11% effective interest ($5,097.40) − 5% coupon on $50,000 ($2,500) = $48,937.40 ≈ <strong>$48,937</strong>."}, {"num": 64, "section": "B", "scenarioId": "otq13", "type": "multi", "selectCount": 2, "topic": "IAS 21 Functional Currency", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which TWO of the following are factors that will determine an entity's functional currency?</p>", "options": [{"key": "A", "text": "The currency in which the financial statements are presented"}, {"key": "B", "text": "The currency in which funds from investing activities are generated"}, {"key": "C", "text": "The currency that mainly influences sales prices for goods and services"}, {"key": "D", "text": "The currency that mainly influences labour, material and other costs of providing goods and services"}], "correct": ["C", "D"], "explanation": "Under <strong>IAS 21.9</strong>, the primary indicators of functional currency are the currency that mainly influences sales prices (<strong>C</strong>) and the currency that mainly influences labour, material, and other costs (<strong>D</strong>)."}, {"num": 65, "section": "B", "scenarioId": "otq13", "type": "mcq", "topic": "IAS 21 Monetary Items", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>How should the foreign exchange balance owed to a supplier be accounted for at 30 November 20X8?</p>", "options": [{"key": "A", "text": "The outstanding amount will be retranslated at an average exchange rate for the year and any gain or loss recognised in other comprehensive income"}, {"key": "B", "text": "The outstanding amount will be retranslated at the exchange rate at the reporting date and any gain or loss recognised in other comprehensive income"}, {"key": "C", "text": "The outstanding amount will be retranslated at the exchange rate at the reporting date and any gain or loss recognised in the statement of profit or loss"}, {"key": "D", "text": "The outstanding amount will be retranslated at an average exchange rate for the year and any gain or loss recognised in the statement of profit or loss"}], "correct": "C", "explanation": "Trade payables are <strong>monetary items</strong>; under IAS 21.23(a) &amp; 28, they are retranslated at the closing (reporting date) exchange rate with gains/losses recognised in <strong>profit or loss</strong>."}, {"num": 66, "section": "B", "scenarioId": "otq14", "type": "dropdown_table", "topic": "IAS 32 Classification", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>How would the following financial instruments be classified in accordance with IAS 32 <em>Financial Instruments: Presentation</em>?</p>", "headers": ["Financial instrument", "Classification"], "rows": [{"id": "ir", "label": "Irredeemable loan notes (no obligation to repay principal)", "options": ["Equity", "Liability", "Both Equity and Liability"], "correct": "Equity"}, {"id": "cv", "label": "Convertible loan notes", "options": ["Equity", "Liability", "Both Equity and Liability"], "correct": "Both Equity and Liability"}, {"id": "os", "label": "Ordinary share capital", "options": ["Equity", "Liability", "Both Equity and Liability"], "correct": "Equity"}], "explanation": "Convertible loan notes are compound instruments split into <strong>Both Equity and Liability</strong>; ordinary share capital is <strong>Equity</strong>; irredeemable instruments with no contractual obligation to deliver cash are <strong>Equity</strong>."}, {"num": 67, "section": "B", "scenarioId": "otq14", "type": "number", "topic": "IFRS 9 Redeemable Pref Shares", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the carrying amount of Huzaifa Co's redeemable preference shares in issue as at 31 March 20X8 (to the nearest dollar)?</p>", "prefix": "$", "suffix": "", "accepted": ["108610", "109000"], "displayCorrect": "$108,610 (key also accepts $109,000 rounded to $'000)", "explanation": "Redeemable preference shares are a financial liability at amortised cost:<br>• Year 1 (to 31 Mar 20X7): $100,000 + 10% ($10,000) − 5.9% ($5,900) = $104,100.<br>• Year 2 (to 31 Mar 20X8): $104,100 + 10% ($10,410) − $5,900 = <strong>$108,610</strong> (the source key rounded to $109,000; both are accepted)."}, {"num": 68, "section": "B", "scenarioId": "otq14", "type": "mcq", "topic": "Equity & Share Premium", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What are the balances carried forward on the equity share capital and share premium account at 31 March 20X8 after accounting for note (1) and note (2)?</p>", "options": [{"key": "A", "text": "Share capital $210,000, share premium $35,000"}, {"key": "B", "text": "Share capital $210,000, share premium $60,000"}, {"key": "C", "text": "Share capital $85,000, share premium $160,000"}, {"key": "D", "text": "Share capital $135,000, share premium $110,000"}], "correct": "D", "explanation": "• Opening: SC $100k, SP $60k.<br>• 1-for-4 bonus (+25,000 shares @ $1): SC +$25k ($125k), SP −$25k ($35k).<br>• Issue 10,000 shares @ $8.50: SC +$10k (<strong>$135,000</strong>), SP +$75k (<strong>$110,000</strong>)."}, {"num": 69, "section": "B", "scenarioId": "otq14", "type": "mcq", "topic": "IAS 32 Issue Costs", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>How should the $20,000 transaction costs of the rights issue during the year ended 31 March 20X9 be accounted for?</p>", "options": [{"key": "A", "text": "$20,000 should be added to retained earnings"}, {"key": "B", "text": "$20,000 should be deducted from the share premium"}, {"key": "C", "text": "$20,000 should be added to the share premium"}, {"key": "D", "text": "$20,000 should be deducted from retained earnings"}], "correct": "B", "explanation": "Under <strong>IAS 32.35</strong>, transaction costs of an equity transaction are accounted for as a deduction from equity (<strong>deducted from share premium</strong>)."}, {"num": 70, "section": "B", "scenarioId": "otq14", "type": "multi", "selectCount": 2, "topic": "IAS 32 Convertible Debt", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 32 <em>Financial Instruments: Presentation</em>, which TWO of the following are true in relation to convertible debt instruments issued by a company?</p>", "options": [{"key": "A", "text": "Convertible debt instruments may be redeemed for cash or converted into ordinary shares at a set date in the future."}, {"key": "B", "text": "On conversion of the debt instrument to equity, there will always be a gain or loss to be recognized in profit or loss"}, {"key": "C", "text": "The initial classification of convertible debt instruments in the statement of financial position is not revised, even if the likelihood of its conversion changes"}, {"key": "D", "text": "The issuer of a convertible debt instrument is committed to making repayments for the full term of the contract, even if conversion takes place early."}], "correct": ["A", "C"], "explanation": "Convertible debt can be redeemed for cash or converted to shares (<strong>A</strong>), and the initial split between debt and equity is never revised even if conversion likelihood changes (<strong>C</strong>, IAS 32.30)."}, {"num": 71, "section": "B", "scenarioId": "otq15", "type": "mcq", "topic": "IAS 33 Rights Issue", "marks": 2, "stem": "<p class='font-semibold text-slate-900 mb-2'>Which, if any, of the following statements regarding the rights issue and earnings per share (EPS) is/are correct?</p><ol class='list-none pl-2 space-y-1 mb-2'><li>I) The rights issue will increase the number of shares used to calculate the basic EPS for 20X8</li><li>II) The rights issue in 20X8 means that basic EPS for 20X7 will also need to be restated</li></ol>", "options": [{"key": "A", "text": "II only"}, {"key": "B", "text": "Both I and II"}, {"key": "C", "text": "Neither I nor II"}, {"key": "D", "text": "I only"}], "correct": "B", "explanation": "A rights issue at a discount contains a bonus element, which both increases the weighted average shares for 20X8 and requires retrospective restatement of comparative 20X7 EPS (<strong>Both I and II</strong>)."}, {"num": 72, "section": "B", "scenarioId": "otq15", "type": "mcq", "topic": "IAS 33 Options", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>How many additional shares need to be included in Ayan Co's diluted earnings per share calculation at 31 December 20X8 in relation to the options?</p>", "options": [{"key": "A", "text": "1.5m"}, {"key": "B", "text": "0.5m"}, {"key": "C", "text": "2.0m"}, {"key": "D", "text": "0"}], "correct": "B", "explanation": "Proceeds = 2m × $2.25 = $4.5m. Shares purchasable at market price ($3) = $4.5m ÷ $3 = 1.5m. Free (dilutive) shares = 2.0m − 1.5m = <strong>0.5m</strong>."}, {"num": 73, "section": "B", "scenarioId": "otq15", "type": "mcq", "topic": "IAS 33 Basic EPS", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 33 <em>Earnings per Share</em>, what is Ayan Co's basic earnings per share for the year ended 31 December 20X8?</p>", "options": [{"key": "A", "text": "$0.46 per share"}, {"key": "B", "text": "$0.43 per share"}, {"key": "C", "text": "$0.45 per share"}, {"key": "D", "text": "$0.42 per share"}], "correct": "C", "explanation": "WANOS = [6m × ($3.00 / $2.80) × 4/12] + [8.4m × 8/12] = 2.143m + 5.600m = 7.743m shares. Basic EPS = $3.5m ÷ 7.743m = $0.452 ≈ <strong>$0.45 per share</strong>."}, {"num": 74, "section": "B", "scenarioId": "otq15", "type": "mcq", "topic": "IAS 10 Events After Reporting", "marks": 2, "stem": "<p class='mb-2'>On 15 January 20X9, a material amount of inventory held by Ayan Co at 31 December 20X8 was sold below its cost value. On 31 January 20X9, a further 1 million shares were issued at full market price.</p><p class='font-semibold text-slate-900'>Which, if any, of these events will affect the basic earnings per share (EPS) calculation for the year ended 31 December 20X8?</p>", "options": [{"key": "A", "text": "The issue of shares only."}, {"key": "B", "text": "Both the sale of inventory and issue of shares."}, {"key": "C", "text": "Neither the sale of inventory nor the issue of shares."}, {"key": "D", "text": "The sale of inventory only."}], "correct": "D", "explanation": "Sale of inventory below cost after year-end is an <strong>adjusting event</strong> (reduces 20X8 profit &amp; EPS). Full-market-price share issue after year-end is a non-adjusting event (does not affect 20X8 EPS)."}, {"num": 75, "section": "B", "scenarioId": "otq15", "type": "mcq", "topic": "IAS 10 Non-Adjusting Events", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the correct treatment for a material non-adjusting event according to IAS 10 <em>Events after the Reporting Period</em>?</p>", "options": [{"key": "A", "text": "Discuss the event at the annual general meeting only"}, {"key": "B", "text": "Make a retrospective adjustment through opening retained earnings"}, {"key": "C", "text": "Disclose the event in the notes to the financial statements"}, {"key": "D", "text": "Make no mention of the event in either the financial statements or at the annual general meeting"}], "correct": "C", "explanation": "Under <strong>IAS 10.21</strong>, material non-adjusting events are <strong>disclosed in the notes</strong> (nature of the event and estimate of its financial effect)."}, {"num": 76, "section": "B", "scenarioId": "otq16", "type": "number", "topic": "IAS 36 CGU Impairment", "marks": 2, "stem": "<p class='mb-2'>The carrying amounts of the assets of Ahsan Co's cash generating unit are:</p><table class='cbe-table max-w-sm'><thead><tr><th>Asset</th><th class='num'>$'000</th></tr></thead><tbody><tr><td>Factory building</td><td class='num'>3,000</td></tr><tr><td>Machine</td><td class='num'>1,500</td></tr><tr><td>Goodwill</td><td class='num'>400</td></tr><tr><td>Net current assets (at recoverable amount)</td><td class='num'>500</td></tr><tr class='font-semibold bg-slate-50'><td>Total</td><td class='num'>5,400</td></tr></tbody></table><p class='mt-2 mb-2'>The finance director estimates the recoverable amount of the cash generating unit to be $4.4m.</p><p class='font-semibold text-slate-900'>What will the carrying amount of the machine be after the impairment loss has been recognized (to the nearest $'000)?</p>", "prefix": "$", "suffix": ",000", "accepted": ["1300"], "displayCorrect": "$1,300,000 (enter 1300)", "explanation": "Total impairment = $5,400k − $4,400k = $1,000k. Allocate $400k to Goodwill first; remaining $600k pro-rata between Building ($3,000k) and Machine ($1,500k) (NCA already at RA). Machine impairment = $600k × (1,500/4,500) = $200k → Closing CA = $1,500k − $200k = <strong>$1,300k</strong>."}, {"num": 77, "section": "B", "scenarioId": "otq16", "type": "mcq", "topic": "IAS 36 CGU Definition", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 36 <em>Impairment of Assets</em>, how should a cash generating unit be defined?</p>", "options": [{"key": "A", "text": "The smallest identifiable group of assets which all combine to produce a single product"}, {"key": "B", "text": "The smallest identifiable group of assets which produce separate profit and loss"}, {"key": "C", "text": "The smallest group of assets which are based at a single site"}, {"key": "D", "text": "The smallest identifiable group of assets from which independent cash flows can be generated"}], "correct": "D", "explanation": "<strong>IAS 36.6</strong> defines a CGU as the smallest identifiable group of assets that generates cash inflows that are largely independent of the cash inflows from other assets or groups of assets."}, {"num": 78, "section": "B", "scenarioId": "otq16", "type": "number", "topic": "IAS 16 Initial Cost", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In respect of the new production line, what amount should be capitalized in Ahsan Co's statement of financial position (to the nearest $'000)?</p>", "prefix": "$", "suffix": ",000", "accepted": ["6077"], "displayCorrect": "$6,077,000 (enter 6077)", "explanation": "Capitalise directly attributable costs: Machine ($4,000k) + Floor reinforcement ($2,000k) + Transport &amp; installation ($50k) + PV dismantling ($20k) + Testing ($5k) + Pre-use safety inspection ($2k) = <strong>$6,077k</strong>. Exclude insurance ($10k), maintenance ($15k), and staff training ($4k)."}, {"num": 79, "section": "B", "scenarioId": "otq16", "type": "multi", "selectCount": 2, "topic": "IAS 36 Indicators", "marks": 2, "stem": "<p class='mb-2'>The cash generating unit is considered to be impaired because of a decline in demand for the product. This is an external indicator of impairment.</p><p class='font-semibold text-slate-900'>Which TWO of the following would also be external indicators of the potential impairment of an asset or cash generating unit?</p>", "options": [{"key": "A", "text": "A rise in the market capitalization of an entity, so that it now exceeds the carrying amount of its net assets"}, {"key": "B", "text": "An increase in market interest rates leading to a rise in the entity's discount rate used in calculating the asset's value in use"}, {"key": "C", "text": "The introduction of legislation limiting the use of an asset"}, {"key": "D", "text": "Adverse changes in the economic performance of the asset"}], "correct": ["B", "C"], "explanation": "Rising market interest rates (<strong>B</strong>) and adverse legal/regulatory changes (<strong>C</strong>) are <em>external</em> indicators (IAS 36.12). Option D is an <em>internal</em> indicator; Option A is positive."}, {"num": 80, "section": "B", "scenarioId": "otq16", "type": "mcq", "topic": "IAS 16 Major Inspections", "marks": 2, "stem": "<p class='mb-2'>To comply with government regulations, the production line machine will need to undergo a major inspection on 15 December 20X5 and once every three years thereafter.</p><p class='font-semibold text-slate-900'>How should the first inspection be accounted for in the financial statements for the year ended 30 June 20X6?</p>", "options": [{"key": "A", "text": "It should be charged in full to profit or loss in the year ended 30 June 20X6"}, {"key": "B", "text": "It should be capitalized as an asset in the year ended 30 June 20X5 and depreciated over the useful life of the machine"}, {"key": "C", "text": "It should be capitalized as an asset in the year ended 30 June 20X6 and depreciated over the 3 years from 15 December 20X5"}, {"key": "D", "text": "It should be provided for in the financial statements for the year ended 30 June 20X5 and the expenditure written off against that provision when incurred"}], "correct": "C", "explanation": "Under <strong>IAS 16.14</strong>, a mandatory major inspection is capitalised as a separate component when performed (in y/e 30 June 20X6) and depreciated over the 3-year period until the next inspection."}, {"num": 81, "section": "B", "scenarioId": "otq17", "type": "number", "topic": "IAS 16 Depreciation", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the depreciation charge for motor vehicles for the year ended 31 December 20X7?</p>", "prefix": "$", "suffix": "", "accepted": ["57500"], "displayCorrect": "$57,500", "explanation": "No depreciation in year of disposal: Remaining cost = $450k − $50k = $400k; Remaining acc. dep = $185k − $15k = $170k; NBV = $230,000. Reducing balance @ 25% = $230,000 × 25% = <strong>$57,500</strong>."}, {"num": 82, "section": "B", "scenarioId": "otq17", "type": "multi", "selectCount": 2, "topic": "IFRS 5 Criteria", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IFRS 5 <em>Non-current Assets Held for Sale and Discontinued Operations</em>, which TWO of the following are NOT part of the criteria for recognizing an asset as held for sale?</p>", "options": [{"key": "A", "text": "It is unlikely that the plan will be significantly changed or withdrawn"}, {"key": "B", "text": "The asset is being actively marketed for sale at a sales price reasonable in relation to its fair value."}, {"key": "C", "text": "The asset is available for immediate sale."}, {"key": "D", "text": "A buyer has been identified."}, {"key": "E", "text": "The sale is highly probable and likely to take place within one month of classification as held for sale."}, {"key": "F", "text": "Management is committed to a plan to sell."}], "correct": ["D", "E"], "explanation": "A specific buyer does NOT need to be identified yet (<strong>D</strong>), and the timeframe is within <em>one year</em> (not one month, <strong>E</strong>)."}, {"num": 83, "section": "B", "scenarioId": "otq17", "type": "mcq", "topic": "IAS 16 Disposal", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the profit or loss arising on the disposal of the machine on 1 November 20X7?</p>", "options": [{"key": "A", "text": "$19,475 profit"}, {"key": "B", "text": "$17,000 loss"}, {"key": "C", "text": "$17,000 profit"}, {"key": "D", "text": "$19,475 loss"}], "correct": "D", "explanation": "Depreciated for 20X5 and 20X6 (none in 20X7): CA = $110,000 × 0.85 × 0.85 = $79,475. Sold for $60,000 → Loss on disposal = <strong>$19,475 loss</strong>."}, {"num": 84, "section": "B", "scenarioId": "otq17", "type": "mcq", "topic": "IAS 16 Revaluation Surplus", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What was the amount of the revaluation surplus in respect of the property as at 31 December 20X6?</p>", "options": [{"key": "A", "text": "$260,000"}, {"key": "B", "text": "$255,000"}, {"key": "C", "text": "$270,000"}, {"key": "D", "text": "$200,000"}], "correct": "B", "explanation": "At 1 Jan 20X6 (2 yrs elapsed): CA = $700k − 2 × ($700k/20 = $35k) = $630k → Revalued to $900k (surplus = $270k). Excess dep in 20X6 = ($900k/18 = $50k) − $35k = $15k transferred to RE. Closing surplus = $270k − $15k = <strong>$255,000</strong>."}, {"num": 85, "section": "B", "scenarioId": "otq17", "type": "number", "topic": "IFRS 5 Measurement", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Assuming the property met the criteria to be classified as held for sale on 31 December 20X7, what is the carrying amount to appear in the statement of financial position as at 31 December 20X7 (to the nearest $'000)?</p>", "prefix": "$", "suffix": ",000", "accepted": ["780"], "displayCorrect": "$780,000 (enter 780)", "explanation": "CA at 31 Dec 20X7 = $900k − (2 yrs × $50k) = $800k. FVLCTS = $850k − $70k = $780k. Lower of $800k and $780k = <strong>$780,000</strong> (enter <strong>780</strong>; corrected from the '78' typo in the source PDF)."}, {"num": 86, "section": "B", "scenarioId": "otq18", "type": "mcq", "topic": "IAS 33 Purpose of EPS", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 33 <em>Earnings per Share</em>, which of the following could account for EPS being a more reliable comparison measure than underlying profit?</p>", "options": [{"key": "A", "text": "EPS uses a consistent way to calculate the denominator"}, {"key": "B", "text": "EPS is based on cash flows which are difficult to manipulate"}, {"key": "C", "text": "EPS shows the amount of earnings that will be paid to shareholders"}, {"key": "D", "text": "EPS is not affected by changes in accounting policy"}], "correct": "A", "explanation": "IAS 33 prescribes a consistent basis for determining the denominator (weighted average number of shares), improving performance comparisons between periods and entities."}, {"num": 87, "section": "B", "scenarioId": "otq18", "type": "mcq", "topic": "IAS 33 Basic EPS", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the basic earnings per share for the year ended 31 December 20X5?</p>", "options": [{"key": "A", "text": "$0.75"}, {"key": "B", "text": "$0.66"}, {"key": "C", "text": "$0.91"}, {"key": "D", "text": "$0.79"}], "correct": "A", "explanation": "WANOS = (8m × 3/12) + (10m × 6/12) + (11m × 3/12) = 2.0m + 5.0m + 2.75m = 9.75m. Basic EPS = $7,312,500 ÷ 9,750,000 = <strong>$0.75</strong>."}, {"num": 88, "section": "B", "scenarioId": "otq18", "type": "mcq", "topic": "Ratio Analysis", "marks": 2, "stem": "<p class='mb-2'>On 1 January 20X6 Warad Co's accountant proposes a rights issue of ordinary shares on 1 February 20X6.</p><p class='font-semibold text-slate-900'>Assuming all of the proceeds are received on 1 February 20X6, which of the following ratios would be increased by the rights issue on that date?</p>", "options": [{"key": "A", "text": "Net profit turnover"}, {"key": "B", "text": "Gross profit margin"}, {"key": "C", "text": "Return on capital employed (ROCE)"}, {"key": "D", "text": "Quick ratio"}], "correct": "D", "explanation": "Receiving cash increases current assets (cash) with no change in current liabilities, immediately increasing the <strong>Quick ratio</strong>. (ROCE decreases because equity/capital employed rises while PBIT is unchanged.)"}, {"num": 89, "section": "B", "scenarioId": "otq18", "type": "mcq", "topic": "IAS 33 Rights Issue", "marks": 2, "stem": "<p class='mb-2'>At 1 January 20X7 Warad Co had 12 million $1 ordinary shares in issue. On 1 May 20X7 it made a 1 for 4 rights issue at a price of $4. The market price of the shares on 1 May 20X7 was $7. This resulted in a theoretical ex-rights value of $6.40.</p><p class='font-semibold text-slate-900'>What is the weighted average number of shares to be used in calculating basic earnings per share for the year ended 31 December 20X7?</p>", "options": [{"key": "A", "text": "14.38m"}, {"key": "B", "text": "16.41m"}, {"key": "C", "text": "13.66m"}, {"key": "D", "text": "14m"}], "correct": "A", "explanation": "WANOS = [12m × ($7.00 / $6.40) × 4/12] + [15m × 8/12] = 4.375m + 10.000m = 14.375m ≈ <strong>14.38m</strong>."}, {"num": 90, "section": "B", "scenarioId": "otq18", "type": "mcq", "topic": "IAS 33 Diluted EPS", "marks": 2, "stem": "<p class='mb-2'>At 1 January 20X8 Warad Co had 15 million $1 ordinary shares in issue. On that date, the directors were granted options to buy 2 million $1 ordinary shares in the company for $2 each. The average market price of Warad Co's shares for the year ended 31 December 20X8 was $5. The profit for the year ended 31 December 20X8 was $9.72m.</p><p class='font-semibold text-slate-900'>What figure will be reported for Warad Co's diluted earnings per share for the year ended 31 December 20X8?</p>", "options": [{"key": "A", "text": "$0.55"}, {"key": "B", "text": "$0.57"}, {"key": "C", "text": "$0.65"}, {"key": "D", "text": "$0.60"}], "correct": "D", "explanation": "Free (bonus) shares from options = 2m × ($5 − $2) / $5 = 1.2m. Diluted shares = 15m + 1.2m = 16.2m. Diluted EPS = $9.72m ÷ 16.2m = <strong>$0.60</strong>."}, {"num": 91, "section": "B", "scenarioId": "otq19", "type": "mcq", "topic": "IFRS 5 Discontinued Ops", "marks": 2, "stem": "<p class='font-semibold text-slate-900 mb-2'>Assuming it has been sold in the reporting period, which of the following would meet the definition of a discontinued operation in accordance with IFRS 5?</p><ol class='list-none pl-2 space-y-1 mb-2'><li>(1) A component of an entity that represents a separate major line of business</li><li>(2) An associate acquired exclusively with a view of resale</li></ol>", "options": [{"key": "A", "text": "1 only"}, {"key": "B", "text": "2 only"}, {"key": "C", "text": "Both 1 and 2"}, {"key": "D", "text": "Neither 1 nor 2"}], "correct": "A", "explanation": "IFRS 5.32 includes a separate major line of business (1) or a <em>subsidiary</em> (not an associate) acquired exclusively with a view to resale."}, {"num": 92, "section": "B", "scenarioId": "otq19", "type": "mcq", "topic": "IFRS 5 Disclosures", "marks": 2, "stem": "<p class='font-semibold text-slate-900 mb-2'>Assuming it has been sold in the reporting period, which of the following should be disclosed in accordance with IFRS 5?</p><ol class='list-none pl-2 space-y-1 mb-2'><li>(1) The gain or loss recognised on the measurement or on the disposal of the assets</li><li>(2) The post-tax profit or loss of discontinued operations</li><li>(3) The related income tax expense on any taxable gains or profits</li></ol>", "options": [{"key": "A", "text": "1 only"}, {"key": "B", "text": "1 and 3"}, {"key": "C", "text": "2 and 3"}, {"key": "D", "text": "1, 2 and 3"}], "correct": "D", "explanation": "IFRS 5.33 requires disclosure of all three items."}, {"num": 93, "section": "B", "scenarioId": "otq19", "type": "mcq", "topic": "IFRS 5 Measurement", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>At what amount should the Garden Furniture division be measured in the statement of financial position as at 31 October 20X4?</p>", "options": [{"key": "A", "text": "$20.01m"}, {"key": "B", "text": "$24.90m"}, {"key": "C", "text": "$26.94m"}, {"key": "D", "text": "$31.35m"}], "correct": "B", "explanation": "Lower of carrying amount ($31,350k) and FVLCTS ($26,940k − $2,040k = $24,900k = <strong>$24.90m</strong>)."}, {"num": 94, "section": "B", "scenarioId": "otq19", "type": "mcq", "topic": "IAS 33 WANOS", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the weighted average number of shares to be applied when calculating basic earnings per share for the year ended 31 October 20X4?</p>", "options": [{"key": "A", "text": "64.5m"}, {"key": "B", "text": "74.5m"}, {"key": "C", "text": "75.0m"}, {"key": "D", "text": "79.5m"}], "correct": "D", "explanation": "(60m × 5/4 × 9/12 = 56.25m) + (93m × 3/12 = 23.25m) = <strong>79.5m</strong>."}, {"num": 95, "section": "B", "scenarioId": "otq19", "type": "mcq", "topic": "IAS 33 Diluted EPS", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What are the earnings to be applied when calculating diluted earnings per share from continuing operations for the year ended 31 October 20X4?</p>", "options": [{"key": "A", "text": "$105.00m"}, {"key": "B", "text": "$104.76m"}, {"key": "C", "text": "$107.76m"}, {"key": "D", "text": "$108.60m"}], "correct": "B", "explanation": "Basic earnings ($103.80m) + 3 months post-tax interest saved ($60m × 8% × 3/12 × 80% = $0.96m) = <strong>$104.76m</strong>."}, {"num": 96, "section": "B", "scenarioId": "otq20", "type": "mcq", "topic": "IAS 8 Prior Period Errors", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>When the understatement in inventory has been accounted for in accordance with IAS 8 <em>Accounting Policies, Changes in Accounting Estimates and Errors</em>, what will the profit before tax be for the year ended 31 December 20X5?</p>", "options": [{"key": "A", "text": "$313,000"}, {"key": "B", "text": "$199,000"}, {"key": "C", "text": "$237,000"}, {"key": "D", "text": "$275,000"}], "correct": "C", "explanation": "20X4 closing inventory (= 20X5 opening inventory) was understated by $38,000 → 20X5 cost of sales was understated by $38,000. Restating 20X5 opening inventory reduces 20X5 PBT by $38,000: $275,000 − $38,000 = <strong>$237,000</strong>."}, {"num": 97, "section": "B", "scenarioId": "otq20", "type": "mcq", "topic": "IAS 8 Policy vs Estimate", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which of the following is correct in accordance with IAS 8 <em>Accounting Policies, Changes in Accounting Estimates and Errors</em>?</p>", "options": [{"key": "A", "text": "Both the change in inventory valuation method and the change in the useful life of the computer equipment are a change in accounting estimate and should be adjusted prospectively."}, {"key": "B", "text": "The change in inventory valuation method is a change in accounting estimate and should be adjusted prospectively whereas the change in the useful life of the computer equipment is a change in accounting policy and should be adjusted retrospectively."}, {"key": "C", "text": "The change in inventory valuation method is a change in accounting policy and should be adjusted retrospectively whereas the change in the useful life of the computer equipment is a change in accounting estimate and should be adjusted prospectively."}, {"key": "D", "text": "Both the change in inventory valuation method and the change in the useful life of the computer equipment are a change in accounting policy and should be adjusted retrospectively."}], "correct": "C", "explanation": "Changing FIFO to AVCO is a <strong>change in accounting policy</strong> (retrospective); changing useful life is a <strong>change in accounting estimate</strong> (prospective)."}, {"num": 98, "section": "B", "scenarioId": "otq20", "type": "mcq", "topic": "IFRS 5 Discontinued Ops", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which of the following is correct in accordance with IFRS 5 <em>Non-current Assets Held for Sale and Discontinued Operations</em>?</p>", "options": [{"key": "A", "text": "Neither division A nor B would be classified as discontinued operations."}, {"key": "B", "text": "Only division A would be classified as a discontinued operation."}, {"key": "C", "text": "Only division B would be classified as a discontinued operation."}, {"key": "D", "text": "Both division A and B would be classified as discontinued operations."}], "correct": "B", "explanation": "Division A represents exit from a separate major line of business (diesel engines) → discontinued operation. Division B is merely relocating brake cable production from Asia to Africa (group continues in brake cables), wait — or is Asia a separate major geographical area of operations? Per the key, <strong>Only division A</strong> is classified as a discontinued operation (B is a relocation of production)."}, {"num": 99, "section": "B", "scenarioId": "otq20", "type": "mcq", "topic": "IFRS 5 Presentation", "marks": 2, "stem": "<p class='mb-2'>In accordance with IFRS 5, for the discontinued operation(s) in the year, Ulysses Co has correctly calculated a single amount comprising the total of the post-tax profit of the discontinued operation(s) and the post-tax gain relating to the disposal of assets.</p><p class='font-semibold text-slate-900'>In accordance with IFRS 5, how should the information relating to the discontinued operation(s) be presented in the financial statements of Ulysses Co for the year ended 31 December 20X6?</p>", "options": [{"key": "A", "text": "The single amount calculated must be presented on the face of the statement of profit or loss."}, {"key": "B", "text": "The single amount calculated can either be presented on the face of the statement of profit or loss or in the notes to the financial statements."}, {"key": "C", "text": "The single amount calculated must be presented in the notes to the financial statements."}, {"key": "D", "text": "The single amount calculated must be presented on the face of the SOFP."}], "correct": "A", "explanation": "Under <strong>IFRS 5.33(a)</strong>, the single post-tax amount for discontinued operations <strong>must be presented on the face of the statement of profit or loss</strong> (with the detailed breakdown either on the face or in the notes)."}, {"num": 100, "section": "B", "scenarioId": "otq20", "type": "mcq", "topic": "Conceptual Framework", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the main enhancing qualitative characteristic reflected in the requirements of IAS 8 <em>Accounting Policies, Changes in Accounting Estimates and Errors</em>?</p>", "options": [{"key": "A", "text": "Comparability"}, {"key": "B", "text": "Timeliness"}, {"key": "C", "text": "Verifiability"}, {"key": "D", "text": "Understandability"}], "correct": "A", "explanation": "Consistent application of accounting policies and retrospective restatement of policy changes/errors primarily enhance <strong>Comparability</strong> across periods."}]},
  {"id": "exam6", "code": "FR-TOP75-MCQ", "title": "Financial Reporting (FR) — Top 75 MCQs", "subtitle": "Sir Sanjay Top 75 Section A Objective Tests • 75 Questions • 150 Marks", "totalQuestions": 75, "totalMarks": 150, "marksPerQuestion": 2, "accaMinutes": 270, "paperMinutes": 135, "sections": [{"id": "A", "name": "Section A — Top 75 Objective Test Questions", "range": [1, 75], "description": "75 individual OT questions (2 marks each = 150 marks)"}], "scenarios": {}, "questions": [{"num": 1, "section": "A", "type": "dropdown_table", "topic": "IAS 20 Grants", "marks": 2, "stem": "<p class='mb-2'>Parred Co buys new equipment on 1 May 20X5 at a cost of $500,000. Depreciation is 20% per annum straight line and the asset has no residual value. The company received a government grant of $150,000 in respect of the equipment and recognised it as deferred income.</p><p class='font-semibold text-slate-900'>What amounts will be included in the financial statements for the year ended 30 April 20X6?</p>", "headers": ["Financial statement", "Amount"], "rows": [{"id": "pl", "label": "Profit or loss", "options": ["$100,000 Dr", "$100,000 Cr", "$90,000 Cr", "$70,000 Dr", "$70,000 Cr", "$30,000 Cr"], "correct": "$70,000 Dr"}, {"id": "cl", "label": "Current liabilities", "options": ["$100,000 Dr", "$100,000 Cr", "$90,000 Cr", "$70,000 Dr", "$70,000 Cr", "$30,000 Cr"], "correct": "$30,000 Cr"}], "explanation": "Depreciation ($100k Dr) − Grant release ($30k Cr) = <strong>$70,000 Dr</strong> in P&amp;L. Next 12 months' deferred income release = <strong>$30,000 Cr</strong> in Current liabilities."}, {"num": 2, "section": "A", "type": "mcq", "topic": "IFRS 10 Disposal of Subsidiary", "marks": 2, "stem": "<p class='mb-2'>Mullared Co acquired 90% of Brussy Co's 3 million $1 ordinary (equity) shares on 1 March 20X4. Goodwill on acquisition was calculated as $10.2m. Non-controlling interests were measured at fair value at the date of acquisition. On 1 June 20X6, Mullared Co disposed of its entire shareholding in Brussy Co for a consideration of $46.5m. Goodwill had not previously been impaired. On 1 June 20X6, Brussy Co had retained earnings of $29.7m and the non-controlling interests in Brussy Co were $8.4m.</p><p class='font-semibold text-slate-900'>What is the profit on disposal to be used in the preparation of the consolidated financial statements for the year ended 31 December 20X6?</p>", "options": [{"key": "A", "text": "$3.6m"}, {"key": "B", "text": "$12m"}, {"key": "C", "text": "$13.8m"}, {"key": "D", "text": "$22.2m"}], "correct": "B", "explanation": "Proceeds ($46.5m) + NCI ($8.4m) − Net assets ($3.0m + $29.7m = $32.7m) − Goodwill ($10.2m) = <strong>$12.0m</strong>."}, {"num": 3, "section": "A", "type": "mcq", "topic": "IAS 38 Amortisation", "marks": 2, "stem": "<p class='mb-2'>Teent Co has capitalised development costs of $6m relating to 'Project Atlantic' as at 31 December 20X2. Expected unit sales: 20X3: 144,000; 20X4: 120,000; 20X5: 96,000 (Total 360,000). No sales after 20X5.</p><p class='font-semibold text-slate-900'>What amount should be charged to the statement of profit or loss for the year ended 31 December 20X3 in respect of the development costs?</p>", "options": [{"key": "A", "text": "$0"}, {"key": "B", "text": "$2m"}, {"key": "C", "text": "$2.4m"}, {"key": "D", "text": "$6m"}], "correct": "C", "explanation": "$6m × (144,000 / 360,000) = <strong>$2.4m</strong>."}, {"num": 4, "section": "A", "type": "mcq", "topic": "IAS 33 Bonus Issue", "marks": 2, "stem": "<p class='mb-2'>Kallott Co's issued share capital has remained at 20 million ordinary shares for many years. On 1 March 20X7, it made a one-for-four issue of bonus shares. Profit attributable to ordinary shareholders: 20X7 $36m; 20X6 $27m.</p><p class='font-semibold text-slate-900'>What basic earnings per share amounts will be reported for the year ended 31 May 20X7?</p>", "options": [{"key": "A", "text": "$1.44 (20X6: $1.35)"}, {"key": "B", "text": "$1.69 (20X6: $1.35)"}, {"key": "C", "text": "$1.44 (20X6: $1.08)"}, {"key": "D", "text": "$1.69 (20X6: $1.08)"}], "correct": "C", "explanation": "Total shares = 20m × 5/4 = 25m. 20X7 EPS = $36m/25m = <strong>$1.44</strong>; Restated 20X6 EPS = $27m/25m = <strong>$1.08</strong>."}, {"num": 5, "section": "A", "type": "mcq", "topic": "IAS 40 Transfer to PPE", "marks": 2, "stem": "<p class='mb-2'>Bandera Co held an investment property (fair value model, FV at 31 Oct 20X1 $7.1m) until 1 January 20X2, when use changed to owner-occupied (FV $8.6m, remaining life 16 years, straight-line monthly depreciation).</p><p class='font-semibold text-slate-900'>What, to the nearest $000, is the net effect of any required adjustments in Bandera Co's statement of profit or loss for the year ended 31 October 20X2?</p>", "options": [{"key": "A", "text": "$1,948,000 Cr"}, {"key": "B", "text": "$1,052,000 Dr"}, {"key": "C", "text": "$1,948,000 Dr"}, {"key": "D", "text": "$1,052,000 Cr"}], "correct": "D", "explanation": "FV gain to P&amp;L = $1,500,000 Cr. Less 10 months depreciation ($8.6m/16 × 10/12 = $447,917 Dr) = <strong>$1,052,000 Cr</strong>."}, {"num": 6, "section": "A", "type": "mcq", "topic": "IAS 20 Grants", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which of the following statements is correct in accordance with IAS 20 <em>Accounting for Government Grants and Disclosure of Government Assistance</em>?</p>", "options": [{"key": "A", "text": "100% of grants related to income are recognized in profit or loss as soon as they have been awarded"}, {"key": "B", "text": "Grants related to income can only be recognized in profit or loss when the grant is received"}, {"key": "C", "text": "If a grant must be repaid it should be accounted for as a change in accounting policy"}, {"key": "D", "text": "Grants related to assets can either be deducted from the carrying amount of the asset or treated as deferred income"}], "correct": "D", "explanation": "IAS 20.24 allows asset grants to be deducted from the asset's carrying amount or presented as deferred income."}, {"num": 7, "section": "A", "type": "mcq", "topic": "IAS 2 Inventories", "marks": 2, "stem": "<p class='mb-2'>At 31 July 20X2, Limpet Co had 200 items of work in progress (WIP) within inventories. The WIP cost $18,000 to date. It is estimated that the WIP would cost $16 per unit to complete and each unit would then sell for $95. Direct selling costs are $3 per unit.</p><p class='font-semibold text-slate-900'>In accordance with IAS 2 <em>Inventories</em>, what is the correct value of Limpet Co's WIP as at 31 July 20X2?</p>", "options": [{"key": "A", "text": "$18,400"}, {"key": "B", "text": "$15,200"}, {"key": "C", "text": "$18,000"}, {"key": "D", "text": "$22,800"}], "correct": "B", "explanation": "NRV per unit = $95 − $16 − $3 = $76 → Total NRV = 200 × $76 = $15,200. Lower of cost ($18,000) and NRV ($15,200) = <strong>$15,200</strong>."}, {"num": 8, "section": "A", "type": "multi", "selectCount": 2, "topic": "IAS 32 Equity", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which TWO of the following transactions will result in an increase to the equity section on the statement of financial position?</p>", "options": [{"key": "A", "text": "1 for 3 rights issue of equity shares"}, {"key": "B", "text": "Issue of ten-year 2% convertible loan notes"}, {"key": "C", "text": "Issue of ten-year 2% non-convertible loan notes"}, {"key": "D", "text": "1 for 3 bonus issue of equity shares"}, {"key": "E", "text": "Issue of ten-year 2% redeemable preference shares"}], "correct": ["A", "B"], "explanation": "A rights issue brings in new cash equity (<strong>A</strong>), and convertible loan notes include a residual equity option component (<strong>B</strong>). A bonus issue merely reclassifies within equity."}, {"num": 9, "section": "A", "type": "multi", "selectCount": 2, "topic": "Ratio Analysis (ROCE)", "marks": 2, "stem": "<p class='mb-2'>The finance director of a company has noticed that the return on capita
