          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10.01"/><line x1="12" y1="10" x2="12" y2="10.01"/><line x1="16" y1="10" x2="16" y2="10.01"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="16" y1="14" x2="16" y2="14.01"/><line x1="8" y1="18" x2="12" y2="18"/><line x1="16" y1="18" x2="16" y2="18.01"/></svg>
          <span>Calculator</span>
        </button>
        <button type="button" data-action="toggle-scratch" class="cbe-btn-tool ${state.showScratch ? 'active' : ''}">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span>Scratch Pad</span>
        </button>
        <button type="button" data-action="toggle-highlight" class="cbe-btn-tool ${state.highlightMode ? 'active' : ''}" title="Select text to highlight in yellow">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
          <span>Highlight</span>
        </button>
        ${state.highlightMode ? `
          <button type="button" data-action="clear-highlights" class="cbe-btn-tool text-xs">Clear HL</button>
        ` : ''}
        <button type="button" data-action="toggle-strike" class="cbe-btn-tool ${state.strikeMode ? 'active' : ''}" title="Click options to cross them out">
          <span class="font-bold line-through text-xs">S</span>
          <span>Strikethrough</span>
        </button>
      </div>

      <div class="flex items-center gap-1.5">
        <button type="button" data-action="toggle-flag" class="cbe-btn-tool ${isFlagged ? 'flagged' : ''}">
          <svg class="w-3.5 h-3.5" fill="${isFlagged ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          <span>${isFlagged ? 'Flagged' : 'Flag for Review'}</span>
        </button>
        <button type="button" data-action="toggle-help" class="cbe-btn-tool">
          <span>Help</span>
        </button>
      </div>
    </div>

    ${state.timerPaused ? `
      <div class="bg-amber-100 border-b border-amber-300 px-4 py-2 text-xs text-amber-900 flex items-center justify-between">
        <span><strong>Timer Paused</strong> — Click Resume when you are ready to continue.</span>
        <button type="button" data-action="toggle-pause" class="px-3 py-1 rounded bg-amber-700 text-white font-semibold">Resume</button>
      </div>
    ` : ''}

    <!-- MAIN EXAM WORKSPACE -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden ${state.highlightMode ? 'highlight-mode-cursor' : ''} ${state.strikeMode ? 'strikethrough-mode-cursor' : ''}" style="min-height: 0;">
      ${scenario ? `
        <!-- LEFT PANE: SCENARIO EXHIBIT (SPLIT SCREEN) -->
        <section class="lg:w-1/2 max-h-[45vh] lg:max-h-none border-b lg:border-b-0 lg:border-r border-slate-300 bg-white flex flex-col overflow-hidden">
          <div class="bg-[#e8edf2] border-b border-slate-300 px-4 py-2 flex items-center justify-between shrink-0">
            <div>
              <span class="text-xs font-bold uppercase tracking-wide text-[#1b365d]">Scenario Exhibit</span>
              <span class="mx-1.5 text-slate-400">|</span>
              <span class="text-xs font-semibold text-slate-800">${scenario.title} (${scenario.rangeLabel})</span>
            </div>
            <span class="text-[11px] px-2 py-0.5 rounded bg-white border border-slate-300 text-slate-600">${scenario.topic}</span>
          </div>
          <div class="p-5 overflow-y-auto cbe-scroll text-[14.5px] leading-relaxed text-slate-800 flex-1" data-highlightable="true" data-hl-key="sc_${scenario.id}">
            ${scenarioHtml}
          </div>
        </section>
      ` : ''}

      <!-- RIGHT / FULL PANE: QUESTION & RESPONSE AREA -->
      <section id="question-pane" class="${scenario ? 'lg:w-1/2' : 'w-full max-w-4xl mx-auto'} bg-white flex-1 flex flex-col overflow-y-auto cbe-scroll">
        ${scenario ? `
          <div class="bg-slate-50 border-b border-slate-200 px-4 py-2 flex items-center gap-1.5 flex-wrap shrink-0">
            <span class="text-xs font-semibold text-slate-500 mr-1">Case Questions:</span>
            ${scenarioQuestions.map(sq => {
              const sIdx = exam.questions.findIndex(item => item.num === sq.num);
              const sAns = isQuestionAnswered(sq, ansMap[sq.num]);
              const sFlg = !!flagMap[sq.num];
              const active = sq.num === q.num;
              return `
                <button type="button" data-action="goto-q" data-index="${sIdx}"
                  class="px-2.5 py-1 rounded text-xs font-semibold border transition flex items-center gap-1 ${
                    active ? 'bg-[#1b365d] text-white border-[#1b365d]' :
                    sAns ? 'bg-emerald-50 text-emerald-800 border-emerald-300 hover:bg-emerald-100' :
                    'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                  }">
                  Q${sq.num}
                  ${sFlg ? '<span class="text-amber-500">⚑</span>' : ''}
                </button>
              `;
            }).join('')}
          </div>
        ` : ''}

        <div class="p-5 sm:p-7 flex-1">
          <div class="flex items-center justify-between gap-2 pb-3 mb-4 border-b border-slate-200">
            <div class="flex items-center gap-2">
              <span class="text-sm font-bold text-[#1b365d]">Question ${q.num}</span>
              <span class="text-xs px-2 py-0.5 rounded bg-slate-100 border border-slate-200 text-slate-600">Section ${q.section}</span>
              <span class="text-xs px-2 py-0.5 rounded bg-blue-50 border border-blue-200 text-[#1b365d] font-medium">${q.marks} Marks</span>
            </div>
            <span class="text-xs text-slate-500">${q.topic}</span>
          </div>

          <div class="text-[15px] leading-relaxed text-slate-800 mb-6" data-highlightable="true" data-hl-key="q_${q.num}">
            ${stemHtml}
          </div>

          ${renderQuestionInput(q, ansMap[q.num], getExamStruck(exam.id))}
        </div>
      </section>
    </main>

    <!-- BOTTOM ACCA CBE NAVIGATION BAR -->
    <footer class="cbe-footer text-white px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2 shrink-0 select-none">
      <div class="flex items-center gap-2">
        <button type="button" data-action="toggle-navigator"
          class="flex items-center gap-1.5 px-3.5 py-1.5 rounded bg-white/15 hover:bg-white/25 border border-white/25 text-xs sm:text-sm font-semibold transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Navigator</span>
        </button>
        <button type="button" data-action="open-review-screen"
          class="px-3.5 py-1.5 rounded bg-[#d31245] hover:bg-[#a80d36] text-white text-xs sm:text-sm font-semibold transition">
          End Exam
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" data-action="prev-q" ${state.currentQIndex === 0 ? 'disabled' : ''}
          class="px-3.5 sm:px-4 py-1.5 rounded bg-white/15 hover:bg-white/25 disabled:opacity-40 disabled:cursor-not-allowed border border-white/25 text-xs sm:text-sm font-semibold transition">
          ← Previous
        </button>
        ${state.currentQIndex < exam.questions.length - 1 ? `
          <button type="button" data-action="next-q"
            class="px-4 sm:px-5 py-1.5 rounded bg-white text-[#1b365d] hover:bg-slate-100 text-xs sm:text-sm font-bold transition shadow-sm">
            Next →
          </button>
        ` : `
          <button type="button" data-action="open-review-screen"
            class="px-4 sm:px-5 py-1.5 rounded bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-bold transition shadow-sm">
            Review &amp; Finish →
          </button>
        `}
      </div>
    </footer>

    ${state.showCalc ? renderCalculatorModal() : ''}
    ${state.showScratch ? renderScratchpadModal() : ''}
    ${state.showNavigator ? renderNavigatorModal() : ''}
    ${state.showHelpModal ? renderHelpModal() : ''}
    <div id="cbe-toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg ${state.toastMsg ? '' : 'hidden'}">${state.toastMsg}</div>
    </div>
  `;
}

function renderQuestionInput(q, currentAns, struckMap) {
  if (q.type === 'mcq') {
    return `
      <div class="space-y-2.5">
        ${q.options.map(opt => {
          const isSelected = currentAns === opt.key;
          const isStruck = !!struckMap[`${q.num}_${opt.key}`];
          return `
            <div data-action="select-mcq" data-qnum="${q.num}" data-key="${opt.key}"
              class="cbe-option-row ${isSelected ? 'selected' : ''} ${isStruck ? 'struck' : ''}">
              <input type="radio" name="q_${q.num}" value="${opt.key}" ${isSelected ? 'checked' : ''} class="mt-1 w-4 h-4 accent-[#1b365d] pointer-events-none shrink-0" />
              <div class="opt-text text-[14.5px] leading-snug text-slate-800">
                <strong class="mr-1.5 text-[#1b365d]">${opt.key}.</strong>${opt.text}
              </div>
            </div>
          `;
        }).join('')}
        <p class="text-[11px] text-slate-400 pt-1">Tip: Right-click any option (or enable Strikethrough) to cross out eliminated answers.</p>
      </div>
    `;
  }

  if (q.type === 'multi') {
    const selectedArr = Array.isArray(currentAns) ? currentAns : [];
    return `
      <div class="space-y-2.5">
        <div class="flex items-center justify-between text-xs mb-1">
          <span class="font-semibold text-[#1b365d]">Select exactly ${q.selectCount} options</span>
          <span class="px-2 py-0.5 rounded ${selectedArr.length === q.selectCount ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} font-semibold">
            Selected: ${selectedArr.length} / ${q.selectCount}
          </span>
        </div>
        ${state.multiNotice ? `<div class="text-xs px-3 py-1.5 rounded bg-amber-50 border border-amber-300 text-amber-900 font-medium">${state.multiNotice}</div>` : ''}
        ${q.options.map(opt => {
          const isSelected = selectedArr.includes(opt.key);
          const isStruck = !!struckMap[`${q.num}_${opt.key}`];
          return `
            <div data-action="toggle-multi" data-qnum="${q.num}" data-key="${opt.key}" data-limit="${q.selectCount}"
              class="cbe-option-row ${isSelected ? 'selected' : ''} ${isStruck ? 'struck' : ''}">
              <input type="checkbox" ${isSelected ? 'checked' : ''} class="mt-1 w-4 h-4 accent-[#1b365d] pointer-events-none shrink-0" />
              <div class="opt-text text-[14.5px] leading-snug text-slate-800">
                <strong class="mr-1.5 text-[#1b365d]">${opt.key}.</strong>${opt.text}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  if (q.type === 'number') {
    const val = typeof currentAns === 'string' ? currentAns : '';
    return `
      <div class="bg-slate-50 border border-slate-300 rounded-lg p-5 max-w-md">
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-2">Enter your numerical answer</label>
        <div class="flex items-center gap-2">
          ${q.prefix ? `<span class="text-base font-bold text-slate-700">${q.prefix}</span>` : ''}
          <input type="text" inputmode="decimal" id="num-answer-input" data-qnum="${q.num}" value="${val.replace(/"/g, '&quot;')}"
            placeholder="Type figure..."
            class="flex-1 bg-white border-2 border-[#1b365d] rounded px-3 py-2 text-base font-mono-num font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-400" />
          ${q.suffix ? `<span class="text-sm font-semibold text-slate-700">${q.suffix}</span>` : ''}
        </div>
        <div id="num-preview-val" class="text-xs font-semibold text-[#1b365d] mt-2 h-4">${val.trim() ? `Preview: ${q.prefix || ''}${val.trim()}${q.suffix ? ' ' + q.suffix : ''}` : ''}</div>
        <p class="text-[11px] text-slate-500 mt-1">Enter digits without currency signs (commas are accepted). Pay attention to any unit shown on the right.</p>
      </div>
    `;
  }

  if (q.type === 'tf_matrix') {
    const valObj = (currentAns && typeof currentAns === 'object') ? currentAns : {};
    const [colA, colB] = q.cols || ['True', 'False'];
    return `
      <div class="overflow-x-auto">
        <table class="cbe-table">
          <thead>
            <tr>
              <th>Statement / Item</th>
              <th class="text-center min-w-[96px]">${colA}</th>
              <th class="text-center min-w-[96px]">${colB}</th>
            </tr>
          </thead>
          <tbody>
            ${q.rows.map(row => `
              <tr>
                <td class="text-slate-800">${row.text}</td>
                <td class="text-center">
                  <label class="inline-flex items-center justify-center w-full py-1 cursor-pointer">
                    <input type="radio" name="tf_${q.num}_${row.id}" data-action="select-tf" data-qnum="${q.num}" data-rowid="${row.id}" value="${colA}" ${valObj[row.id] === colA ? 'checked' : ''} class="w-4 h-4 accent-[#1b365d]" />
                  </label>
                </td>
                <td class="text-center">
                  <label class="inline-flex items-center justify-center w-full py-1 cursor-pointer">
                    <input type="radio" name="tf_${q.num}_${row.id}" data-action="select-tf" data-qnum="${q.num}" data-rowid="${row.id}" value="${colB}" ${valObj[row.id] === colB ? 'checked' : ''} class="w-4 h-4 accent-[#1b365d]" />
                  </label>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  if (q.type === 'dropdown_table') {
    const valObj = (currentAns && typeof currentAns === 'object') ? currentAns : {};
    return `
      <div class="overflow-x-auto max-w-xl">
        <table class="cbe-table">
          <thead>
            <tr>
              <th>${q.headers[0]}</th>
              <th class="w-56">${q.headers[1]}</th>
            </tr>
          </thead>
          <tbody>
            ${q.rows.map(row => `
              <tr>
                <td class="font-medium text-slate-800">${row.label}</td>
                <td>
                  <select data-action="select-dropdown" data-qnum="${q.num}" data-rowid="${row.id}"
                    class="w-full bg-white border border-slate-400 rounded px-2.5 py-1.5 text-sm font-medium text-slate-900 focus:outline-none focus:border-[#1b365d] focus:ring-1 focus:ring-[#1b365d]">
                    <option value="">-- Select --</option>
                    ${row.options.map(opt => `<option value="${opt}" ${valObj[row.id] === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                  </select>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  return '';
}

function renderCalculatorModal() {
  const keys = [
    { l: 'C', v: 'C', cls: 'clr' }, { l: 'CE', v: 'CE', cls: 'clr' }, { l: '⌫', v: 'BACK', cls: 'op' }, { l: '÷', v: '/', cls: 'op' },
    { l: '7', v: '7', cls: '' }, { l: '8', v: '8', cls: '' }, { l: '9', v: '9', cls: '' }, { l: '×', v: '*', cls: 'op' },
    { l: '4', v: '4', cls: '' }, { l: '5', v: '5', cls: '' }, { l: '6', v: '6', cls: '' }, { l: '−', v: '-', cls: 'op' },
    { l: '1', v: '1', cls: '' }, { l: '2', v: '2', cls: '' }, { l: '3', v: '3', cls: '' }, { l: '+', v: '+', cls: 'op' },
    { l: '±', v: 'SIGN', cls: 'op' }, { l: '0', v: '0', cls: '' }, { l: '.', v: '.', cls: '' }, { l: '=', v: '=', cls: 'eq' },
    { l: '√', v: 'SQRT', cls: 'op col-span-2' }, { l: '%', v: '%', cls: 'op col-span-2' }
  ];
  const posStyle = state.calcPos.left !== null
    ? `left:${state.calcPos.left}px; top:${state.calcPos.top}px;`
    : `right:16px; top:${state.calcPos.top}px;`;
  return `
    <div id="calc-window" class="floating-window w-72 overflow-hidden" style="${posStyle}">
      <div data-drag-target="calc" class="drag-handle bg-[#1b365d] text-white px-3.5 py-2 flex items-center justify-between text-xs font-semibold">
        <span>ACCA CBE Calculator</span>
        <div class="flex items-center gap-2">
          <button type="button" data-action="copy-calc" class="text-[11px] bg-white/15 hover:bg-white/25 px-1.5 py-0.5 rounded text-slate-100">Copy</button>
          <button type="button" data-action="toggle-calc" class="text-slate-300 hover:text-white text-base leading-none">&times;</button>
        </div>
      </div>
      <div class="p-3 bg-slate-100">
        <div class="bg-white border border-slate-300 rounded px-3 py-2 text-right mb-2.5">
          <div id="calc-expr" class="text-[11px] text-slate-400 font-mono-num h-4 truncate">${state.calcExpr || '&nbsp;'}</div>
          <div id="calc-display" class="text-xl font-bold font-mono-num text-slate-900 truncate">${state.calcDisplay}</div>
        </div>
        <div class="grid grid-cols-4 gap-1.5">
          ${keys.map(k => `<button type="button" data-action="calc-key" data-val="${k.v}" class="calc-btn ${k.cls}">${k.l}</button>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderScratchpadModal() {
  const txt = state.scratchpad[state.activeExamId] || '';
  const posStyle = `left:${state.scratchPos.left}px; top:${state.scratchPos.top}px;`;
  return `
    <div id="scratch-window" class="floating-window w-80 sm:w-96 overflow-hidden" style="${posStyle}">
      <div data-drag-target="scratch" class="drag-handle bg-[#1b365d] text-white px-3.5 py-2 flex items-center justify-between text-xs font-semibold">
        <span>Scratch Pad (Workings)</span>
        <div class="flex items-center gap-2">
          <button type="button" data-action="clear-scratch" class="text-[11px] text-slate-300 hover:text-white underline">Clear</button>
          <button type="button" data-action="toggle-scratch" class="text-slate-300 hover:text-white text-base leading-none">&times;</button>
        </div>
      </div>
      <div class="p-3 bg-slate-50">
        <textarea id="scratchpad-area" rows="10" placeholder="Write rough workings here (e.g. Lease liability table, WANOS, Deferred Tax movement)..."
          class="w-full border border-slate-300 rounded p-2.5 text-xs font-mono-num text-slate-800 bg-white focus:outline-none focus:border-[#1b365d]">${txt.replace(/</g, '&lt;')}</textarea>
      </div>
    </div>
  `;
}

function renderNavigatorModal() {
  const exam = getExam();
  const ansMap = getExamAnswers(exam.id);
  const flagMap = getExamFlags(exam.id);
  const visMap = getExamVisited(exam.id);

  const filtered = exam.questions.filter(q => {
    const done = isQuestionAnswered(q, ansMap[q.num]);
    const flg = !!flagMap[q.num];
    if (state.navFilter === 'incomplete') return !done;
    if (state.navFilter === 'flagged') return flg;
    return true;
  });

  return `
    <div class="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
      <div class="bg-white border border-slate-300 rounded-lg shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden">
        <div class="bg-[#1b365d] text-white px-5 py-3 flex items-center justify-between">
          <div>
            <h3 class="font-bold text-sm sm:text-base">Navigator</h3>
            <p class="text-[11px] text-slate-300">Click any question number to jump directly to it</p>
          </div>
          <button type="button" data-action="toggle-navigator" class="text-slate-300 hover:text-white text-xl leading-none">&times;</button>
        </div>

        <div class="bg-slate-100 border-b border-slate-200 px-5 py-2.5 flex items-center justify-between flex-wrap gap-2">
          <div class="flex items-center gap-1.5 text-xs">
            <button type="button" data-action="set-nav-filter" data-filter="all" class="px-2.5 py-1 rounded font-semibold ${state.navFilter === 'all' ? 'bg-[#1b365d] text-white' : 'bg-white border border-slate-300 text-slate-700'}">All (${exam.totalQuestions})</button>
            <button type="button" data-action="set-nav-filter" data-filter="incomplete" class="px-2.5 py-1 rounded font-semibold ${state.navFilter === 'incomplete' ? 'bg-[#1b365d] text-white' : 'bg-white border border-slate-300 text-slate-700'}">Incomplete</button>
            <button type="button" data-action="set-nav-filter" data-filter="flagged" class="px-2.5 py-1 rounded font-semibold ${state.navFilter === 'flagged' ? 'bg-[#1b365d] text-white' : 'bg-white border border-slate-300 text-slate-700'}">Flagged</button>
          </div>
          <div class="flex items-center gap-3 text-[11px] text-slate-600">
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>Complete</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>Flagged</span>
          </div>
        </div>

        <div class="p-4 overflow-y-auto cbe-scroll flex-1">
          ${filtered.length === 0 ? `<p class="text-center text-sm text-slate-500 py-8">No questions match this filter.</p>` : `
            <div class="grid ${exam.totalQuestions > 30 ? 'grid-cols-3 sm:grid-cols-5' : 'grid-cols-2 sm:grid-cols-3'} gap-2">
              ${filtered.map(q => {

function formatUserAnswer(q, ans) {
  if (!isQuestionAnswered(q, ans)) return '<span class="italic text-slate-400">Not answered</span>';
  if (q.type === 'mcq') {
    const opt = q.options.find(o => o.key === ans);
    return `<strong>${ans}.</strong> ${opt ? opt.text : ans}`;
  }
  if (q.type === 'multi') {
    return ans.map(k => {
      const opt = q.options.find(o => o.key === k);
      return `<div><strong>${k}.</strong> ${opt ? opt.text : k}</div>`;
    }).join('');
  }
  if (q.type === 'number') return `${q.prefix || ''}${ans} ${q.suffix || ''}`;
  if (q.type === 'tf_matrix' || q.type === 'dropdown_table') {
    return q.rows.map(r => `<div>${r.label || r.text}: <strong>${ans[r.id] || '—'}</strong></div>`).join('');
  }
  return String(ans);
}

function formatCorrectAnswer(q) {
  if (q.type === 'mcq') {
    const opt = q.options.find(o => o.key === q.correct);
    return `<strong>${q.correct}.</strong> ${opt ? opt.text : q.correct}`;
  }
  if (q.type === 'multi') {
    return q.correct.map(k => {
      const opt = q.options.find(o => o.key === k);
      return `<div><strong>${k}.</strong> ${opt ? opt.text : k}</div>`;
    }).join('');
  }
  if (q.type === 'number') return `<strong>${q.displayCorrect}</strong>`;
  if (q.type === 'tf_matrix' || q.type === 'dropdown_table') {
    return q.rows.map(r => `<div>${r.label || r.text}: <strong>${r.correct}</strong></div>`).join('');
  }
  return '';
}

function attachEventListeners() {
  const root = document.getElementById('app');

  // Number input live binding
  const numInput = document.getElementById('num-answer-input');
  if (numInput) {
    numInput.addEventListener('input', (e) => {
      const qnum = Number(e.target.getAttribute('data-qnum'));
      const exam = getExam();
      const q = exam ? exam.questions.find(item => item.num === qnum) : null;
      getExamAnswers()[qnum] = e.target.value;
      saveState();
      updateAnsweredCountDOM();
      if (q) updateNumPreviewDOM(q, e.target.value);
    });
  }

  // Click-to-unhighlight individual yellow highlight when Highlight mode is active
  if (state.highlightMode) {
    root.querySelectorAll('.cbe-highlight').forEach(span => {
      span.addEventListener('click', (e) => {
        e.stopPropagation();
        const host = span.closest('[data-highlightable="true"]');
        const parent = span.parentNode;
        while (span.firstChild) parent.insertBefore(span.firstChild, span);
        parent.removeChild(span);
        if (host) {
          const key = host.getAttribute('data-hl-key');
          if (!state.highlights[state.activeExamId]) state.highlights[state.activeExamId] = {};
          state.highlights[state.activeExamId][key] = host.innerHTML;
        }
      });
    });
  }

  // Draggable floating windows (Calculator & Scratch Pad)
  root.querySelectorAll('[data-drag-target]').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      if (e.target.closest('button')) return;
      const which = handle.getAttribute('data-drag-target');
      const win = handle.closest('.floating-window');
      if (!win) return;
      const rect = win.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      const offsetY = e.clientY - rect.top;
      function onMove(ev) {
        const nx = Math.max(4, Math.min(window.innerWidth - rect.width - 4, ev.clientX - offsetX));
        const ny = Math.max(4, Math.min(window.innerHeight - 48, ev.clientY - offsetY));
        win.style.left = nx + 'px';
        win.style.right = 'auto';
        win.style.top = ny + 'px';
        if (which === 'calc') state.calcPos = { left: nx, top: ny };
        else state.scratchPos = { left: nx, top: ny };
      }
      function onUp() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      }
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });
  });

  // Scratchpad live binding
  const scratchArea = document.getElementById('scratchpad-area');
  if (scratchArea) {
    scratchArea.addEventListener('input', (e) => {
      state.scratchpad[state.activeExamId] = e.target.value;
      saveState();
    });
  }

  // Dropdown select bindings
  root.querySelectorAll('select[data-action="select-dropdown"]').forEach(sel => {
    sel.addEventListener('change', (e) => {
      const qnum = Number(e.target.getAttribute('data-qnum'));
      const rowid = e.target.getAttribute('data-rowid');
      const ansMap = getExamAnswers();
      if (!ansMap[qnum] || typeof ansMap[qnum] !== 'object') ansMap[qnum] = {};
      ansMap[qnum][rowid] = e.target.value;
      saveState();
      render();
    });
  });

  // TF matrix radio bindings
  root.querySelectorAll('input[data-action="select-tf"]').forEach(inp => {
    inp.addEventListener('change', (e) => {
      const qnum = Number(e.target.getAttribute('data-qnum'));
      const rowid = e.target.getAttribute('data-rowid');
      const ansMap = getExamAnswers();
      if (!ansMap[qnum] || typeof ansMap[qnum] !== 'object') ansMap[qnum] = {};
      ansMap[qnum][rowid] = e.target.value;
      saveState();
      render();
    });
  });

  // Highlight mouseup
  root.querySelectorAll('[data-highlightable="true"]').forEach(el => {
    el.addEventListener('mouseup', applyHighlightSelection);
  });

  // Right-click strikethrough on MCQ/Multi options
  root.querySelectorAll('.cbe-option-row').forEach(row => {
    row.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const qnum = row.getAttribute('data-qnum');
      const key = row.getAttribute('data-key');
      const struck = getExamStruck();
      const sk = `${qnum}_${key}`;
      struck[sk] = !struck[sk];
      saveState();
      render();
    });
  });
}

// Global click delegation on #app
document.getElementById('app').addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.getAttribute('data-action');

  if (action === 'set-timer-mode') {
    const examId = target.getAttribute('data-exam');
    const mode = target.getAttribute('data-mode');
    state.timerMode[examId] = mode;
    saveState();
    render();
  } else if (action === 'open-instructions') {
    openInstructions(target.getAttribute('data-exam'));
  } else if (action === 'fresh-start') {
    const examId = target.getAttribute('data-exam');
    state.answers[examId] = {};
    state.flags[examId] = {};
    state.visited[examId] = {};
    state.struck[examId] = {};
    delete state.history[examId];
    delete state.savedTimers[examId];
    saveState();
    render();
  } else if (action === 'view-last-results') {
    state.activeExamId = target.getAttribute('data-exam');
    state.resultsFilter = 'all';
    state.view = 'results';
    render();
  } else if (action === 'go-home') {
    stopTimer();
    state.view = 'home';
    render();
  } else if (action === 'start-exam-fresh') {
    launchExam(target.getAttribute('data-exam'), true);
  } else if (action === 'start-exam-resume') {
    launchExam(target.getAttribute('data-exam'), false);
  } else if (action === 'select-mcq') {
    const qnum = Number(target.getAttribute('data-qnum'));
    const key = target.getAttribute('data-key');
    if (state.strikeMode) {
      const struck = getExamStruck();
      struck[`${qnum}_${key}`] = !struck[`${qnum}_${key}`];
    } else {
      getExamAnswers()[qnum] = key;
    }
    saveState();
    render();
  } else if (action === 'toggle-multi') {
    const qnum = Number(target.getAttribute('data-qnum'));
    const key = target.getAttribute('data-key');
    const limit = Number(target.getAttribute('data-limit'));
    if (state.strikeMode) {
      const struck = getExamStruck();
      struck[`${qnum}_${key}`] = !struck[`${qnum}_${key}`];
    } else {
      const ansMap = getExamAnswers();
      let arr = Array.isArray(ansMap[qnum]) ? [...ansMap[qnum]] : [];
      if (arr.includes(key)) {
        arr = arr.filter(k => k !== key);
        state.multiNotice = '';
      } else if (arr.length >= limit) {
        state.multiNotice = `You have already selected ${limit} options. Deselect one option before choosing another.`;
      } else {
        arr.push(key);
        state.multiNotice = '';
      }
      ansMap[qnum] = arr;
    }
    saveState();
    render();
  } else if (action === 'prev-q') {
    goToQuestion(state.currentQIndex - 1);
  } else if (action === 'next-q') {
    goToQuestion(state.currentQIndex + 1);
  } else if (action === 'goto-q') {
    goToQuestion(Number(target.getAttribute('data-index')));
  } else if (action === 'toggle-flag') {
    const exam = getExam();
    const q = exam.questions[state.currentQIndex];
    const flagMap = getExamFlags();
    flagMap[q.num] = !flagMap[q.num];
    saveState();
    render();
  } else if (action === 'toggle-calc') {
    state.showCalc = !state.showCalc;
    render();
  } else if (action === 'calc-key') {
    calcPress(target.getAttribute('data-val'));
  } else if (action === 'toggle-scratch') {
    state.showScratch = !state.showScratch;
    render();
  } else if (action === 'clear-scratch') {
    state.scratchpad[state.activeExamId] = '';
    saveState();
    render();
  } else if (action === 'toggle-highlight') {
    state.highlightMode = !state.highlightMode;
    if (state.highlightMode) state.strikeMode = false;
    render();
  } else if (action === 'clear-highlights') {
    clearCurrentHighlights();
  } else if (action === 'toggle-strike') {
    state.strikeMode = !state.strikeMode;
    if (state.strikeMode) state.highlightMode = false;
    render();
  } else if (action === 'toggle-navigator') {
    state.showNavigator = !state.showNavigator;
    render();
  } else if (action === 'set-nav-filter') {
    state.navFilter = target.getAttribute('data-filter');
    render();
  } else if (action === 'toggle-help') {
    state.showHelpModal = !state.showHelpModal;
    render();
  } else if (action === 'toggle-timer-visibility') {
    state.timerHidden = !state.timerHidden;
    updateTimerDOM();
  } else if (action === 'toggle-pause') {
    state.timerPaused = !state.timerPaused;
    render();
  } else if (action === 'open-review-screen') {
    state.showNavigator = false;
    state.showCalc = false;
    state.showScratch = false;
    state.view = 'review_screen';
    render();
  } else if (action === 'back-to-exam') {
    state.view = 'exam';
    render();
  } else if (action === 'confirm-submit') {
    state.showSubmitModal = true;
    render();
  } else if (action === 'cancel-submit') {
    state.showSubmitModal = false;
    render();
  } else if (action === 'final-submit') {
    submitExam(false);
  } else if (action === 'set-results-filter') {
    state.resultsFilter = target.getAttribute('data-filter');
    render();
  } else if (action === 'copy-calc') {
    const val = state.calcDisplay;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(val).catch(() => {});
    } else {
      const ta = document.createElement('textarea');
      ta.value = val;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(ta);
    }
    showToast(`Copied ${val} to clipboard`);
  } else if (action === 'jump-first-incomplete') {
    const exam = getExam();
    const ansMap = getExamAnswers(exam.id);
    const idx = exam.questions.findIndex(q => !isQuestionAnswered(q, ansMap[q.num]));
    if (idx !== -1) goToQuestion(idx);
  } else if (action === 'jump-first-flagged') {
    const exam = getExam();
    const flagMap = getExamFlags(exam.id);
    const idx = exam.questions.findIndex(q => !!flagMap[q.num]);
    if (idx !== -1) goToQuestion(idx);
  }
});

// Keyboard shortcuts during exam (Alt+N / Alt+Right = Next, Alt+P / Alt+Left = Prev, Alt+F = Flag, Alt+C = Calc)
document.addEventListener('keydown', (e) => {
  if (state.view !== 'exam') return;
  const tag = (e.target && e.target.tagName || '').toUpperCase();
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag)) return;
  if (e.altKey && (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight')) {
    e.preventDefault();
    goToQuestion(state.currentQIndex + 1);
  } else if (e.altKey && (e.key === 'p' || e.key === 'P' || e.key === 'ArrowLeft')) {
    e.preventDefault();
    goToQuestion(state.currentQIndex - 1);
  } else if (e.altKey && (e.key === 'f' || e.key === 'F')) {
    e.preventDefault();
    const exam = getExam();
    const q = exam.questions[state.currentQIndex];
    const flagMap = getExamFlags();
    flagMap[q.num] = !flagMap[q.num];
    saveState();
    render();
  } else if (e.altKey && (e.key === 'c' || e.key === 'C')) {
    e.preventDefault();
    state.showCalc = !state.showCalc;
    render();
  }
});

// Init
loadState();
render();
</script>
