    :root {

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--cbe-bg);

    .cbe-btn-tool {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: 4px; font-size: 13px; font-weight: 500;

    .cbe-btn-tool:hover { background: #e2e8f0; border-color: #94a3b8; }
    .cbe-btn-tool.active { background: #1b365d; color: #ffffff; border-color: #1b365d; }
    .cbe-btn-tool.flagged { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
    .cbe-option-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 6px;
      background: #ffffff; transition: all 0.15s ease; cursor: pointer;
    }
    .cbe-option-row:hover { border-color: #1b365d; background: #f8fafc; }
    .cbe-option-row.selected { border-color: #1b365d; background: #eff6ff; box-shadow: inset 3px 0 0 #1b365d; }
    .cbe-option-row.struck .opt-text { text-decoration: line-through; color: #94a3b8; }
    .cbe-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13.5px; }
    .cbe-table th, .cbe-table td { border: 1px solid #94a3b8; padding: 8px 12px; text-align: left; }
    .cbe-table th { background: #e8edf2; font-weight: 600; color: #0f172a; }
    .cbe-table td.num, .cbe-table th.num { text-align: right; font-variant-numeric: tabular-nums; }

    .cbe-scroll::-webkit-scrollbar-thumb:hover { background: #64748b; }
    .floating-window {
      position: fixed; z-index: 60; background: #ffffff;
      border: 1px solid #94a3b8; border-radius: 8px;
      box-shadow: 0 20px 35px -5px rgba(15, 23, 42, 0.25), 0 8px 12px -6px rgba(15, 23, 42, 0.15);

      0%, 100% { background-color: #dc2626; }

    }
    .timer-critical { animation: pulseWarn 1.2s infinite; }
    .calc-btn {
      padding: 10px 6px; border-radius: 5px; font-weight: 600; font-size: 14px;
      border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a;
      transition: background 0.1s; cursor: pointer;

    .calc-btn:hover { background: #e2e8f0; }
    .calc-btn.op { background: #e0e7ff; color: #1e3a8a; border-color: #c7d2fe; }
    .calc-btn.op:hover { background: #c7d2fe; }
    .calc-btn.eq { background: #1b365d; color: #ffffff; border-color: #1b365d; }
    .calc-btn.eq:hover { background: #132744; }

const EXAMS = [
  {
    id: 'exam1',
    code: 'FR-MOCK-OCT26',
    title: 'Financial Reporting (FR) — Mock Test',
    subtitle: 'BCOM ACCA FR B1 • Oct 2026 • Indian Institute of Commerce Lakshya',
    totalQuestions: 30,
    totalMarks: 60,
    marksPerQuestion: 2,
    accaMinutes: 108, // ACCA Standard: 1.8 mins per mark (180 mins / 100 marks)
    paperMinutes: 100, // Stated on paper
    sections: [
      { id: 'A', name: 'Section A — Objective Test Questions', range: [1, 15], description: '15 individual questions (2 marks each = 30 marks)' },
      { id: 'B', name: 'Section B — Objective Test Case Scenarios', range: [16, 30], description: '3 scenarios × 5 questions each (2 marks each = 30 marks)' }
    ],
    scenarios: {
      grinnit: {
        id: 'grinnit',
        title: 'GRINNIT CO',
        rangeLabel: 'Questions 16 – 20',
        topic: 'IAS 12 & IAS 16',
        html: `
          <p class="font-semibold text-slate-900 mb-3">The following scenario relates to questions 16 – 20.</p>
          <p class="mb-3">Grinnit Co is preparing its financial statements for the year ended 31 October 20X7.</p>
          <p class="mb-3">Grinnit Co has a deferred tax liability at 1 November 20X6 of <strong>$62,000</strong>. This had been caused by differences between depreciation charges and tax allowances.</p>
          <p class="mb-3">At 31 October 20X7, the tax base of Grinnit Co's net assets was <strong>$180,000</strong> less than the carrying amount. This has been caused by the differences between depreciation charges and tax allowances and excludes the following effects of a revaluation of land.</p>
          <p class="mb-3">Grinnit Co decided to revalue its land for the first time on 1 August 20X7. A qualified surveyor valued the land on that date at <strong>$300,000</strong>. The land had been purchased four years ago for <strong>$240,000</strong>.</p>
          <p class="mb-1">The income tax rate is <strong>30%</strong>.</p>
        `
      },
      gammon: {
        id: 'gammon',
        title: 'GAMMON CO',
        rangeLabel: 'Questions 21 – 25',
        topic: 'IFRS 5 & IAS 33',
        html: `
          <p class="font-semibold text-slate-900 mb-3">The following scenario relates to questions 21 – 25.</p>
          <p class="mb-3">Gammon Co manufactures and sells a wide variety of furniture. Its year-end date is 31 October 20X4.</p>
          <p class="mb-3">During the year, Gammon Co commenced restructuring and, as part of this, the Garden Furniture division was classified as held for sale. The Garden Furniture division was sold on 12 January 20X5. Prior to its classification as 'held for sale', the division's current assets were realised and the proceeds were used to settle its liabilities.</p>
          <p class="mb-2">Relevant information on the non-current assets of the Garden Furniture division at 31 October 20X4 is presented below:</p>
          <table class="cbe-table">
            <thead>
              <tr>
                <th>Non-current assets of the Garden Furniture division at 31 October 20X4</th>
                <th class="num">$'000</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>Carrying amount</td><td class="num">31,350</td></tr>
              <tr><td>Value in use</td><td class="num">20,010</td></tr>
              <tr><td>Fair value</td><td class="num">26,940</td></tr>
              <tr><td>Selling costs</td><td class="num">2,040</td></tr>
            </tbody>
          </table>
          <p class="mt-3 mb-2 font-medium text-slate-900">On 1 August 20X4, to partly-fund the restructuring:</p>
          <ol class="list-none pl-2 space-y-1.5 mb-3">
            <li>(1) 18m equity (ordinary) shares were issued at market value.</li>
            <li>(2) $60m of 8% convertible loan notes were issued at par. The effective interest rate was also 8%.</li>
          </ol>
          <p class="mb-2 font-medium text-slate-900">Additional relevant information for Gammon Co:</p>
          <ol class="list-none pl-2 space-y-1.5">
            <li>(1) 60m equity (ordinary) shares were in issue on 1 November 20X3.</li>
            <li>(2) On 1 March 20X4, a one-for-four issue of bonus shares was made.</li>
            <li>(3) Profit for the year from continuing operations for the year ended 31 October 20X4 was $103.8m.</li>
            <li>(4) The income tax rate is 20%.</li>
          </ol>
        `
      },
      shawler: {
        id: 'shawler',
        title: 'SHAWLER CO',
        rangeLabel: 'Questions 26 – 30',
        topic: 'IAS 16, IAS 20 & IAS 37',
        html: `
          <p class="font-semibold text-slate-900 mb-3">The following scenario relates to questions 26 – 30.</p>
          <p class="mb-3">Shawler Co is a small manufacturing company specialising in making alloy castings. Its main item of plant is a furnace which was purchased on 1 October 20X5. The furnace has two components: the main body (cost <strong>$42,000</strong>) which has a ten-year life, and a replaceable liner (cost <strong>$10,000</strong>) with a five-year life.</p>
          <p class="mb-3">The manufacturing process produces toxic chemicals which pollute the nearby environment. Legislation requires that a clean-up operation must be undertaken by Shawler Co on 30 September 20Y5 at the latest. The cost of the clean-up operation has been estimated at <strong>$38,900</strong>.</p>
          <p class="mb-3">On 1 October 20X5 the present value of this amount was calculated at <strong>$18,000</strong>, using the company's cost of capital of <strong>8%</strong>. On 1 October 20X5 Shawler Co received a government grant of <strong>$12,000</strong> relating to the cost of the main body of the furnace only. No other conditions were attached to the grant.</p>
          <p class="mb-1">On 1 April 20X6, the government introduced further environmental legislation which had the effect of requiring Shawler Co to fit anti-pollution filters to its furnace within two years. An environmental consultant has calculated that fitting the filters will reduce Shawler Co's required environmental costs (and therefore its provision) by <strong>33%</strong>. At 30 September 20X6 Shawler Co had not yet fitted the filters.</p>
        `
      }
    },
    questions: [
      {
        num: 1, section: 'A', type: 'mcq', topic: 'IFRS 15 Revenue', marks: 2,
        stem: `<p class="mb-3">Gim sells a laptop and a two-year support package for a total of $1,200. Stand-alone selling prices are: laptop $1,000, support $500 (for the two years). The laptop is delivered and support begins on 1 January 20X4.</p><p class="font-semibold text-slate-900">What total revenue should Gim recognise in the year ended 31 December 20X4?</p>`,
        options: [
          { key: 'A', text: '$1,200' },
          { key: 'B', text: '$1,000' },
          { key: 'C', text: '$800' },
          { key: 'D', text: '$700' }
        ],
        correct: 'B',
        explanation: `Under <strong>IFRS 15</strong>, allocate the transaction price ($1,200) based on relative stand-alone selling prices (total = $1,000 + $500 = $1,500):<br>• Laptop: $1,200 × ($1,000 / $1,500) = $800 (recognised at point in time on 1 Jan 20X4).<br>• Support (2 years): $1,200 × ($500 / $1,500) = $400 → $200 per year (recognised over time).<br>• Total revenue in 20X4 = $800 + $200 = <strong>$1,000</strong>.`
      },
      {
        num: 2, section: 'A', type: 'mcq', topic: 'IFRS 15 Revenue', marks: 2,
        stem: `<p class="font-semibold text-slate-900">Which of the following is NOT a criterion for recognising revenue over time under IFRS 15?</p>`,
        options: [
          { key: 'A', text: 'The contract term is longer than one year' },
          { key: 'B', text: 'The customer simultaneously receives and consumes the benefits as the entity performs' },
          { key: 'C', text: "The entity's performance creates or enhances an asset that the customer controls" },
          { key: 'D', text: "The entity's performance creates an asset with no alternative use and the entity has an enforceable right to payment for performance to date" }
        ],
        correct: 'A',
        explanation: `<strong>IFRS 15.35</strong> sets out three criteria for over-time revenue recognition (options B, C, and D). The length of the contract term (e.g. longer than one year) is <strong>not</strong> a criterion.`
      },
      {
        num: 3, section: 'A', type: 'mcq', topic: 'IFRS 15 / IAS 37', marks: 2,
        stem: `<p class="mb-3">Wix sells a machine with a standard one-year warranty that it meets its specification. Customers can also buy an extended three-year warranty separately.</p><p class="font-semibold text-slate-900">How should these warranties be accounted for?</p>`,
        options: [
          { key: 'A', text: 'Both are separate performance obligations' },
          { key: 'B', text: 'Both are provisions under IAS 37' },
          { key: 'C', text: 'Both are expensed when claims are paid' },
          { key: 'D', text: 'The standard warranty is an IAS 37 provision; the extended warranty is a separate performance obligation recognised over three years' }
        ],
        correct: 'D',
        explanation: `Under <strong>IFRS 15 (B28–B33)</strong>, an assurance-type (standard) warranty is accounted for as a provision under <strong>IAS 37</strong>, whereas an optional service-type (extended) warranty purchased separately is a distinct performance obligation recognised over the three-year service period.`
      },
      {
        num: 4, section: 'A', type: 'mcq', topic: 'IFRS 15 Repurchase', marks: 2,
        stem: `<p class="mb-3">Zed sells a machine for $100,000 and agrees to repurchase it after two years for $70,000. The transaction is not part of a sale and leaseback.</p><p class="font-semibold text-slate-900">How is the transaction treated?</p>`,
        options: [
          { key: 'A', text: 'As a sale, with revenue of $100,000' },
          { key: 'B', text: 'As a financing arrangement' },
          { key: 'C', text: 'As a sale with a right of return' },
          { key: 'D', text: 'As a lease under IFRS 16' }
        ],
        correct: 'D',
        explanation: `Under <strong>IFRS 15.B66(a)</strong>, when an entity has an obligation (forward) or right (call option) to repurchase an asset for <em>less than</em> the original selling price ($70,000 &lt; $100,000) and it is not a sale and leaseback, the contract is accounted for as a <strong>lease under IFRS 16</strong>.`
      },
      {
        num: 5, section: 'A', type: 'mcq', topic: 'IFRS 15 Financing', marks: 2,
        stem: `<p class="mb-3">On 1 January 20X1 Glass Co sells goods to Vase Co for $350,000, payable on 31 December 20X4. The relevant discount rate is 8%. The present value of $1 receivable at the end of year 4 based on a discount rate of 8% is $0.74.</p><p class="font-semibold text-slate-900">What amounts of revenue and interest income should be recognised in profit or loss for the year ended 31 December 20X2?</p>`,
        options: [
          { key: 'A', text: 'Revenue $259,000; interest income $20,720' },
          { key: 'B', text: 'Revenue $350,000; interest income nil' },
          { key: 'C', text: 'Revenue nil; interest income $22,378' },
          { key: 'D', text: 'Revenue nil; interest income $20,720' }
        ],
        correct: 'C',
        explanation: `• 1 Jan 20X1: Revenue recognised = $350,000 × 0.74 = $259,000.<br>• Year ended 31 Dec 20X1: Interest income = $259,000 × 8% = $20,720 → Closing receivable = $279,720.<br>• Year ended 31 Dec 20X2: Revenue = <strong>nil</strong>; Interest income = $279,720 × 8% = $22,377.60 ≈ <strong>$22,378</strong>.`
      },
      {
        num: 6, section: 'A', type: 'multi', selectCount: 2, topic: 'IFRS 15 Control', marks: 2,
        stem: `<p class="mb-3">Jentil Co is a company which manufactures ovens and supplies them to retailers. There are no direct sales to the public.</p><p class="font-semibold text-slate-900">Which TWO of the following would indicate that Jentil Co should recognise revenue at the point of delivery?</p>`,
        options: [
          { key: 'A', text: 'The retailer must pay a penalty to Jentil Co if it returns new ovens which are in full working order' },
          { key: 'B', text: 'The retailer has signed proof of delivery and unconditionally accepted the delivery of the ovens from Jentil Co' },
          { key: 'C', text: 'Jentil Co has a statutory right to request the return of the ovens in exchange for the original consideration, without further compensating the retailer' },
          { key: 'D', text: 'Obsolete models of ovens may be returned by the retailer to Jentil Co in exchange for the original consideration, without being further compensated' }
        ],
        correct: ['A', 'B'],
        explanation: `<strong>A</strong> and <strong>B</strong> indicate transfer of control to the retailer at delivery (IFRS 15.38: customer acceptance and significant risks/rewards of ownership). C (repurchase right) and D (unconditional right to return obsolete stock) indicate a consignment/no transfer of control.`
      },
      {
        num: 7, section: 'A', type: 'mcq', topic: 'IFRS 9 Financial Assets', marks: 2,
        stem: `<p class="mb-3">On 1 January 20X8 Penfold purchased a debt instrument for its fair value of $500,000. It has a principal amount of $550,000 and is due to mature in five years. The debt instrument carries fixed interest of 6% paid annually in arrears and has an effective interest rate of 8%. The debt instrument meets the business model test to be measured at amortised cost.</p><p class="font-semibold text-slate-900">At what amount will the debt instrument be presented in the statement of financial position of Penfold as at 31 December 20X9?</p>`,
        options: [
          { key: 'A', text: '$514,560' },
          { key: 'B', text: '$566,000' },
          { key: 'C', text: '$564,560' },
          { key: 'D', text: '$520,800' }
        ],
        correct: 'A',
        explanation: `Annual coupon received = $550,000 × 6% = $33,000.<br>• 20X8: $500,000 + ($500,000 × 8% = $40,000) − $33,000 = $507,000.<br>• 20X9: $507,000 + ($507,000 × 8% = $40,560) − $33,000 = <strong>$514,560</strong>.`
      },
      {
        num: 8, section: 'A', type: 'mcq', topic: 'IFRS 9 Financial Liabilities', marks: 2,
        stem: `<p class="mb-3">On 1 January 20X5 Dune Co issued a $500,000 3% bond redeemable at par in five years. Issue costs were $40,000, so the net proceeds were $460,000. The effective rate of interest is 6%. Interest is paid annually in arrears.</p><p class="font-semibold text-slate-900">What is the carrying amount of the bond in Dune Co's statement of financial position at 31 December 20X5?</p>`,
        options: [
          { key: 'A', text: '$445,000' },
          { key: 'B', text: '$460,000' },
          { key: 'C', text: '$472,600' },
          { key: 'D', text: '$487,600' }
        ],
        correct: 'C',
        explanation: `Opening liability = $460,000.<br>• Effective interest (6%) = $460,000 × 6% = $27,600.<br>• Cash interest paid (3% of $500,000) = $15,000.<br>• Closing carrying amount = $460,000 + $27,600 − $15,000 = <strong>$472,600</strong>.`
      },
      {
        num: 9, section: 'A', type: 'mcq', topic: 'IAS 37 Provisions', marks: 2,
        stem: `<p class="mb-3">Raycroft operates a nuclear power station. The power station is due to be decommissioned on 31 December 20Y4 and will be fully operational up to that date. It has been estimated that the cost of decommissioning the power station and cleaning up any environmental damage, as required by legislation, will be $60 million. Raycroft recognised a provision for the present value of this expenditure at 31 December 20X6. A suitable discount rate for evaluating costs of this nature is 12%, equivalent to a present value factor after eight years of 0.404. The decommissioning cost will be depreciated over eight years.</p><p class="font-semibold text-slate-900">What is the TOTAL charge to profit or loss in respect of this provision for the year ended 31 December 20X7?</p>`,
        options: [
          { key: 'A', text: '$7,500,000' },
          { key: 'B', text: '$5,938,800' },
          { key: 'C', text: '$3,030,000' },
          { key: 'D', text: '$2,908,800' }
        ],
        correct: 'B',
        explanation: `Initial provision &amp; capitalised asset at 31 Dec 20X6 = $60,000,000 × 0.404 = $24,240,000.<br>• Depreciation (20X7): $24,240,000 ÷ 8 years = $3,030,000.<br>• Finance cost (unwinding @ 12%): $24,240,000 × 12% = $2,908,800.<br>• Total P&amp;L charge = $3,030,000 + $2,908,800 = <strong>$5,938,800</strong>.`
      },
      {
        num: 10, section: 'A', type: 'multi', selectCount: 2, topic: 'IAS 20 Grants', marks: 2,
        stem: `<p class="mb-3">Theo Co acquired new plant on 1 January 20X3 for $6m. This was partly funded by the receipt of a $2m government grant on the same date. The plant has a useful life of ten years. Theo Co is unsure whether to deduct the grant to calculate the carrying amount of the plant or to use the deferred income method.</p><p class="font-semibold text-slate-900">Based on the different ways to account for government grants, which TWO of the following options can be recognised in the statement of financial position as at 31 December 20X3?</p>`,
        options: [
          { key: 'A', text: 'Non-current asset of $3.6m' },
          { key: 'B', text: 'Non-current liability of $1.8m' },
          { key: 'C', text: 'Non-current asset of $4m' },
          { key: 'D', text: 'Non-current liability of $1.6m' }
        ],
        correct: ['A', 'D'],
        explanation: `• <strong>Deduct from asset method:</strong> Net cost = $6m − $2m = $4m. After 1 year's depreciation ($0.4m), Non-current asset = <strong>$3.6m (A)</strong>.<br>• <strong>Deferred income method:</strong> Total deferred income at 31 Dec 20X3 = $2m − $0.2m = $1.8m, split into Current liability ($0.2m) and <strong>Non-current liability of $1.6m (D)</strong>.`
      },
      {
        num: 11, section: 'A', type: 'mcq', topic: 'IAS 21 Foreign Exchange', marks: 2,
        stem: `<p class="mb-3">On 1 January 20X7 Vega took out a loan of Zenar 1.5 million. Vega's functional currency is the dollar. The loan is to be repaid in 10 equal instalments of Zenar 150,000 on 31 December each year, the first being on 31 December 20X7. Exchange rates are as follows:</p>
          <table class="cbe-table max-w-md">
            <tbody>
              <tr><td>1 January 20X7</td><td>Zenar 1 = $1.85</td></tr>
              <tr><td>31 December 20X7</td><td>Zenar 1 = $1.92</td></tr>
            </tbody>
          </table>
          <p class="font-semibold text-slate-900 mt-3">What is the carrying amount of the non-current liability in Vega's statement of financial position as at 31 December 20X7?</p>`,
        options: [
          { key: 'A', text: '$2,497,500' },
          { key: 'B', text: '$2,304,000' },
          { key: 'C', text: '$2,592,000' },
          { key: 'D', text: '$2,220,000' }
        ],
        correct: 'B',
        explanation: `• Remaining loan at 31 Dec 20X7 after 1st instalment = Z1,500,000 − Z150,000 = Z1,350,000.<br>• Current liability (instalment due 31 Dec 20X8) = Z150,000.<br>• Non-current liability = Z1,200,000.<br>• Monetary liabilities are retranslated at the closing rate ($1.92): Z1,200,000 × $1.92 = <strong>$2,304,000</strong>.`
      },
      {
        num: 12, section: 'A', type: 'mcq', topic: 'IAS 21 Foreign Exchange', marks: 2,
        stem: `<p class="mb-3">IAS 21 <em>The Effects of Changes in Foreign Exchange Rates</em> distinguishes between functional currency and presentation currency.</p>
          <p class="font-semibold text-slate-900 mb-2">Which of the following statements regarding presentation currency is/are correct in accordance with IAS 21?</p>
          <ol class="list-none pl-2 space-y-1.5 mb-2">
            <li>(1) An entity may choose to present its financial statements in a currency other than its functional currency</li>

      {
        num: 14, section: 'A', type: 'mcq', topic: 'IAS 37 Provisions', marks: 2,
        stem: `<p class="mb-3">TY is the main contractor employing sub-contractors to assist it when required.</p>
          <p class="mb-3">TY has recently completed a contract replacing a roof on the local school. Despite this, the roof has been leaking and some sections are now unsafe. The school is suing TY for $20,000 to repair the roof.</p>
          <p class="mb-3">TY used a sub-contractor to install the roof and regards the sub-contractor's work as faulty. TY has raised a court action against the sub-contractor claiming the cost of the school's action plus legal fees, a total of $22,000.</p>
          <p class="mb-3">TY has been informed by legal advisers that it will probably lose the case brought against it by the school and will probably win the case against the sub-contractor.</p>
          <p class="font-semibold text-slate-900">How should these events be accounted for in TY's financial statements?</p>`,
        options: [

          { key: 'B', text: 'Provide for the $20,000 liability and disclose the probable receipt of cash from the case against the sub-contractor in a note' },

          { key: 'D', text: 'Provide for the $20,000 liability and recognise the probable receipt of cash from the case against the sub-contractor in a current asset' }
        ],
        correct: 'B',
        explanation: `Under <strong>IAS 37</strong>, the probable $20,000 outflow meets the recognition criteria for a <strong>provision</strong>. The probable recovery from the sub-contractor is a <strong>contingent asset</strong> (not virtually certain), so it must be <strong>disclosed in a note</strong> and not recognised.`
      },

        stem: `<p class="mb-3">Cowper plc has spent $20,000 researching new cleaning chemicals in the year ended 31 December 20X0. They have also spent $40,000 developing a new cleaning product which will not go into commercial production until next year. The development project meets the criteria laid down in IAS 38 <em>Intangible Assets</em>.</p><p class="font-semibold text-slate-900">How should these costs be treated in the financial statements of Cowper plc for the year ended 31 December 20X0?</p>`,

          <p class="mb-2">The machinery is expected to last 4 years with no residual value.</p>

  {"id": "exam5", "code": "FR-TOP20-OTQ", "title": "Financial Reporting (FR) — Top 20 OT Cases", "subtitle": "Sir Sanjay Top 20 Section B Cases • 20 Scenarios × 5 Qs = 100 Questions • 200 Marks", "totalQuestions": 100, "totalMarks": 200, "marksPerQuestion": 2, "accaMinutes": 360, "paperMinutes": 180, "sections": [{"id": "B", "name": "Section B — Top 20 Objective Test Cases", "range": [1, 100], "description": "20 full OT Cases × 5 questions each (200 marks)"}], "scenarios": {"otq1": {"id": "otq1", "title": "OTQ 1 — Alpha Co", "rangeLabel": "Questions 1 – 5", "topic": "IFRS 9 & IAS 32", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 1 – 5.</p>\n      <p class=\"mb-3\">Alpha Co owns $100,000 of equity investments.</p>\n      <p class=\"mb-2\">Alpha Co raises finance in a variety of ways and details of its loans at 1 January 20X2 are as follows:</p>\n      <table class=\"cbe-table\">\n        <thead><tr><th>Loan</th><th class=\"num\">$'000</th></tr></thead>\n        <tbody>\n          <tr><td>Carrying amount of 5% loan notes (issued 1 January 20X1)</td><td class=\"num\">42,000</td></tr>\n          <tr><td>Proceeds of convertible loan notes (issued 1 January 20X2)</td><td class=\"num\">50,000</td></tr>\n        </tbody>\n      </table>\n      <p class=\"mt-3 mb-2\">The convertible loan notes of $50m have a redemption date of 31 December 20X4 and carry a coupon rate of 4%. Interest is payable at the end of each year. If Alpha Co had issued similar loan notes without a conversion option they would carry an interest rate of 7%.</p>\n      <p class=\"mb-2\">The relevant discount rates are as follows:</p>\n      <table class=\"cbe-table max-w-xs\">\n        <thead><tr><th>Year</th><th class=\"num\">4%</th><th class=\"num\">7%</th></tr></thead>\n        <tbody>\n          <tr><td>Year 1</td><td class=\"num\">0.962</td><td class=\"num\">0.935</td></tr>\n          <tr><td>Year 2</td><td class=\"num\">0.925</td><td class=\"num\">0.873</td></tr>\n          <tr><td>Year 3</td><td class=\"num\">0.889</td><td class=\"num\">0.816</td></tr>\n        </tbody>\n      </table>\n    "}, "otq2": {"id": "otq2", "title": "OTQ 2 — Grinnit Co", "rangeLabel": "Questions 6 – 10", "topic": "IAS 12 & IAS 16", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 6 – 10.</p>\n      <p class=\"mb-3\">Grinnit Co is preparing its financial statements for the year ended 31 October 20X7.</p>\n      <p class=\"mb-3\">Grinnit Co has a deferred tax liability at 1 November 20X6 of <strong>$62,000</strong>. This had been caused by differences between depreciation charges and tax allowances.</p>\n      <p class=\"mb-3\">At 31 October 20X7, the tax base of Grinnit Co's net assets was <strong>$180,000</strong> less than the carrying amount. This has been caused by the differences between depreciation charges and tax allowances and excludes the following effects of a revaluation of land.</p>\n      <p class=\"mb-3\">Grinnit Co decided to revalue its land for the first time on 1 August 20X7. A qualified surveyor valued the land on that date at <strong>$300,000</strong>. The land had been purchased four years ago for <strong>$240,000</strong>.</p>\n      <p>The income tax rate is <strong>30%</strong>.</p>\n    "}, "otq3": {"id": "otq3", "title": "OTQ 3 — Anooshi Co", "rangeLabel": "Questions 11 – 15", "topic": "IFRS 5 & IAS 38", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 11 – 15.</p>\n      <p class=\"mb-3\">Anooshi Co is a pharmaceutical company. It is preparing its financial statements for the year ended 31 March 20X9.</p>\n      <p class=\"font-semibold text-slate-900 mb-1\">Asset held for sale</p>\n      <p class=\"mb-3\">Anooshi Co discontinued a product line during the year ended 31 March 20X9. As a result, plant became surplus to requirements on 1 October 20X8. The plant was immediately offered for sale at $91,000 which was considered to be its fair value. Selling costs are estimated at $5,000. The plant had a carrying amount of $96,000 at 1 April 20X8. It was being depreciated on a reducing balance basis at a rate of 12% per annum.</p>\n      <p class=\"font-semibold text-slate-900 mb-1\">Project X</p>\n      <p>Anooshi commenced Project X, a research and development project, on 1 April 20X8 and total costs of $45m accrued evenly over the period to 31 December 20X8. On 30 June 20X8, the directors were confident that the project met the capitalization criteria of IAS 38 Intangible Assets. The project was completed and began to generate revenue from 1 January 20X9. It is estimated that the project will generate revenue for five years.</p>\n    "}, "otq4": {"id": "otq4", "title": "OTQ 4 — Pingshan Co", "rangeLabel": "Questions 16 – 20", "topic": "IFRS 15 Revenue", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 16 – 20.</p>\n      <p class=\"mb-2\">Pingshan Co manufactures plant and equipment. Its revenue for the year ended 31 August 20X4 was analyzed as follows:</p>\n      <table class=\"cbe-table max-w-sm\">\n        <thead><tr><th>Revenue</th><th class=\"num\">$'000</th></tr></thead>\n        <tbody>\n          <tr><td>Luoho Co contract</td><td class=\"num\">900</td></tr>\n          <tr><td>Dapeng Co contract</td><td class=\"num\">3,000</td></tr>\n          <tr><td>Futian Co contract</td><td class=\"num\">4,000</td></tr>\n          <tr class=\"font-semibold bg-slate-50\"><td>Total</td><td class=\"num\">7,900</td></tr>\n        </tbody>\n      </table>\n      <p class=\"font-semibold text-slate-900 mt-3 mb-1\">Luoho Co</p>\n      <p class=\"mb-2\">A large item of plant is being constructed for Luoho Co. The plant is controlled by Luoho Co and is being constructed directly on its premises. The total contract price is $1.8m and, at 31 August 20X4, progress was assessed at 50%. Pingshan Co invoiced Luoho Co a total of $1.0m and this invoice was settled by 31 August 20X4. Pingshan Co incurred recoverable contract costs of $0.7m to 31 August 20X4 and total expected contract costs are $1.3m.</p>\n      <p class=\"font-semibold text-slate-900 mt-3 mb-1\">Dapeng Co</p>\n      <p class=\"mb-2\">Equipment was sold to Dapeng Co on 1 March 20X4, allowing Dapeng Co credit terms of one year, interest free. This is a significant benefit for Dapeng Co. Pingshan Co's cost of capital is 7%. Pingshan Co recognized the full and final amount of $3.0m, to be paid on 1 March 20X5, within revenue for the year ended 31 August 20X4.</p>\n      <p class=\"font-semibold text-slate-900 mt-3 mb-1\">Futian Co</p>\n      <p class=\"mb-2\">An item of plant with a stand-alone selling price of $4.0m was sold to Futian Co on 1 June 20X4. Specifically for this contract, the transaction price of $4.0m includes a one year servicing contract at no extra cost to Futian Co. $4.0m was invoiced to Futian Co on the date of delivery, which was 1 June 20X4. The cost of servicing plant is $0.3m per year and Pingshan Co ordinarily charges a markup of one third on the servicing of plant.</p>\n      <p class=\"font-semibold text-slate-900 mt-3 mb-1\">Yantian Co</p>\n      <p>From 1 September 20X4, the next financial period, Pingshan Co are combining two items of equipment into one single 'package' for Yantian Co, which is currently the only customer for these two items. The package will be sold at a discount when compared to the sum of the stand-alone selling prices for the individual items and the individual items of equipment will no longer be sold. Servicing is not included.</p>\n    "}, "otq5": {"id": "otq5", "title": "OTQ 5 — Pakka Co", "rangeLabel": "Questions 21 – 25", "topic": "IFRS 16 Leases", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 21 – 25.</p>\n      <p class=\"mb-3\">Pakka Co is preparing its financial statements for the year ended 31 December 20X5.</p>\n      <p class=\"mb-3\">On 1 January 20X5, Pakka Co leased a plant from Landa Co. The plant is being leased for four years and the agreement requires an initial deposit of $10,000 plus four annual payments of $10,000 made on 31 December each year. The useful life of the plant is 20 years and both Pakka Co and Landa Co depreciate the plant on a straight-line basis. The interest rate implicit in the lease is 10%.</p>\n      <p class=\"mb-3\">Pakka Co made modifications to the leased plant before it could be used at a cost of $7,500. The plant must be restored to its original condition by Pakka Co before it is delivered back to Landa Co. The present value of this expected cost is $2,500.</p>\n      <p class=\"mb-2\">The expected values of $1 at a discount rate of 10% on 31 December each year are:</p>\n      <table class=\"cbe-table max-w-xs\">\n        <tbody>\n          <tr><td>20X5</td><td class=\"num\">$0.91</td></tr>\n          <tr><td>20X6</td><td class=\"num\">$0.83</td></tr>\n          <tr><td>20X7</td><td class=\"num\">$0.75</td></tr>\n          <tr><td>20X8</td><td class=\"num\">$0.68</td></tr>\n        </tbody>\n      </table>\n      <p class=\"mt-2\">The four-year cumulative discount factor is <strong>3.17</strong>.</p>\n    "}, "otq6": {"id": "otq6", "title": "OTQ 6 — Artem Co", "rangeLabel": "Questions 26 – 30", "topic": "IAS 16 & IAS 38", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 26 – 30.</p>\n      <p class=\"mb-2\">During the year to 30 June 20X5, Artem Co spent $550,000 on new plant as follows:</p>\n      <table class=\"cbe-table max-w-md\">\n        <thead><tr><th>Item</th><th class=\"num\">$'000</th></tr></thead>\n        <tbody>\n          <tr><td>Plant cost</td><td class=\"num\">525</td></tr>\n          <tr><td>Delivery to site</td><td class=\"num\">3</td></tr>\n          <tr><td>Building alterations to accommodate the plant</td><td class=\"num\">12</td></tr>\n          <tr><td>Costs of initial testing of the new plant</td><td class=\"num\">2</td></tr>\n          <tr><td>Plant operator training costs</td><td class=\"num\">8</td></tr>\n        </tbody>\n      </table>\n      <p class=\"mt-3 mb-3\">Artem Co's fixtures and fittings were purchased on 1 July 20X2 at a cost of $50,000. The directors have depreciated them on a straight line basis over an estimated useful life of eight years assuming a $5,000 residual value. At 1 July 20X4, the directors realise that the remaining useful life of the fixtures is five years. There is no change to the estimated residual value.</p>\n      <p>Artem Co began a research project in October 20X3 with the aim of developing a new type of machine. If successful, Artem Co will manufacture the machines and sell them to customers as well as using them in their own production processes. During the year ended 30 June 20X4, costs of $25,000 were incurred on conducting feasibility studies and some market research. During the year ended 30 June 20X5, a further $80,000 was incurred on constructing and testing a prototype of the machine.</p>\n    "}, "otq7": {"id": "otq7", "title": "OTQ 7 — Arknee Co", "rangeLabel": "Questions 31 – 35", "topic": "IAS 38 & IFRS 3", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 31 – 35.</p>\n      <p class=\"mb-3\">Arknee Co prepares its financial statements to 31 December each year. On 1 January 20X5, Arknee Co purchased two brand names as detailed below:</p>\n      <ol class=\"list-none pl-1 space-y-2.5\">\n        <li><strong>1)</strong> CollYo cost $140,000 and is expected to have a ten-year useful life. Although there is not an active market for sale of the CollYo brand, a specialist has estimated its value to be $180,000 at 31 December 20X5.</li>\n        <li><strong>2)</strong> FlowLo cost $200,000 and Arknee Co intends to use this indefinitely. Since acquisition, there have been several negative news stories surrounding products with the FlowLo brand. The brand specialist has estimated that FlowLo has a value of $110,000 at 31 December 20X5.</li>\n        <li><strong>3)</strong> On 1 January 20X5, Arknee Co began development of a new product called Fubflames. Initial concerns about product safety were satisfied following testing on 1 April 20X5 and the board approved the funding to complete the project on 1 May 20X5.</li>\n        <li><strong>4)</strong> Arknee Co spent $100,000 per month in the development of Fubflames up to 31 October 20X5, at which date the product launched. Arknee Co expects Fubflames to have a useful life of five years.</li>\n      </ol>\n    "}, "otq8": {"id": "otq8", "title": "OTQ 8 — Brett Co", "rangeLabel": "Questions 36 – 40", "topic": "IAS 12 & IAS 8", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 36 – 40.</p>\n      <p class=\"mb-2\">The finance director of Brett Co has provided the following information in relation to the company's tax:</p>\n      <table class=\"cbe-table\">\n        <thead><tr><th>Year ended 30 September</th><th class=\"num\">20X3 ($)</th><th class=\"num\">20X4 ($)</th><th class=\"num\">20X5 ($)</th></tr></thead>\n        <tbody>\n          <tr><td>Current tax payable</td><td class=\"num\">140,000</td><td class=\"num\">155,000</td><td class=\"num\">170,000</td></tr>\n          <tr><td>Income tax paid during year</td><td class=\"num\">117,000</td><td class=\"num\">128,000</td><td class=\"num\">152,000</td></tr>\n          <tr><td>Deferred tax liability</td><td class=\"num\">-</td><td class=\"num\">-</td><td class=\"num\">80,000</td></tr>\n        </tbody>\n      </table>\n      <p class=\"mt-3 mb-3\">In January 20X6, the finance director of Brett Co realized that a material error arose in the financial statements for the year ended 30 September 20X5 which will result in additional income tax of $37,000.</p>\n      <p>The deferred tax liability at 30 September 20X5 was calculated using a tax rate of 20%. An announcement was made in June 20X6 that the tax rate will change to 22% on 1 August 20X6. Taxable temporary differences at 30 September 20X6 amounted to $390,000.</p>\n    "}, "otq9": {"id": "otq9", "title": "OTQ 9 — Vessel Co", "rangeLabel": "Questions 41 – 45", "topic": "IFRS 16 Leases", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 41 – 45.</p>\n      <p class=\"mb-3\">Vessel Co has a fleet of small speedboats and jet-skis which it hires out to tourists on an hourly or daily basis at several holiday resorts. Most of its fleet is owned but, in recent years, the company has increasingly relied on leases to expand its fleet. The company's year-end date is 31 December. Two leases were entered during the year ended 31 December 20X2.</p>\n      <p class=\"font-semibold text-slate-900 mb-1\">Jet-ski</p>\n      <p class=\"mb-3\">On 1 January 20X2, Vessel Co entered a five-year lease for ten jet-skis. The total present value of lease payments at the start of the contract was $180,000 (for ten jet-skis). Lease payments of $41,400 were to be made annually in arrears. The interest rate implicit in the lease was 5%.</p>\n      <p class=\"font-semibold text-slate-900 mb-1\">Outboard motors</p>\n      <p>On 1 September 20X2, Vessel Co entered a 12-month lease for 60 small outboard motors for use on the rental speedboats. Vessel Co intends to use the recognition exemption for short-term leases. Payments of $25,000 were to be made monthly in arrears for the first four months, followed by $28,000 per month for the next eight months. The total fair value of the 60 outboard motors at 1 September 20X2 was $250,000. The cost of capital is 6%.</p>\n    "}, "otq10": {"id": "otq10", "title": "OTQ 10 — Ahmed Co", "rangeLabel": "Questions 46 – 50", "topic": "IFRS 15 Revenue", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 46 – 50.</p>\n      <p class=\"mb-2\">For the year ended 30 September 20X5, sources of revenue for Ahmed Co include the following items:</p>\n      <table class=\"cbe-table max-w-sm\">\n        <thead><tr><th>Source</th><th class=\"num\">$'000</th></tr></thead>\n        <tbody>\n          <tr><td>Construction of a new office for customer</td><td class=\"num\">See below</td></tr>\n          <tr><td>Sale of plant</td><td class=\"num\">2,000</td></tr>\n          <tr><td>Sale of equipment</td><td class=\"num\">4,500</td></tr>\n        </tbody>\n      </table>\n      <p class=\"font-semibold text-slate-900 mt-3 mb-1\">Construction of a new office for customer</p>\n      <p class=\"mb-2\">The total contract price is $1.2m and at 30 September 20X5, the progress on the contract has been assessed at 20%. Revenue was recognised correctly in Ahmed Co's financial statements. Ahmed Co has invoiced the customer $1m for this work and this was paid in full. Ahmed Co has incurred contract costs of $0.9m to date and total expected contract costs are $1.4m.</p>\n      <p class=\"font-semibold text-slate-900 mt-3 mb-1\">Sale of plant</p>\n      <p class=\"mb-2\">The sale was made on 1 July 20X5 with credit terms of one year, interest free. Revenue was measured and recognised at $2m, the final amount to be paid on the contract. Ahmed Co's cost of capital is 6%.</p>\n      <p class=\"font-semibold text-slate-900 mt-3 mb-1\">Sale of equipment</p>\n      <p>The $4.5m sale was made on 1 August 20X5. The $4.5m includes a two-year servicing contract, which will cost Ahmed Co $0.4m per year. Ahmed Co also sells similar servicing contracts separately and charges a markup of 20% on these. This revenue was recorded incorrectly.</p>\n    "}, "otq11": {"id": "otq11", "title": "OTQ 11 — Matti Co", "rangeLabel": "Questions 51 – 55", "topic": "IAS 36 Impairment", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 51 – 55.</p>\n      <p class=\"mb-2\">Matti Co uses the cost model to account for its non-current assets and is preparing an impairment review on 31 December 20X8 for the following assets:</p>\n      <ol class=\"list-none pl-2 space-y-1.5 mb-3\">\n        <li>1) A <strong>Brand</strong> costing $1m on 1 January 20X8 which has an indefinite life</li>\n        <li>2) An item of <strong>Plant</strong> with a carrying amount of $6.7m</li>\n        <li>3) A <strong>Building</strong> which cost $25m on 1 January 20X3</li>\n      </ol>\n      <p class=\"mb-2\">Other details are as follows:</p>\n      <p class=\"mb-2\">The plant has a fair value less costs of disposal of $6m and value in use of $6.9m.</p>\n      <p class=\"mb-2\">The building had a useful life of 25 years at the date of acquisition.</p>\n      <p>Matti Co also controls a subsidiary in addition to the assets above, Waheedullah Co, which is classified as a cash-generating unit.</p>\n    "}, "otq12": {"id": "otq12", "title": "OTQ 12 — Bajwa Co", "rangeLabel": "Questions 56 – 60", "topic": "IFRS 16 Leases", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 56 – 60.</p>\n      <p class=\"mb-3\">Bajwa Co has a year-end date of 31 December. The company has entered three leases during the year ended 31 December 20X7.</p>\n      <p class=\"font-semibold text-slate-900 mb-1\">20-year lease for a building</p>\n      <ul class=\"list-disc pl-5 space-y-1 mb-3\">\n        <li>Building valued at $30m</li>\n        <li>Lease commenced on 1 January 20X7</li>\n        <li>Present value of the lease payments at 1 January 20X7 was $22.94m</li>\n        <li>Payments of $2m on 31 December each year</li>\n        <li>Interest rate implicit in the lease of 6%</li>\n      </ul>\n      <p class=\"font-semibold text-slate-900 mb-1\">Five-year lease for machinery</p>\n      <ul class=\"list-disc pl-5 space-y-1 mb-3\">\n        <li>Lease commenced on 1 July 20X7</li>\n        <li>Present value of the lease payments at 1 July 20X7 was $2.273m</li>\n        <li>Payment of $0.5m on 1 July each year</li>\n        <li>Interest rate implicit in the lease of 5%</li>\n      </ul>\n      <p class=\"font-semibold text-slate-900 mb-1\">Two-year lease for telephone equipment</p>\n      <ul class=\"list-disc pl-5 space-y-1\">\n        <li>Underlying assets are of low value</li>\n        <li>Election made for the exemption available under IFRS 16 Leases</li>\n        <li>Lease commenced on 1 March 20X7</li>\n        <li>There was nothing to pay for the first six months of the lease</li>\n      </ul>\n    "}, "otq13": {"id": "otq13", "title": "OTQ 13 — Radiant Co", "rangeLabel": "Questions 61 – 65", "topic": "IFRS 9 & IAS 21", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 61 – 65.</p>\n      <p class=\"mb-3\">Radiant Co is preparing its financial statements for the year ended 30 November 20X8. The following information is relevant.</p>\n      <p class=\"font-semibold text-slate-900 mb-1\">Financial Liability</p>\n      <ul class=\"list-disc pl-5 space-y-1 mb-3\">\n        <li>Radiant Co raised finance by issuing $50,000 5% four-year loan notes on 1 December 20X7 at a discount of 10%</li>\n        <li>Nominal interest is paid in arrears and the redemption after four years will be at a 10% premium</li>\n        <li>The effective rate of interest is approximately 11%</li>\n        <li>The issue costs were $1,000</li>\n      </ul>\n      <p class=\"font-semibold text-slate-900 mb-1\">Foreign currency transaction</p>\n      <ul class=\"list-disc pl-5 space-y-1\">\n        <li>On 1 October 20X8, Radiant Co purchased goods on credit at a cost of 12,000 Kromits (Kt)</li>\n        <li>The full balance is outstanding at 30 November 20X8</li>\n      </ul>\n    "}, "otq14": {"id": "otq14", "title": "OTQ 14 — Huzaifa Co", "rangeLabel": "Questions 66 – 70", "topic": "IAS 32 & Equity", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 66 – 70.</p>\n      <p class=\"mb-3\">Huzaifa Co has a reporting date of 31 March each year.</p>\n      <p class=\"mb-3\">On 1 April 20X6 Huzaifa Co issued 100,000 $1 redeemable 5.9% preference shares at par. The shares are redeemable five years after issue at a premium of 25%. The effective rate of interest is 10%.</p>\n      <p class=\"mb-2\">During the year to 31 March 20X8, Huzaifa Co also had various share related transactions which have not yet been accounted for:</p>\n      <ol class=\"list-none pl-2 space-y-1.5 mb-3\">\n        <li><strong>1.</strong> A 1 for 4 bonus issue of $1 equity shares was made on 1 July 20X7 funded from the share premium.</li>\n        <li><strong>2.</strong> 10,000 $1 ordinary shares were issued for $8.50 each on 1 December 20X7.</li>\n      </ol>\n      <p class=\"mb-2\">The following details related to the equity share capital and share premium balances at 1 April 20X7:</p>\n      <table class=\"cbe-table\">\n        <thead><tr><th></th><th class=\"num\">Equity share capital ($)</th><th class=\"num\">Share premium ($)</th></tr></thead>\n        <tbody><tr><td>Balances brought forward 1 April 20X7</td><td class=\"num\">100,000</td><td class=\"num\">60,000</td></tr></tbody>\n      </table>\n      <p class=\"mt-3\">During the year ended 31 March 20X9, Huzaifa Co made a rights issue, incurring transaction costs of $20,000.</p>\n    "}, "otq15": {"id": "otq15", "title": "OTQ 15 — Ayan Co", "rangeLabel": "Questions 71 – 75", "topic": "IAS 33 & IAS 10", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 71 – 75.</p>\n      <p class=\"mb-3\">Ayan Co is preparing its financial statements for the year ended 31 December 20X8 which will be authorized for issue on 1 March 20X9.</p>\n      <p class=\"mb-3\">Ayan Co made a profit of $3.5m for the year. At 1 January 20X8, Ayan Co had 6 million shares in issue. On 1 May 20X8, Ayan Co performed a 2 for 5 rights issue when the market price of a share was $3, resulting in a theoretical ex-rights price of $2.80.</p>\n      <p>On 1 January 20X8, Ayan Co issued options over 2 million shares. Each option allows the holder to buy a share for $2.25 on 31 December 20X9. The market price of a share at 31 December 20X8 is $3.</p>\n    "}, "otq16": {"id": "otq16", "title": "OTQ 16 — Ahsan Co", "rangeLabel": "Questions 76 – 80", "topic": "IAS 36 & IAS 16", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 76 – 80.</p>\n      <p class=\"mb-3\">Ahsan Co is preparing its financial statements for the year ended 30 June 20X5. Ahsan Co manufactures network printers for use in large offices. The market for these printers is in decline and so an impairment review of the network printer production unit (as a single cash generating unit) was conducted on 30 June 20X5.</p>\n      <p class=\"mb-2\">In response to changes in the market, Ahsan Co is setting up a new production line to manufacture small desktop printers that are used with laptops. It purchases a machine on 15 December 20X4 and the following costs are relevant to the new production line:</p>\n      <table class=\"cbe-table\">\n        <thead><tr><th>Cost item</th><th class=\"num\">$'000</th></tr></thead>\n        <tbody>\n          <tr><td>Machine (useful life 15 years)</td><td class=\"num\">4,000</td></tr>\n          <tr><td>Reinforcement of factory floor to accommodate machine</td><td class=\"num\">2,000</td></tr>\n          <tr><td>Transport and installation in factory</td><td class=\"num\">50</td></tr>\n          <tr><td>Insurance – 12 months</td><td class=\"num\">10</td></tr>\n          <tr><td>Maintenance – 12 months</td><td class=\"num\">15</td></tr>\n          <tr><td>Estimated dismantling costs after 15 years (present value)</td><td class=\"num\">20</td></tr>\n          <tr><td>Testing of machine</td><td class=\"num\">5</td></tr>\n          <tr><td>Staff training in use of machine</td><td class=\"num\">4</td></tr>\n          <tr><td>Safety inspection of machine prior to use</td><td class=\"num\">2</td></tr>\n        </tbody>\n      </table>\n    "}, "otq17": {"id": "otq17", "title": "OTQ 17 — Waqar Co", "rangeLabel": "Questions 81 – 85", "topic": "IAS 16 & IFRS 5", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 81 – 85.</p>\n      <p class=\"mb-3\">Waqar Co is preparing its financial statements for the year ended 31 December 20X7. The following information is relevant.</p>\n      <p class=\"mb-3\">Waqar Co has a fleet of motor vehicles. The total cost of motor vehicles at 1 January 20X7 was $450,000 with accumulated depreciation at that date of $185,000. During the year to 31 December 20X7 vehicles with a total cost of $50,000 and accumulated depreciation of $15,000 were sold. The depreciation policy for motor vehicles is to charge 25% on the reducing balance basis but none in the year of disposal.</p>\n      <p class=\"mb-3\">On 1 November 20X7 a machine was sold for $60,000. It had originally cost the company $110,000 when purchased on 1 January 20X5 and was depreciated on a 15% reducing balance basis. The company has a policy of depreciating in full for the year of purchase but not depreciating assets in the year of disposal.</p>\n      <p>The management of Waqar Co also plan to sell a property for $850,000 with likely selling costs of $70,000. At 31 December 20X7, the sale is probable and the management team anticipate the disposal taking place in February 20X8. This property was originally purchased on 1 January 20X4 for $700,000 and estimated to have a useful life of 20 years. It was revalued on 1 January 20X6 to $900,000 but there was no change to its original useful life. Waqar Co has a policy of charging straight line depreciation on a proportionate basis. It also makes annual transfers from the revaluation surplus to retained earnings in respect of any additional depreciation charged as a result of a revaluation.</p>\n    "}, "otq18": {"id": "otq18", "title": "OTQ 18 — Warad Co", "rangeLabel": "Questions 86 – 90", "topic": "IAS 33 EPS", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 86 – 90.</p>\n      <p class=\"mb-3\">Warad Co is calculating earnings per share for inclusion in its financial statements for the year ended 31 December 20X5.</p>\n      <p class=\"mb-2\">Warad Co had 8 million ordinary $1 shares in issue at 1 January 20X5 and the following share issues at full market price took place during the year:</p>\n      <ul class=\"list-disc pl-5 space-y-1 mb-3\">\n        <li>1 April 20X5: 2 million ordinary $1 shares</li>\n        <li>1 October 20X5: 1 million ordinary $1 shares</li>\n      </ul>\n      <p class=\"mb-3\">Profit for the year ended 31 December 20X5 was <strong>$7,312,500</strong>.</p>\n      <p>Warad Co's assistant accountant has heard that earnings per share (EPS) is a more reliable way to compare performance than the underlying profit.</p>\n    "}, "otq19": {"id": "otq19", "title": "OTQ 19 — Gammon Co", "rangeLabel": "Questions 91 – 95", "topic": "IFRS 5 & IAS 33", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 91 – 95.</p>\n      <p class=\"mb-3\">Gammon Co manufactures and sells a wide variety of furniture. Its year-end date is 31 October 20X4.</p>\n      <p class=\"mb-3\">During the year, Gammon Co commenced restructuring and, as part of this, the Garden Furniture division was classified as held for sale. The Garden Furniture division was sold on 12 January 20X5. Prior to its classification as 'held for sale', the division's current assets were realised and the proceeds were used to settle its liabilities.</p>\n      <table class=\"cbe-table max-w-sm\">\n        <thead><tr><th>Garden Furniture division (31 Oct 20X4)</th><th class=\"num\">$'000</th></tr></thead>\n        <tbody>\n          <tr><td>Carrying amount</td><td class=\"num\">31,350</td></tr>\n          <tr><td>Value in use</td><td class=\"num\">20,010</td></tr>\n          <tr><td>Fair value</td><td class=\"num\">26,940</td></tr>\n          <tr><td>Selling costs</td><td class=\"num\">2,040</td></tr>\n        </tbody>\n      </table>\n      <p class=\"mt-3 mb-1 font-medium text-slate-900\">On 1 August 20X4, to partly-fund the restructuring:</p>\n      <ol class=\"list-none pl-2 space-y-1 mb-3\">\n        <li>(1) 18m equity (ordinary) shares were issued at market value.</li>\n        <li>(2) $60m of 8% convertible loan notes were issued at par. The effective interest rate was also 8%.</li>\n      </ol>\n      <p class=\"mb-1 font-medium text-slate-900\">Additional relevant information for Gammon Co:</p>\n      <ol class=\"list-none pl-2 space-y-1\">\n        <li>(1) 60m equity (ordinary) shares were in issue on 1 November 20X3.</li>\n        <li>(2) On 1 March 20X4, a one-for-four issue of bonus shares was made.</li>\n        <li>(3) Profit for the year from continuing operations for the year ended 31 October 20X4 was $103.8m.</li>\n        <li>(4) The income tax rate is 20%.</li>\n      </ol>\n    "}, "otq20": {"id": "otq20", "title": "OTQ 20 — Ulysses Co", "rangeLabel": "Questions 96 – 100", "topic": "IAS 8 & IFRS 5", "html": "\n      <p class=\"font-semibold text-slate-900 mb-3\">The following scenario relates to questions 96 – 100.</p>\n      <p class=\"mb-3\">Ulysses Co is a European based company and has a draft profit before tax of $275,000 for the year ended 31 December 20X5.</p>\n      <p class=\"mb-3\">When finalizing the financial statements for the year ended 31 December 20X5, it was discovered that closing inventory for the year ended 31 December 20X4 was understated by $38,000. This is regarded as a material prior period error. The entire inventory was sold during the year ended 31 December 20X5.</p>\n      <p class=\"mb-3\">During 20X5, Ulysses Co valued inventory on the first in, first out (FIFO) basis. On 1 January 20X6, it started to use the weighted average method (AVCO). On that same date, it also reduced the useful life of all items of computer equipment to three years which had previously been depreciated over five years.</p>\n      <p class=\"mb-2\">During the year to 31 December 20X6, Ulysses Co disposed of:</p>\n      <p class=\"mb-2\"><strong>Division A:</strong> A division based in Europe that makes diesel engines. The Ulysses group will no longer buy or sell diesel engines.</p>\n      <p><strong>Division B:</strong> Its only division based in Asia that makes brake cables. At the same time, Ulysses Co acquired another division based in Africa that makes brake cables.</p>\n    "}}, "questions": [{"num": 1, "section": "B", "scenarioId": "otq1", "type": "mcq", "topic": "IAS 32 Compound Instruments", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What amount of the convertible loan notes should be recognized as equity as at 31 December 20X2?</p>", "options": [{"key": "A", "text": "$5.55m"}, {"key": "B", "text": "$3.952m"}, {"key": "C", "text": "$9.2m"}, {"key": "D", "text": "$4.304m"}], "correct": "B", "explanation": "Discount cash flows at non-convertible market rate (7%): Coupon $2m × (0.935+0.873+0.816) = $5.248m; Principal $50m × 0.816 = $40.800m → Liability = $46.048m. Equity = $50m − $46.048m = <strong>$3.952m</strong> (not remeasured subsequently)."}, {"num": 2, "section": "B", "scenarioId": "otq1", "type": "mcq", "topic": "IAS 32 Liabilities", "marks": 2, "stem": "<p class='mb-2'>During the year ended 31 December 20X2, Alpha Co engaged in the following transactions:</p><ol class='list-none pl-2 space-y-1.5 mb-3'><li>(1) 5% bonds purchased by Alpha Co on 1 June 20X2 which will be repaid in 20X7.</li><li>(2) Preference shares, which were issued on 1 June 20X2 and will be redeemed in 20X8.</li><li>(3) Loan notes issued on 1 January 20X2, which carry a zero coupon rate and are not repayable until 20X9.</li><li>(4) An amount of $1.2m received on 1 November 20X2 as part of the proceeds from a debt factoring agreement. The debt factoring company has no recourse to Alpha Co for any debts that it is unable to collect.</li></ol><p class='font-semibold text-slate-900'>Which two of the above should be included within liabilities in the statement of financial position of Alpha Co as at 31 December 20X2?</p>", "options": [{"key": "A", "text": "2 and 4"}, {"key": "B", "text": "1 and 4"}, {"key": "C", "text": "1 and 3"}, {"key": "D", "text": "2 and 3"}], "correct": "D", "explanation": "(2) Redeemable preference shares and (3) zero-coupon loan notes carry contractual obligations to deliver cash → financial liabilities. (1) is a financial asset; (4) non-recourse factoring transfers risks/rewards (derecognise receivable, no liability)."}, {"num": 3, "section": "B", "scenarioId": "otq1", "type": "multi", "selectCount": 2, "topic": "IAS 32 Compound Instruments", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which TWO of the following statements about the convertible loan notes are correct?</p>", "options": [{"key": "A", "text": "The equity element of the convertible loan notes is debited to equity on their issue"}, {"key": "B", "text": "The equity element of the convertible loan notes is credited to equity on their issue"}, {"key": "C", "text": "The liability element of the convertible loan notes is held at amortised cost after their issue"}, {"key": "D", "text": "The liability element of the convertible loan notes is held at fair value after their issue"}], "correct": ["B", "C"], "explanation": "On issue, the residual equity component is credited to equity (<strong>B</strong>), and the liability component is subsequently measured at amortised cost using the effective interest rate (<strong>C</strong>)."}, {"num": 4, "section": "B", "scenarioId": "otq1", "type": "number", "topic": "IFRS 9 Amortised Cost", "marks": 2, "stem": "<p class='mb-2'>The 5% loan notes were issued on 1 January 20X1 for $40m. They carry a large premium on redemption giving them an effective interest rate of 10%.</p><p class='font-semibold text-slate-900'>What should the carrying amount of the loan notes be in the statement of financial position as at 31 December 20X2 (to the nearest $'000)?</p>", "prefix": "$", "suffix": "'000", "accepted": ["44200"], "displayCorrect": "$44,200,000 (enter 44200)", "explanation": "Opening 1 Jan 20X2 = $42,000k (given in table; $40m × 1.10 − $2m). Year 20X2: $42,000k + 10% ($4,200k) − 5% coupon ($2,000k) = <strong>$44,200k</strong>."}, {"num": 5, "section": "B", "scenarioId": "otq1", "type": "dropdown_table", "topic": "IFRS 9 Classification", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IFRS 9 <em>Financial Instruments</em> and IAS 32 <em>Financial Instruments: Presentation</em>, match TWO of the following default accounting treatments to the financial assets and liabilities held by Alpha Co.</p>", "headers": ["Financial instrument", "Default accounting treatment"], "rows": [{"id": "ln", "label": "5% loan notes", "options": ["Financial asset at fair value through profit or loss", "Financial asset at amortised cost investment", "Financial liability at amortised cost", "Classify partly as debt and partly as equity"], "correct": "Financial liability at amortised cost"}, {"id": "eq", "label": "Equity investments", "options": ["Financial asset at fair value through profit or loss", "Financial asset at amortised cost investment", "Financial liability at amortised cost", "Classify partly as debt and partly as equity"], "correct": "Financial asset at fair value through profit or loss"}], "explanation": "5% loan notes (issued debt) default to <strong>Financial liability at amortised cost</strong>; Equity investments default to <strong>Financial asset at fair value through profit or loss</strong> (unless irrevocable FVOCI election is made)."}, {"num": 6, "section": "B", "scenarioId": "otq2", "type": "tf_matrix", "topic": "IAS 12 Deferred Tax", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 12 <em>Income Taxes</em>, identify which of the following are true or false.</p>", "rows": [{"id": "r1", "text": "Deferred tax takes account of temporary differences", "correct": "True"}, {"id": "r2", "text": "Deferred tax liabilities are discounted to present value and the discount is unwound over time", "correct": "False"}, {"id": "r3", "text": "A revaluation of land will have no impact on the deferred tax liability", "correct": "False"}], "explanation": "Temporary differences drive deferred tax (True); IAS 12.53 prohibits discounting DT (False); land revaluation creates a taxable temporary difference (False)."}, {"num": 7, "section": "B", "scenarioId": "otq2", "type": "mcq", "topic": "IAS 12 Deferred Tax", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In respect of Grinnit Co's net assets and excluding the revaluation of land, what is the manual journal entry required to recognise the movement in the deferred tax liability for the year ended 31 October 20X7?</p>", "options": [{"key": "A", "text": "Dr Income tax expense $8,000; Cr Deferred tax liability $8,000"}, {"key": "B", "text": "Dr Income tax expense $54,000; Cr Deferred tax liability $54,000"}, {"key": "C", "text": "Dr Deferred tax liability $8,000; Cr Income tax expense $8,000"}, {"key": "D", "text": "Dr Deferred tax liability $54,000; Cr Income tax expense $54,000"}], "correct": "C", "explanation": "Closing DTL (excl. land) = $180,000 × 30% = $54,000 vs Opening $62,000 → decrease of $8,000: <strong>Dr Deferred tax liability $8,000; Cr Income tax expense $8,000</strong>."}, {"num": 8, "section": "B", "scenarioId": "otq2", "type": "dropdown_table", "topic": "IAS 16 PPE", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 16 <em>Property, Plant and Equipment</em>, match the correct tokens with the DEBIT and CREDIT to reproduce the manual journal entry required to revalue land (ignore deferred tax).</p>", "headers": ["Journal to revalue land", "Token"], "rows": [{"id": "dr", "label": "DEBIT", "options": ["Dr Land", "Cr Land", "Dr Investment income", "Cr Investment income", "Dr Revaluation surplus", "Cr Revaluation surplus"], "correct": "Dr Land"}, {"id": "cr", "label": "CREDIT", "options": ["Dr Land", "Cr Land", "Dr Investment income", "Cr Investment income", "Dr Revaluation surplus", "Cr Revaluation surplus"], "correct": "Cr Revaluation surplus"}], "explanation": "Upward revaluation of land (+$60,000): <strong>Dr Land; Cr Revaluation surplus</strong> (OCI)."}, {"num": 9, "section": "B", "scenarioId": "otq2", "type": "number", "topic": "IAS 12 & IAS 16", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Including the deferred tax effect of the land revaluation, what is the balance of the revaluation surplus at 1 August 20X7 (to the nearest $'000)?</p>", "prefix": "$", "suffix": ",000", "accepted": ["42"], "displayCorrect": "$42,000 (enter 42)", "explanation": "Revaluation gain ($300k − $240k = $60k) less 30% deferred tax ($18k) = <strong>$42,000</strong> (enter 42)."}, {"num": 10, "section": "B", "scenarioId": "otq2", "type": "mcq", "topic": "IAS 16 PPE", "marks": 2, "stem": "<p class='font-semibold text-slate-900 mb-2'>In accordance with IAS 16 <em>Property, Plant and Equipment</em>, which of the following statements is/are true?</p><ol class='list-none pl-2 space-y-1.5 mb-2'><li>(1) Grinnit Co has changed its accounting policy for measuring land to the revaluation model. All items of property, plant and equipment must now be revalued</li><li>(2) If Grinnit Co revalued its property upwards for the first time, transfers may be made from the revaluation surplus to retained earnings as the asset is used</li></ol>", "options": [{"key": "A", "text": "1 only"}, {"key": "B", "text": "2 only"}, {"key": "C", "text": "Both 1 and 2"}, {"key": "D", "text": "Neither 1 nor 2"}], "correct": "B", "explanation": "Only the entire <em>class</em> of land must be revalued (1 is false). Annual excess depreciation transfers from revaluation surplus to retained earnings are permitted under IAS 16.41 (2 is true)."}, {"num": 11, "section": "B", "scenarioId": "otq3", "type": "mcq", "topic": "IFRS 5 Held for Sale", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Identify which of the following is NOT a criterion for classification of an asset as held for sale?</p>", "options": [{"key": "A", "text": "An active programme to locate a buyer and complete the plan must have been initiated."}, {"key": "B", "text": "The sale should be expected to take place within one year from the end of the current accounting period"}, {"key": "C", "text": "The asset must be available for immediate sale in its present location and condition"}, {"key": "D", "text": "The sale must be highly probable."}], "correct": "B", "explanation": "Under <strong>IFRS 5.8</strong>, the sale must be expected within one year from the <em>date of classification</em>, NOT from the end of the reporting period."}, {"num": 12, "section": "B", "scenarioId": "otq3", "type": "number", "topic": "IFRS 5 Impairment", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Calculate the impairment loss to be recognized when the plant is classified as held for sale.</p>", "prefix": "$", "suffix": "", "accepted": ["4240"], "displayCorrect": "$4,240", "explanation": "Carrying amount at 1 Oct 20X8 (6 months dep @ 12% RB): $96,000 − ($96,000 × 12% × 6/12 = $5,760) = $90,240. FVLCTS = $91,000 − $5,000 = $86,000. Impairment loss = $90,240 − $86,000 = <strong>$4,240</strong>."}, {"num": 13, "section": "B", "scenarioId": "otq3", "type": "multi", "selectCount": 2, "topic": "IAS 38 Intangibles", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which TWO of the following statements correctly reflect the requirements of IAS 38 <em>Intangible Assets</em>?</p>", "options": [{"key": "A", "text": "Intangible assets with a finite useful life should be amortised over that life and intangible assets with an indefinite useful life should not be amortised."}, {"key": "B", "text": "Intangible assets should not be amortised but instead should be reviewed for impairment annually."}, {"key": "C", "text": "The amortization period and method applied to intangible assets should be reviewed at least annually."}, {"key": "D", "text": "Intangible assets should be amortised to reflect the pattern of revenue that they will generate"}], "correct": ["A", "C"], "explanation": "Finite-life intangibles are amortised; indefinite-life intangibles are not amortised (<strong>A</strong>). Amortisation period and method must be reviewed at least annually (<strong>C</strong>). IAS 38.98A creates a rebuttable presumption against revenue-based amortisation (D)."}, {"num": 14, "section": "B", "scenarioId": "otq3", "type": "mcq", "topic": "IAS 38 R&D", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 38 <em>Intangible Assets</em>, what amount is charged to the Statement of profit or loss for the year ended 31 March 20X9 in respect of Project X?</p>", "options": [{"key": "A", "text": "$16.5m"}, {"key": "B", "text": "$19.5m"}, {"key": "C", "text": "$21m"}, {"key": "D", "text": "$30m"}], "correct": "A", "explanation": "$45m over 9 months = $5m/month. Research (1 Apr – 30 Jun 20X8 = 3m): $15.0m expensed. Development (1 Jul – 31 Dec 20X8 = 6m): $30.0m capitalised. Amortisation (1 Jan – 31 Mar 20X9 = 3m over 5 yrs): ($30m/5) × 3/12 = $1.5m. Total P&L = $15.0m + $1.5m = <strong>$16.5m</strong>."}, {"num": 15, "section": "B", "scenarioId": "otq3", "type": "mcq", "topic": "IAS 38 & IAS 37", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which of the following would result in the recognition of an asset in Anooshi's statement of financial position at 31 March 20X9?</p>", "options": [{"key": "A", "text": "Anooshi spent $60,000 on an advertising campaign in April 20X8. It expects the advertising to generate additional sales of $120,000 over the next two years."}, {"key": "B", "text": "Anooshi purchased the copyright and film rights to the next book to be written by a famous author for $85,000 on 1 March 20X9."}, {"key": "C", "text": "Anooshi is taking legal action against a contractor for faulty work. Its legal team has advised that it is probable that Anooshi will receive $210,000 in settlement of its claim within the next 12 months."}, {"key": "D", "text": "Anooshi has developed a new brand name. The directors believe the fair value of the brand name is $135,000."}], "correct": "B", "explanation": "Separately purchased copyright/film rights (<strong>B</strong>) are recognised as an intangible asset at cost ($85,000). Advertising (A) and internally generated brands (D) cannot be capitalised; probable legal claims (C) are contingent assets (disclosed only)."}, {"num": 16, "section": "B", "scenarioId": "otq4", "type": "mcq", "topic": "IFRS 15 Over Time", "marks": 2, "stem": "<p class='mb-2'>Various methods had been proposed by Pingshan Co for measuring the progress of the contract with Luoho Co:</p><ol class='list-none pl-2 space-y-1 mb-3'><li>(1) Fair value method</li><li>(2) Input method</li><li>(3) Output method</li><li>(4) Effective interest method</li></ol><p class='font-semibold text-slate-900'>In accordance with IFRS 15, which of the above methods would be appropriate methods for measuring the progress of the contract with Luoho Co?</p>", "options": [{"key": "A", "text": "2 or 3"}, {"key": "B", "text": "1 or 3"}, {"key": "C", "text": "1 or 4"}, {"key": "D", "text": "2 or 4"}], "correct": "A", "explanation": "Under <strong>IFRS 15.41</strong>, progress towards satisfaction of a performance obligation over time is measured using either <strong>output methods (3)</strong> or <strong>input methods (2)</strong>."}, {"num": 17, "section": "B", "scenarioId": "otq4", "type": "mcq", "topic": "IFRS 15 Contract Balances", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IFRS 15, calculate the contract asset (or liability) to be presented at 31 August 20X4 for the Luoho Co contract.</p>", "options": [{"key": "A", "text": "Contract asset of $0.1m"}, {"key": "B", "text": "Contract liability of $0.1m"}, {"key": "C", "text": "Contract asset of $0.9m"}, {"key": "D", "text": "Contract liability of $0.9m"}], "correct": "B", "explanation": "Revenue earned to date = 50% × $1.8m = $0.9m. Amount invoiced &amp; paid = $1.0m. Since billings exceed revenue earned ($1.0m − $0.9m), there is a <strong>Contract liability of $0.1m</strong>."}, {"num": 18, "section": "B", "scenarioId": "otq4", "type": "mcq", "topic": "IFRS 15 Financing", "marks": 2, "stem": "<p class='mb-2'>The amount of income recognized by Pingshan Co in relation to the Dapeng Co contract is incorrect.</p><p class='font-semibold text-slate-900'>What is the correct total income to be recognized in Pingshan Co's statement of profit or loss for the year ended 31 August 20X4, in respect of the Dapeng Co contract?</p>", "options": [{"key": "A", "text": "$2.8m"}, {"key": "B", "text": "$2.9m"}, {"key": "C", "text": "$3.0m"}, {"key": "D", "text": "$3.2m"}], "correct": "B", "explanation": "PV of revenue at 1 Mar 20X4 = $3.0m ÷ 1.07 = $2.804m. Unwinding of discount for 6 months (1 Mar – 31 Aug 20X4) = $2.804m × 7% × 6/12 = $0.098m. Total income = $2.804m + $0.098m = $2.902m ≈ <strong>$2.9m</strong>."}, {"num": 19, "section": "B", "scenarioId": "otq4", "type": "mcq", "topic": "IFRS 15 Allocation", "marks": 2, "stem": "<p class='mb-2'>There is no significant financing component in the contract with Futian Co.</p><p class='font-semibold text-slate-900'>What is the correct amount of revenue to recognize in Pingshan Co's statement of profit or loss for the year ended 31 August 20X4, in respect of the Futian Co contract?</p>", "options": [{"key": "A", "text": "$3.73m"}, {"key": "B", "text": "$3.91m"}, {"key": "C", "text": "$3.96m"}, {"key": "D", "text": "$4.00m"}], "correct": "A", "explanation": "Stand-alone selling prices: Plant = $4.0m; 1-yr Servicing = $0.3m × 4/3 = $0.4m (total SSP = $4.4m). Allocate $4.0m:<br>• Plant: $4.0m × (4.0/4.4) = $3.636m (recognised immediately).<br>• Servicing: $4.0m × (0.4/4.4) = $0.364m → 3 months (Jun–Aug) = $0.091m.<br>• Total revenue = $3.636m + $0.091m = <strong>$3.73m</strong>."}, {"num": 20, "section": "B", "scenarioId": "otq4", "type": "mcq", "topic": "IFRS 15 Discounts", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>For the Yantian Co contract, combining two items of equipment but no servicing contract, which of the following describes the correct accounting treatment?</p>", "options": [{"key": "A", "text": "Apply the discount to the equipment with the highest individual stand-alone selling price only"}, {"key": "B", "text": "Apply the discount to the equipment with the lowest individual stand-alone selling price only"}, {"key": "C", "text": "Allocate the discount proportionately to both items of equipment"}, {"key": "D", "text": "Recognise revenue as the sum of the stand-alone selling prices with the discount allowed recognised separately as an expense"}], "correct": "C", "explanation": "Under <strong>IFRS 15.81</strong>, unless there is observable evidence that a discount relates entirely to one or more specific performance obligations, the discount is allocated <strong>proportionately to all performance obligations</strong>."}, {"num": 21, "section": "B", "scenarioId": "otq5", "type": "mcq", "topic": "IFRS 16 Leases", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which of the following statements describes the effect that correctly accounting for the payment of $10,000 on 1 January 20X5 has on the financial statements?</p>", "options": [{"key": "A", "text": "It should decrease expenses in the statement of profit or loss"}, {"key": "B", "text": "It should not be included as part of the lease liability"}, {"key": "C", "text": "It should increase expenses in the statement of profit or loss"}, {"key": "D", "text": "It should be included as part of the lease liability"}], "correct": "B", "explanation": "The initial deposit paid on commencement (1 Jan 20X5) is added to the right-of-use asset and <strong>not included as part of the lease liability</strong> (which only includes unpaid future lease payments)."}, {"num": 22, "section": "B", "scenarioId": "otq5", "type": "multi", "selectCount": 2, "topic": "IFRS 16 Leases", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Ignoring the recognition exemptions provided by IFRS 16 <em>Leases</em>, which TWO of the following statements are true?</p>", "options": [{"key": "A", "text": "The capitalized right-of-use asset on commencement of the lease must equal only the present value of lease payments"}, {"key": "B", "text": "Accounting for leases will have an impact on the lessee's finance costs"}, {"key": "C", "text": "A right-of-use asset represents a lessee's right to use an underlying asset for the lease term"}, {"key": "D", "text": "When the lessee first recognizes a right-of-use asset in accordance with IFRS 16, assets will increase and liabilities will decrease"}], "correct": ["B", "C"], "explanation": "Lease liabilities unwind interest through finance costs (<strong>B</strong>), and the ROU asset represents the right to use the underlying asset for the lease term (<strong>C</strong>)."}, {"num": 23, "section": "B", "scenarioId": "otq5", "type": "mcq", "topic": "IFRS 16 ROU Asset", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>What is the value of Pakka Co's right-of-use (ROU) asset at the lease commencement date?</p>", "options": [{"key": "A", "text": "$44,200"}, {"key": "B", "text": "$41,700"}, {"key": "C", "text": "$49,200"}, {"key": "D", "text": "$51,700"}], "correct": "D", "explanation": "Initial ROU asset = PV of future lease payments ($10,000 × 3.17 = $31,700) + Initial
