l employed (ROCE) for the last quarter of 20X0 was higher than the average for the year ended 31 December 20X0.</p><p class='font-semibold text-slate-900'>Which TWO of the following would explain this?</p>", "options": [{"key": "A", "text": "The company's business is seasonal, with higher sales and profits in the second and fourth quarters"}, {"key": "B", "text": "The purchase and use of raw materials from a cheaper supplier from October 20X0 onwards"}, {"key": "C", "text": "An increase in the bank overdraft rate of interest with effect from November 20X0"}, {"key": "D", "text": "The purchase of land for future development financed by a loan in December 20X0"}], "correct": ["A", "B"], "explanation": "Higher Q4 seasonal profits (<strong>A</strong>) and lower raw material costs from October (<strong>B</strong>) boost Q4 operating profit (numerator of ROCE)."}, {"num": 10, "section": "A", "type": "number", "topic": "IAS 16 & IAS 37", "marks": 2, "stem": "<p class='mb-2'>On 1 February 20X6, Osmond Co acquired specialist mining equipment at a cost of $50m (useful life 5 years). Estimated decommissioning cost in 5 years is $9m. Cost of capital is 14% (5-year discount factor 0.519).</p><p class='font-semibold text-slate-900'>What is the total expense charged to profit or loss for the year ended 31 January 20X7 (to the nearest $'000)?</p>", "prefix": "$", "suffix": ",000", "accepted": ["11588"], "displayCorrect": "$11,588,000 (enter 11588)", "explanation": "PV decommissioning = $4,671k. Dep = ($50,000k + $4,671k)/5 = $10,934.2k. Unwinding @ 14% = $653.94k. Total = <strong>$11,588k</strong>."}, {"num": 11, "section": "A", "type": "number", "topic": "Ratio Analysis", "marks": 2, "stem": "<p class='mb-2'>Morgana Co's statement of profit or loss for the year ended 31 December 20X4 shows cost of sales of $44m. Inventory at 1 January 20X4 was $9.5m. At 31 December 20X4 trade payables were $5.65m and inventory was $7.5m. All purchases are on credit.</p><p class='font-semibold text-slate-900'>What is the trade payables payment period at 31 December 20X4 based on credit purchases (to the nearest whole day)?</p>", "prefix": "", "suffix": "days", "accepted": ["49"], "displayCorrect": "49 days", "explanation": "Credit purchases = COS ($44m) + Closing inv ($7.5m) − Opening inv ($9.5m) = $42.0m. Payables days = ($5.65m / $42.0m) × 365 = 49.1 ≈ <strong>49 days</strong>."}, {"num": 12, "section": "A", "type": "mcq", "topic": "IFRS 3 Contingent Liabilities", "marks": 2, "stem": "<p class='mb-2'>Penlight Co acquired 80% of Skylight Co on 1 January 20X8. Skylight Co had an unrecorded contingent liability assessed at a fair value of $200,000 at acquisition. NCI is measured at fair value (contingent liability already reflected in consideration and NCI).</p><p class='font-semibold text-slate-900'>Identify the impact of the fair value of the contingent liability on the calculation of goodwill at 1 January 20X8.</p>", "options": [{"key": "A", "text": "Increase by $160,000"}, {"key": "B", "text": "Increase by $200,000"}, {"key": "C", "text": "Increase by $40,000"}, {"key": "D", "text": "Goodwill is unchanged"}], "correct": "B", "explanation": "Under IFRS 3.23, a contingent liability with a reliable fair value is recognised at acquisition, reducing net assets by $200,000 and thereby <strong>increasing goodwill by $200,000</strong>."}, {"num": 13, "section": "A", "type": "tf_matrix", "topic": "Conceptual Framework", "marks": 2, "cols": ["Relevance", "Faithful Representation"], "stem": "<p class='font-semibold text-slate-900'>Indicate whether the following attributes achieve relevance or faithful representation in accordance with the IASB Conceptual Framework.</p>", "rows": [{"id": "r1", "text": "Confirmatory value", "correct": "Relevance"}, {"id": "r2", "text": "Free from error", "correct": "Faithful Representation"}, {"id": "r3", "text": "Predictive value", "correct": "Relevance"}, {"id": "r4", "text": "Neutrality", "correct": "Faithful Representation"}], "explanation": "Relevance = predictive value + confirmatory value. Faithful representation = complete, neutral, and free from error."}, {"num": 14, "section": "A", "type": "dropdown_table", "topic": "IFRS 10 Consolidation", "marks": 2, "stem": "<p class='mb-2'>Badger Co acquired 70% of Mole Co on 1 October 20X7 (NCI FV $0.9m). Post-acquisition profits of Mole Co were $500,000 before consolidation adjustments. At acquisition, a FV uplift of $400,000 was recorded on Mole Co's property (remaining life 20 years). At 30 September 20X8 Badger Co's retained earnings were $3.5m.</p><p class='font-semibold text-slate-900'>Identify the amounts reported in the consolidated SOFP at 30 September 20X8.</p>", "headers": ["Consolidated SOFP line", "Amount"], "rows": [{"id": "nci", "label": "Non-controlling interest", "options": ["$1,044,000", "$1,050,000", "$3,836,000", "$3,850,000"], "correct": "$1,044,000"}, {"id": "re", "label": "Group retained earnings", "options": ["$1,044,000", "$1,050,000", "$3,836,000", "$3,850,000"], "correct": "$3,836,000"}], "explanation": "Adjusted Mole post-acq profit = $500k − ($400k/20 = $20k) = $480k. NCI = $900k + 30%($480k) = <strong>$1,044,000</strong>. Group RE = $3,500k + 70%($480k) = <strong>$3,836,000</strong>."}, {"num": 15, "section": "A", "type": "multi", "selectCount": 2, "topic": "IAS 37 Provisions", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which TWO of the following items would be recognized as a provision or a liability in Sun Co's statement of financial position as at 31 July 20X5?</p>", "options": [{"key": "A", "text": "On 1 July 20X5, the directors of Sun Co decided to raise finance by issuing 100,000 $1 equity shares at a premium of $0.50."}, {"key": "B", "text": "Sun Co purchased and installed an asset on 1 August 20X4 and is required to dismantle the asset and repair environmental damage on 31 July 20X8 at a cost of $4m"}, {"key": "C", "text": "The tax department of Sun Co has estimated the tax charge on its profits for the year ended 31 July 20X5 as $325,000"}, {"key": "D", "text": "Due to the loss of a key customer in June 20X5 Sun Co expects to make an operating loss of $650,000 in the year to 31 July 20X6"}, {"key": "E", "text": "On 21 July 20X5, the board decided to close a division and drew up a detailed plan; communication to affected parties was made after year-end."}], "correct": ["B", "C"], "explanation": "Decommissioning obligation (<strong>B</strong>) is a provision; estimated current year income tax (<strong>C</strong>) is a current liability. Future operating losses (D) and uncommunicated closures (E) cannot be provided for."}, {"num": 16, "section": "A", "type": "multi", "selectCount": 2, "topic": "IFRS 10 & IAS 28", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which TWO of the following statements are correct in relation to consolidated financial statements?</p>", "options": [{"key": "A", "text": "If an entity owns less than 45% of the voting rights of another entity, it must always account for that investment using the equity method"}, {"key": "B", "text": "If an entity has associates, but not subsidiaries, it will not prepare consolidated financial statements"}, {"key": "C", "text": "When a parent company acquires a subsidiary part way through the year, only pre-acquisition profits are included in the group's consolidated statement of profit or loss"}, {"key": "D", "text": "Where an investor is exposed, or has rights, to variable returns from its involvement with the investee and has the ability to affect those returns through its power over the investee, the investee should be consolidated"}], "correct": ["B", "D"], "explanation": "Consolidated FS are only required when an entity has subsidiaries (<strong>B</strong>); IFRS 10 defines control via power, variable returns, and ability to use power to affect returns (<strong>D</strong>)."}, {"num": 17, "section": "A", "type": "mcq", "topic": "IFRS 15 Revenue", "marks": 2, "stem": "<p class='mb-2'>Zelda Co experienced the following events:<br>(1) Customer ordered goods ($30k) in Dec 20X2 for delivery in Jan 20X3.<br>(2) Customer ordered goods in Dec 20X2 for delivery in Feb 20X3 and paid full price upfront.<br>(3) Goods ordered in Nov were dispatched on 15 Dec 20X2; payment due Jan 20X3.<br>(4) Goods were delivered and paid for in Dec 20X2 at a significant loss.</p><p class='font-semibold text-slate-900'>For which of these events should Zelda Co recognize revenue during the year ended 31 December 20X2?</p>", "options": [{"key": "A", "text": "2 and 3"}, {"key": "B", "text": "1 and 2"}, {"key": "C", "text": "1 and 4"}, {"key": "D", "text": "3 and 4"}], "correct": "D", "explanation": "Control transferred in 20X2 only for events <strong>(3) and (4)</strong>. Upfront payment before delivery (2) is a contract liability."}, {"num": 18, "section": "A", "type": "mcq", "topic": "IFRS 3 Consideration", "marks": 2, "stem": "<p class='mb-2'>Tin Co purchased 80% of the 50,000 $1 ordinary shares of Vape Co on 1 January 20X5. Consideration included a 2-for-5 share exchange (Tin Co share price $12) plus deferred cash of $157,500 payable on 1 January 20X6. Cost of capital is 5%.</p><p class='font-semibold text-slate-900'>Calculate the fair value of the consideration paid by Tin Co on 1 January 20X5.</p>", "options": [{"key": "A", "text": "$349,500"}, {"key": "B", "text": "$357,375"}, {"key": "C", "text": "$390,000"}, {"key": "D", "text": "$342,000"}], "correct": "D", "explanation": "Share exchange: (40,000 × 2/5 = 16,000 shares) × $12 = $192,000. Deferred cash PV = $157,500 ÷ 1.05 = $150,000. Total = <strong>$342,000</strong>."}, {"num": 19, "section": "A", "type": "mcq", "topic": "IFRS 16 Current Liability", "marks": 2, "stem": "<p class='mb-2'>A company entered into a four-year lease on 1 January 20X0 (PV $950,000, $300,000 annually in arrears, implicit rate 10%).</p><p class='font-semibold text-slate-900'>What amount should be shown as a current liability as at 31 December 20X0?</p>", "options": [{"key": "A", "text": "$225,500"}, {"key": "B", "text": "$745,000"}, {"key": "C", "text": "$519,500"}, {"key": "D", "text": "$300,000"}], "correct": "A", "explanation": "31 Dec 20X0 liability = $745,000; 31 Dec 20X1 (NCL) = $519,500 → Current liability = $745,000 − $519,500 = <strong>$225,500</strong>."}, {"num": 20, "section": "A", "type": "multi", "selectCount": 2, "topic": "Not-for-Profit Ratios", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which TWO of the following ratios are likely to be the LEAST relevant for a not-for-profit entity which is partly financed by borrowing?</p>", "options": [{"key": "A", "text": "Current ratio"}, {"key": "B", "text": "Interest cover"}, {"key": "C", "text": "Dividend cover"}, {"key": "D", "text": "Earnings per share"}], "correct": ["C", "D"], "explanation": "Not-for-profit entities do not have equity shareholders or pay dividends, making <strong>Dividend cover (C)</strong> and <strong>Earnings per share (D)</strong> irrelevant."}, {"num": 21, "section": "A", "type": "multi", "selectCount": 2, "topic": "Conceptual Framework", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which TWO of the following statements are true regarding the Conceptual Framework for Financial Reporting of the IASB?</p>", "options": [{"key": "A", "text": "It is principles-based rather than rules-based but it is not an IFRS Standard"}, {"key": "B", "text": "The principles contained in the Conceptual Framework override any IFRS Standard that exists"}, {"key": "C", "text": "It requires accountants to evaluate and address threats to compliance with fundamental ethical principles"}, {"key": "D", "text": "If it is revised it will not automatically lead to changes to the IFRS Standards"}], "correct": ["A", "D"], "explanation": "The Framework is not an IFRS Standard and never overrides a specific Standard (<strong>A</strong>); revising it does not automatically change existing Standards (<strong>D</strong>)."}, {"num": 22, "section": "A", "type": "mcq", "topic": "IAS 41 Agriculture", "marks": 2, "stem": "<p class='mb-2'>Scotswood Co purchased a herd of 600 bison on 1 February 20X5 for $90,000. At 30 June 20X5, the market price was $175 per bison. All trading incurs selling costs of 8% plus a fixed charge of $1 per bison.</p><p class='font-semibold text-slate-900'>In accordance with IAS 41 <em>Agriculture</em>, what is the carrying amount for the herd of bison at 30 June 20X5?</p>", "options": [{"key": "A", "text": "$90,000"}, {"key": "B", "text": "$96,000"}, {"key": "C", "text": "$96,600"}, {"key": "D", "text": "$104,400"}], "correct": "B", "explanation": "Fair value = 600 × $175 = $105,000. Less costs to sell: 8% ($8,400) + $600 fixed = $9,000 → <strong>$96,000</strong>."}, {"num": 23, "section": "A", "type": "number", "topic": "IAS 28 Associates", "marks": 2, "stem": "<p class='mb-2'>Saguaro Co acquired 25% of the equity shares in Cactus Co for $400,000 on 1 March 20X1. In July 20X1, Cactus Co paid a dividend of $36,000. Cactus Co's profit for the year ended 31 December 20X1 was $115,200 (accrued evenly).</p><p class='font-semibold text-slate-900'>What is the carrying amount of the investment in the associate in Saguaro Co's consolidated statement of financial position as at 31 December 20X1?</p>", "prefix": "$", "suffix": "", "accepted": ["415000"], "displayCorrect": "$415,000", "explanation": "Cost ($400,000) + Share of post-acq profit for 10 months [25% × ($115,200 × 10/12) = $24,000] − Share of dividend [25% × $36,000 = $9,000] = <strong>$415,000</strong>."}, {"num": 24, "section": "A", "type": "tf_matrix", "topic": "IAS 16 Revaluation", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In accordance with IAS 16 <em>Property, Plant and Equipment</em>, identify whether each of the following statements is true or false.</p>", "rows": [{"id": "r1", "text": "If an entity decides to use the revaluation model, then all of its non-current assets must be revalued", "correct": "False"}, {"id": "r2", "text": "An entity must transfer excess depreciation from the revaluation surplus to retained earnings on an annual basis in respect of any property which it revalues", "correct": "False"}, {"id": "r3", "text": "If an entity decides to revalue property annually, then this property will not need to be depreciated", "correct": "False"}, {"id": "r4", "text": "There is no requirement for an entity to revalue property on an annual basis", "correct": "True"}], "explanation": "Row 1: False (only the same <em>class</em>). Row 2: <strong>False</strong> — under IAS 16.41 the excess depreciation transfer is <em>optional</em> ('may'), NOT mandatory ('must') (corrected from source PDF annotation). Row 3: False (still depreciated). Row 4: True (only with sufficient regularity)."}, {"num": 25, "section": "A", "type": "mcq", "topic": "Ratio Analysis (Liquidity)", "marks": 2, "stem": "<p class='mb-2'>Fifer Co has a current ratio of 1.2:1 which is below the industry average. Fifer Co wants to increase its current ratio by the year end.</p><p class='font-semibold text-slate-900'>Which of the following actions, taken before the year end, would lead to an increase in the current ratio?</p>", "options": [{"key": "A", "text": "Return some inventory which had been purchased for cash and obtain a full refund on the cost"}, {"key": "B", "text": "Make a bulk purchase of inventory for cash to obtain a large discount"}, {"key": "C", "text": "Make an early payment to suppliers, even though the amount is not due"}, {"key": "D", "text": "Offer early payment discounts in order to collect receivables more quickly"}], "correct": "C", "explanation": "When current ratio &gt; 1 (1.2:1), reducing both current assets (cash) and current liabilities (payables) by the same amount via an <strong>early payment to suppliers (C)</strong> increases the ratio (e.g. 120/100 = 1.20 → 100/80 = 1.25). Returning inventory for cash (A) leaves total current assets unchanged."}, {"num": 26, "section": "A", "type": "number", "topic": "IFRS 10 Consolidated COS", "marks": 2, "stem": "<p class='mb-2'>Parked Co acquired 60% of Sukkot Co on 1 January 20X7. Cost of sales for the year ended 31 March 20X7: Parked Co $710,000; Sukkot Co $480,000. Parked Co consistently made sales of $20,000 per month to Sukkot Co throughout the year. At year-end, Sukkot Co held $20,000 of this in inventory. Parked Co made a mark-up of 25% on all sales to Sukkot Co.</p><p class='font-semibold text-slate-900'>What is Parked Co's consolidated cost of sales for the year ended 31 March 20X7 (to the nearest whole $)?</p>", "prefix": "$", "suffix": "", "accepted": ["774000"], "displayCorrect": "$774,000", "explanation": "Post-acq period = 3 months (Jan–Mar 20X7): Parked COS ($710,000) + Sukkot 3/12 ($480,000 × 3/12 = $120,000) − Post-acq intragroup sales (3 × $20,000 = $60,000) + PUP ($20,000 × 25/125 = $4,000) = <strong>$774,000</strong>. (Corrected from handwritten '$726,000' in source PDF.)"}, {"num": 27, "section": "A", "type": "dropdown_table", "topic": "IAS 8 Estimates", "marks": 2, "stem": "<p class='mb-2'>A company has decided to change its depreciation method to better reflect the pattern of use of its equipment.</p><p class='font-semibold text-slate-900'>Select the correct tokens to complete the statement.</p>", "headers": ["Statement", "Selection"], "rows": [{"id": "t1", "label": "This is a change of accounting...", "options": ["Policy", "Estimate"], "correct": "Estimate"}, {"id": "t2", "label": "And must be applied...", "options": ["retrospectively", "prospectively"], "correct": "prospectively"}], "explanation": "Changing depreciation method is a change in accounting <strong>Estimate</strong> (IAS 16.61) and is applied <strong>prospectively</strong>."}, {"num": 28, "section": "A", "type": "mcq", "topic": "IFRS 10 Consolidated Inventory", "marks": 2, "stem": "<p class='mb-2'>Paula Co acquired 80% of Sank Co on 1 October 20X5. At acquisition, some of Sank Co's inventory had a carrying amount of $0.2m and fair value of $0.4m, of which 70% had been sold by 31 December 20X5. Individual inventories at 31 Dec 20X5: Paula Co $3,250k; Sank Co $1,940k.</p><p class='font-semibold text-slate-900'>What will be the total inventories figure in the consolidated SOFP at 31 December 20X5?</p>", "options": [{"key": "A", "text": "$5,250,000"}, {"key": "B", "text": "$5,330,000"}, {"key": "C", "text": "$5,130,000"}, {"key": "D", "text": "$5,238,000"}], "correct": "A", "explanation": "Paula ($3,250k) + Sank ($1,940k) + Remaining 30% of $200k FV uplift ($60k) = <strong>$5,250,000</strong>."}, {"num": 29, "section": "A", "type": "mcq", "topic": "IAS 16 Revaluation & Transfer", "marks": 2, "stem": "<p class='mb-2'>Bugle Co acquired a property on 1 April 20X2 for $6m (land $2m, buildings $4m, 40-year life). On 1 April 20X7 it was revalued to $8m (land $2.75m, buildings $5.25m) with no change in useful life. Bugle Co makes an annual transfer for excess depreciation.</p><p class='font-semibold text-slate-900'>What is the carrying amount of the property and the balance on Bugle Co's revaluation surplus as at 31 March 20X8?</p>", "options": [{"key": "A", "text": "Property $7.85m; Revaluation surplus $2.5m"}, {"key": "B", "text": "Property $7.87m; Revaluation surplus $2.47m"}, {"key": "C", "text": "Property $7.77m; Revaluation surplus $2.67m"}, {"key": "D", "text": "Property $7.85m; Revaluation surplus $2.45m"}], "correct": "D", "explanation": "At 1 Apr 20X7: CA = $2m + ($4m − 5×$0.1m) = $5.5m → Surplus = $8m − $5.5m = $2.5m. 20X8 bldgs dep = $5.25m / 35 = $0.15m → CA = $8m − $0.15m = <strong>$7.85m</strong>. Excess dep = $0.15m − $0.10m = $0.05m → Surplus = <strong>$2.45m</strong>."}, {"num": 30, "section": "A", "type": "mcq", "topic": "IFRS 9 Equity Investments", "marks": 2, "stem": "<p class='mb-2'><strong>Investment 1:</strong> 10% of Haruki Co acquired as a long-term investment.<br><strong>Investment 2:</strong> 10% of Lukas Co acquired for speculative purposes. Neither gives significant influence. Directors wish to avoid taking fair value movements to profit or loss wherever possible.</p><p class='font-semibold text-slate-900'>How should the fair value movements in these investments be reported in Zine Co's financial statements for the year ended 31 March 20X9?</p>", "options": [{"key": "A", "text": "In profit or loss for both investments"}, {"key": "B", "text": "In other comprehensive income for both investments"}, {"key": "C", "text": "In profit or loss for investment 1 and in other comprehensive income for investment 2"}, {"key": "D", "text": "In other comprehensive income for investment 1 and in profit or loss for investment 2"}], "correct": "D", "explanation": "Under <strong>IFRS 9.5.7.5</strong>, long-term equity investments not held for trading (Inv 1) may irrevocably elect <strong>FVOCI</strong>. Speculative / held-for-trading equity investments (Inv 2) MUST be measured at <strong>FVTPL</strong> (corrected from source PDF green box)."}, {"num": 31, "section": "A", "type": "multi", "selectCount": 2, "topic": "Conceptual Framework (Comparability)", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which TWO of the following are required to meet the comparability characteristic of useful financial information?</p>", "options": [{"key": "A", "text": "Once an entity has selected an accounting policy, the policy must continue to be used each year"}, {"key": "B", "text": "All assets within a class should be depreciated at the same rate"}, {"key": "C", "text": "Entities are required to disclose their accounting policies"}, {"key": "D", "text": "Corresponding prior year information is required to be provided in financial statements"}], "correct": ["C", "D"], "explanation": "Disclosing accounting policies (<strong>C</strong>) and providing comparative prior-year figures (<strong>D</strong>) enable comparability. Policies CAN be changed under IAS 8 if more reliable/relevant (corrected from source PDF green box)."}, {"num": 32, "section": "A", "type": "multi", "selectCount": 2, "topic": "Historical Cost vs Current Value", "marks": 2, "stem": "<p class='mb-2'>Tristen Co operates in an emerging market with a fast-growing economy where prices increase frequently.</p><p class='font-semibold text-slate-900'>Which TWO of the following statements are true when using historical cost accounting compared to current value accounting?</p>", "options": [{"key": "A", "text": "Capital employed which is calculated using historical costs is understated compared to current value capital employed"}, {"key": "B", "text": "Historical cost profits are overstated in comparison to current value profits"}, {"key": "C", "text": "Capital employed which is calculated using historical costs is overstated compared to current value capital employed"}, {"key": "D", "text": "Historical cost profits are understated in comparison to current value profits"}], "correct": ["A", "B"], "explanation": "During inflation, historical cost assets/capital employed are <strong>understated (A)</strong> while historical cost profits are <strong>overstated (B)</strong> due to lower depreciation/COS charges (corrected from source PDF green box)."}, {"num": 33, "section": "A", "type": "mcq", "topic": "IFRS 10 Consolidated Equity", "marks": 2, "stem": "<p class='mb-2'>On 1 October 20X5, Anita Co purchased 75,000 of Benita Co's 100,000 equity shares when Benita Co's retained earnings were $90,000. At 30 September 20X7: Anita Co SC $125,000, RE $300,000; Benita Co SC $100,000, RE $150,000.</p><p class='font-semibold text-slate-900'>What is the total equity attributable to owners of the parent in Anita Co's consolidated SOFP at 30 September 20X7?</p>", "options": [{"key": "A", "text": "$125,000"}, {"key": "B", "text": "$470,000"}, {"key": "C", "text": "$345,000"}, {"key": "D", "text": "$537,500"}], "correct": "B", "explanation": "Parent share capital ($125,000) + Group RE [$300,000 + 75% × ($150,000 − $90,000) = $345,000] = <strong>$470,000</strong>."}, {"num": 34, "section": "A", "type": "number", "topic": "IFRS 10 NCI", "marks": 2, "stem": "<p class='mb-2'>Rooney Co acquired 70% of Marek Co on 1 January 20X6 (NCI FV $3m). At acquisition a building had a FV excess of $1.5m (remaining useful life 5 years). During 20X6, Marek Co sold goods to Rooney Co with unrealised profit in year-end inventory of $550,000. Marek Co's 20X6 profit was $3.2m.</p><p class='font-semibold text-slate-900'>What amount will be presented as the non-controlling interest in Rooney Co's consolidated SOFP as at 31 December 20X6?</p>", "prefix": "$", "suffix": "", "accepted": ["3705000"], "displayCorrect": "$3,705,000", "explanation": "Adjusted Marek profit = $3,200k − FV dep ($1,500k/5 = $300k) − PUP ($550k, upstream sale by Marek) = $2,350k. NCI = $3,000k + 30%($2,350k) = <strong>$3,705,000</strong>."}, {"num": 35, "section": "A", "type": "number", "topic": "IFRS 10 & IAS 28 Profit", "marks": 2, "stem": "<p class='mb-2'>Fantastic Co acquired 75% of Superb Co on 1 February 20X5 and 30% of Good Co several years prior. On 31 Dec 20X5 Fantastic Co sold goods to Superb Co at a profit of $10,000; half remained unsold at year-end. Profits for y/e 31 Jan 20X6: Fantastic $240,600; Superb $51,900; Good $230,000.</p><p class='font-semibold text-slate-900'>What is the profit attributable to owners of the parent for the year ended 31 January 20X6?</p>", "prefix": "$", "suffix": "", "accepted": ["343525"], "displayCorrect": "$343,525", "explanation": "Fantastic ($240,600) − PUP (50% × $10,000 = $5,000, downstream) + 75% Superb ($38,925) + 30% Good ($69,000) = <strong>$343,525</strong>."}, {"num": 36, "section": "A", "type": "mcq", "topic": "Conceptual Framework (Measurement)", "marks": 2, "stem": "<p class='mb-2'>Buster Co acquired an asset on 1 Jan 20X0 for $50,000 (5-year life, historical cost). At 31 Dec 20X3, a new replacement asset would cost $40,000. The asset generates net cash inflows of $5,800 for the next 2 years (2-yr cumulative PV factor @ 5% = 1.859).</p><p class='font-semibold text-slate-900'>What is the asset's carrying amount, current cost, and value in use at 31 December 20X3?</p>", "options": [{"key": "A", "text": "CA $50,000 | Current Cost $40,000 | VIU $3,120"}, {"key": "B", "text": "CA $10,000 | Current Cost $8,000 | VIU $21,564"}, {"key": "C", "text": "CA $10,000 | Current Cost $8,000 | VIU $10,782"}, {"key": "D", "text": "CA $10,000 | Current Cost $40,000 | VIU $10,782"}], "correct": "C", "explanation": "After 4 of 5 years: CA = $50k × 1/5 = <strong>$10,000</strong>; Current cost of an equivalent 4-yr-old asset = $40k × 1/5 = <strong>$8,000</strong>; VIU = $5,800 × 1.859 = <strong>$10,782</strong> (Option C; corrected from source PDF green box)."}, {"num": 37, "section": "A", "type": "multi", "selectCount": 2, "topic": "IAS 20 Grants", "marks": 2, "stem": "<p class='mb-2'>On 1 May 20X8, Potter Co was awarded a government grant of $60,000 to help fund the purchase of a new item of machinery. The machine was purchased on 1 June 20X8 for $300,000 and put into immediate use (useful life 5 years, proportionate depreciation).</p><p class='font-semibold text-slate-900'>Which TWO of the following correctly reflect the amounts that could be reported in Potter Co's financial statements for the year ended 31 March 20X9?</p>", "options": [{"key": "A", "text": "PPE $250,000; Profit or loss charge $40,000; Deferred income $50,000"}, {"key": "B", "text": "PPE $196,000; Profit or loss charge $44,000"}, {"key": "C", "text": "PPE $250,000; Profit or loss charge $39,000; Deferred income $49,000"}, {"key": "D", "text": "PPE $200,000; Profit or loss charge $40,000"}], "correct": ["A", "D"], "explanation": "10 months (Jun–Mar): Deferred income method → PPE $300k − $50k = $250k, Deferred income $60k − $10k = $50k, Net P&amp;L $40k (<strong>A</strong>). Netted method → Net cost $240k − $40k dep = PPE $200k, P&amp;L $40k (<strong>D</strong>)."}, {"num": 38, "section": "A", "type": "dropdown_table", "topic": "Ratio Analysis", "marks": 2, "stem": "<p class='mb-2'>Nadir Co figures ($'000): Revenue 10,000; Profit from operations 2,000; Equity 40,000; Non-current liabilities (bank loan) 8,000.</p><p class='font-semibold text-slate-900'>Calculate Nadir Co's Return on Capital Employed (ROCE) and Net Asset Turnover.</p>", "headers": ["Ratio", "Value"], "rows": [{"id": "roce", "label": "Return on Capital Employed (ROCE)", "options": ["5%", "4.17%"], "correct": "4.17%"}, {"id": "nat", "label": "Net Asset Turnover", "options": ["4.8 times", "0.21 times"], "correct": "0.21 times"}], "explanation": "Capital employed = $40m + $8m = $48m. ROCE = $2m / $48m = <strong>4.17%</strong>. Net Asset Turnover = Revenue / Capital Employed = $10m / $48m = <strong>0.21 times</strong> (corrected from inverted '4.8 times' in source PDF)."}, {"num": 39, "section": "A", "type": "number", "topic": "IFRS 16 Leases", "marks": 2, "stem": "<p class='mb-2'>On 1 July 20X1, Rep Co entered into a five-year lease ($1m/yr on 30 June, implicit rate 9%, PV $3.89m).</p><p class='font-semibold text-slate-900'>What is the TOTAL expense to be recorded in profit or loss for the year ended 31 December 20X1?</p>", "prefix": "$", "suffix": "", "accepted": ["564050"], "displayCorrect": "$564,050", "explanation": "6 months: Dep ($3.89m/5 × 6/12 = $389,000) + Interest ($3.89m × 9% × 6/12 = $175,050) = <strong>$564,050</strong>."}, {"num": 40, "section": "A", "type": "multi", "selectCount": 2, "topic": "IFRS 15 Input Methods", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which TWO of the following can be used to measure an entity's progress towards completion of a performance obligation when using INPUT methods?</p>", "options": [{"key": "A", "text": "Labour hours expended to date"}, {"key": "B", "text": "Surveys of performance completed to date"}, {"key": "C", "text": "Costs incurred to date"}, {"key": "D", "text": "Goods transferred to the customer to date"}], "correct": ["A", "C"], "explanation": "Labour hours expended (<strong>A</strong>) and costs incurred (<strong>C</strong>) are input methods; surveys (B) and goods transferred (D) are output methods."}, {"num": 41, "section": "A", "type": "mcq", "topic": "IFRS 5 Held for Sale", "marks": 2, "stem": "<p class='mb-2'>At 1 April 20X4, Sand Co owned plant with a carrying amount of $40m. No depreciation has been charged for y/e 31 March 20X5 (20% reducing balance). On 31 March 20X5, Sand Co classified it as held for sale and sold it on 10 April 20X5 for net proceeds (equal to FVLCD) of $45m.</p><p class='font-semibold text-slate-900'>What is the total adjustment required to retained earnings in respect of the plant for the year ended 31 March 20X5?</p>", "options": [{"key": "A", "text": "$5m debit"}, {"key": "B", "text": "$8m debit"}, {"key": "C", "text": "$8m credit"}, {"key": "D", "text": "$5m credit"}], "correct": "B", "explanation": "Charge 20X5 depreciation up to 31 Mar 20X5: $40m × 20% = <strong>$8m debit</strong> (CA becomes $32m). Held for sale is measured at lower of CA ($32m) and FVLCD ($45m) → NO gain is recognised until disposal in April 20X5 (corrected from source PDF green box)."}, {"num": 42, "section": "A", "type": "tf_matrix", "topic": "IFRS 10 Control", "marks": 2, "cols": ["Subsidiary", "Associate"], "stem": "<p class='font-semibold text-slate-900'>Indicate whether Jarl Co would be considered a subsidiary or an associate of Hero Co for consolidated financial statements.</p>", "rows": [{"id": "r1", "text": "Hero Co owns 45% of Jarl Co and has an agreement with other shareholders to govern the financial and operating policies of Jarl Co", "correct": "Subsidiary"}, {"id": "r2", "text": "Hero Co owns 45% of Jarl Co and no other shareholders own more than 1% each", "correct": "Subsidiary"}, {"id": "r3", "text": "Hero Co owns 55% of the ordinary share capital of Jarl Co", "correct": "Subsidiary"}, {"id": "r4", "text": "Hero Co owns 45% of the ordinary share capital of Jarl Co", "correct": "Associate"}], "explanation": "Shareholder agreement (r1), de facto control over dispersed 1% holders (r2), and &gt;50% ownership (r3) give control (Subsidiary). Plain 45% without control indicators (r4) gives significant influence (Associate)."}, {"num": 43, "section": "A", "type": "mcq", "topic": "IAS 2 Inventories", "marks": 2, "stem": "<p class='mb-2'>At 31 December 20X2, Exacta Co had a machine in inventory costing $220,000. Agreed selling price was $250,000, but regulations require a $50,000 modification before sale; the customer agreed to bear half of the modification cost as an increase in selling price.</p><p class='font-semibold text-slate-900'>In accordance with IAS 2 <em>Inventories</em>, what is the inventory value of the machine as at 31 December 20X2?</p>", "options": [{"key": "A", "text": "$270,000"}, {"key": "B", "text": "$220,000"}, {"key": "C", "text": "$245,000"}, {"key": "D", "text": "$225,000"}], "correct": "B", "explanation": "Revised SP = $250,000 + $25,000 = $275,000. Less cost to complete ($50,000) → NRV = $225,000. Lower of cost ($220,000) and NRV ($225,000) = <strong>$220,000</strong> (corrected from source PDF green box)."}, {"num": 44, "section": "A", "type": "dropdown_table", "topic": "IAS 28 Impairment", "marks": 2, "stem": "<p class='mb-2'>On 1 January 20X7, Plot Co acquired 25% of Area Co when Area Co's retained earnings were $736,000. At 30 September 20X7, Area Co's retained earnings were $1.6m, and Plot Group must recognise an impairment loss of $300,000 on the associate.</p><p class='font-semibold text-slate-900'>Identify the net adjustment to Plot Group's Investment in Area Co at 30 September 20X7.</p>", "headers": ["Requirement", "Selection"], "rows": [{"id": "amt", "label": "Net adjustment amount", "options": ["$216,000", "$84,000"], "correct": "$84,000"}, {"id": "dir", "label": "Direction", "options": ["Increase the carrying amount of the investment", "Decrease the carrying amount of the investment"], "correct": "Decrease the carrying amount of the investment"}], "explanation": "Share of post-acq profit = 25% × ($1,600k − $736k) = +$216,000. Less impairment ($300,000) = net <strong>decrease of $84,000</strong>."}, {"num": 45, "section": "A", "type": "number", "topic": "IFRS 9 Amortised Cost", "marks": 2, "stem": "<p class='mb-2'>On 1 April 20X7, a company invested in a five-year $7m par loan note purchased at a 12% discount (coupon 5%, EIR 7%, interest annually in arrears, measured at amortised cost).</p><p class='font-semibold text-slate-900'>What is the carrying amount of the financial asset at 31 March 20X9 (to the nearest $'000)?</p>", "prefix": "$", "suffix": ",000", "accepted": ["6328"], "displayCorrect": "$6,328,000 (enter 6328)", "explanation": "Initial cost = $7,000k × 88% = $6,160k. Annual coupon = $350k. Y1 (20X8): $6,160k + 7% ($431.2k) − $350k = $6,241.2k. Y2 (20X9): $6,241.2k + 7% ($436.9k) − $350k = <strong>$6,328k</strong>."}, {"num": 46, "section": "A", "type": "mcq", "topic": "IFRS 16 ROU Asset", "marks": 2, "stem": "<p class='mb-2'>Shaba Co entered a 4-year lease (useful life 8 years) on 1 January 20X7: Initial lease liability $48,000; Deposit paid $2,000; Direct costs $5,000; Maintenance costs $8,000 ($2,000/yr).</p><p class='font-semibold text-slate-900'>What will be the carrying amount of the right-of-use asset at 31 December 20X8?</p>", "options": [{"key": "A", "text": "$41,250"}, {"key": "B", "text": "$31,500"}, {"key": "C", "text": "$27,500"}, {"key": "D", "text": "$36,667"}], "correct": "C", "explanation": "ROU = $48k + $2k + $5k = $55,000 (maintenance is excluded). Depreciated over 4-yr lease term → after 2 years = $55,000 × 2/4 = <strong>$27,500</strong> (corrected from source PDF green box)."}, {"num": 47, "section": "A", "type": "dropdown_table", "topic": "IFRS 3 Bargain Purchase", "marks": 2, "stem": "<p class='mb-2'>When a gain on a bargain purchase (negative goodwill) arises, IFRS 3 requires an entity to first review the measurement of identifiable net assets and consideration.</p><p class='font-semibold text-slate-900'>When confirmed, complete the required accounting treatment.</p>", "headers": ["Blank", "Token"], "rows": [{"id": "e1", "label": "It should be...", "options": ["Debited", "Credited"], "correct": "Credited"}, {"id": "e2", "label": "To...", "options": ["Retained earnings", "Statement of profit or loss"], "correct": "Statement of profit or loss"}], "explanation": "Under IFRS 3.34, confirmed negative goodwill (gain on bargain purchase) is <strong>Credited</strong> immediately to the <strong>Statement of profit or loss</strong>."}, {"num": 48, "section": "A", "type": "mcq", "topic": "IAS 7 Cash Flow Interpretation", "marks": 2, "stem": "<p class='mb-2'>Extract from Top Trades Co's statement of cash flows ($'000): Net cash from operating activities +995; Investing activities (540); Financing activities (200); Net increase +255.</p><p class='font-semibold text-slate-900'>Which of the following statements is correct according to the extract?</p>", "options": [{"key": "A", "text": "The company has good working capital management"}, {"key": "B", "text": "Net cash generated from financing activities has been used to fund the additions to non-current assets."}, {"key": "C", "text": "Net cash generated from operating activities has been used to fund the additions to non-current assets"}, {"key": "D", "text": "Existing non-current assets have been sold to cover the cost of the additions to non-current assets"}], "correct": "C", "explanation": "Operating cash inflows (+$995k) comfortably funded investing outflows (-$540k) and financing outflows (-$200k) (<strong>C</strong>; corrected from source PDF green box)."}, {"num": 49, "section": "A", "type": "mcq", "topic": "IASB Due Process", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>After the International Accounting Standards Board has reviewed the comments received on an Exposure Draft, what will be the next step?</p>", "options": [{"key": "A", "text": "Conduct research to decide whether standard-setting is required"}, {"key": "B", "text": "Develop and publish a discussion paper"}, {"key": "C", "text": "Refer comments to the IFRS Interpretations Committee for a post-implementation review"}, {"key": "D", "text": "Analyze feedback, refine proposals and issue the new IFRS standard"}], "correct": "D", "explanation": "After reviewing Exposure Draft comments, the IASB analyses feedback, refines proposals, and issues the final IFRS Standard (<strong>D</strong>)."}, {"num": 50, "section": "A", "type": "mcq", "topic": "IFRS 10 Consolidation Exemptions", "marks": 2, "stem": "<p class='font-semibold text-slate-900 mb-2'>In accordance with IFRS 10, which of the following statements is true regarding the circumstances under which an entity is NOT required to prepare consolidated financial statements?</p><ol class='list-decimal pl-5 space-y-1 mb-2'><li>Its subsidiaries make intragroup sales or purchases</li><li>Its subsidiaries are loss making</li></ol>", "options": [{"key": "A", "text": "1 only"}, {"key": "B", "text": "Both 1 and 2"}, {"key": "C", "text": "2 only"}, {"key": "D", "text": "Neither 1 nor 2"}], "correct": "D", "explanation": "Neither intragroup trading nor loss-making subsidiaries exempt a parent from preparing consolidated financial statements (<strong>Neither 1 nor 2</strong>)."}, {"num": 51, "section": "A", "type": "number", "topic": "IFRS 10 Consolidated PPE", "marks": 2, "stem": "<p class='mb-2'>Parry Co acquired 60% of Somes Co on 31 December 20X2. At acquisition, Somes Co's plant had a fair value $2m in excess of carrying amount (remaining life 10 years). Individual PPE at 31 December 20X5: Parry Co $20,000k; Somes Co $12,000k.</p><p class='font-semibold text-slate-900'>Calculate total PPE in the consolidated SOFP as at 31 December 20X5 (to the nearest $'000).</p>", "prefix": "$", "suffix": ",000", "accepted": ["33400"], "displayCorrect": "$33,400,000 (enter 33400)", "explanation": "3 years elapsed (20X3–20X5): Remaining FV uplift = $2,000k − (3 × $200k) = $1,400k. Consolidated PPE = $20,000k + $12,000k + $1,400k = <strong>$33,400k</strong>."}, {"num": 52, "section": "A", "type": "mcq", "topic": "IAS 36 Impairment", "marks": 2, "stem": "<p class='mb-2'>At 30 September 20X5 Arnold Co owned a brand (carrying amount $40m, VIU $35.2m, FV $38m, selling costs $0.2m).</p><p class='font-semibold text-slate-900'>Following the recognition of the impairment loss, what is the carrying amount of the brand at 30 September 20X5?</p>", "options": [{"key": "A", "text": "$40.0m"}, {"key": "B", "text": "$35.2m"}, {"key": "C", "text": "$37.8m"}, {"key": "D", "text": "$38.0m"}], "correct": "C", "explanation": "Recoverable amount = higher of VIU ($35.2m) and FVLCD ($38m − $0.2m = $37.8m) = <strong>$37.8m</strong>."}, {"num": 53, "section": "A", "type": "mcq", "topic": "Conceptual Framework", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>According to the Conceptual Framework for Financial Reporting, what are the enhancing qualitative characteristics of financial reporting?</p>", "options": [{"key": "A", "text": "Verifiability, comparability, prudence and neutrality."}, {"key": "B", "text": "Timeliness, consistency, reliability and substance over form."}, {"key": "C", "text": "Comparability, verifiability, timeliness and understandability."}, {"key": "D", "text": "Materiality, understandability, measurability and reliability."}], "correct": "C", "explanation": "The four enhancing qualitative characteristics are <strong>Comparability, verifiability, timeliness, and understandability</strong>."}, {"num": 54, "section": "A", "type": "mcq", "topic": "IFRS 9 FVOCI Shares", "marks": 2, "stem": "<p class='mb-2'>Kamran Co acquired 9,000 shares in Barr Co on 1 August 20X3 at $6.40/share (transaction costs $9,000), elected at FVOCI. At 31 December 20X3, fair value was $7.25/share and selling costs were expected to be 4%.</p><p class='font-semibold text-slate-900'>What is the value of the Barr Co shares in Kamran Co's financial statements as at 31 December 20X3?</p>", "options": [{"key": "A", "text": "$66,600"}, {"key": "B", "text": "$62,640"}, {"key": "C", "text": "$65,250"}, {"key": "D", "text": "$74,250"}], "correct": "C", "explanation": "At year-end, FVOCI financial assets are remeasured to pure fair value (selling costs are NOT deducted): 9,000 × $7.25 = <strong>$65,250</strong>."}, {"num": 55, "section": "A", "type": "tf_matrix", "topic": "IASB Due Process", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Identify whether the following statements are true or false in relation to the IASB's process for issuing new IFRS standards.</p>", "rows": [{"id": "r1", "text": "No changes are made to the wording of an IFRS standard after the Exposure Draft has been produced.", "correct": "False"}, {"id": "r2", "text": "An Exposure Draft is usually formed after taking into account comments made from an earlier discussion paper.", "correct": "True"}], "explanation": "Wording is refined after Exposure Draft feedback (False); Exposure Drafts incorporate comments from prior Discussion Papers (True)."}, {"num": 56, "section": "A", "type": "multi", "selectCount": 2, "topic": "Conceptual Framework (Understandability)", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>According to the Conceptual Framework, which TWO of the following should be considered when trying to make financial information as understandable as possible?</p>", "options": [{"key": "A", "text": "Classifying, characterising and presenting information clearly and concisely"}, {"key": "B", "text": "Excluding from financial reports all transactions that are complex and difficult to understand"}, {"key": "C", "text": "Preparing financial information under the assumption that users have a reasonable knowledge of business and economic activities"}, {"key": "D", "text": "Delivering information to users in time to be capable of influencing their decisions"}], "correct": ["A", "C"], "explanation": "Understandability requires clear/concise presentation (<strong>A</strong>) assuming users have reasonable business/economic knowledge (<strong>C</strong>). Complex transactions must NOT be excluded."}, {"num": 57, "section": "A", "type": "mcq", "topic": "IAS 12 Tax Charge", "marks": 2, "stem": "<p class='mb-2'>Trial balance of Kane Co at 31 Dec 20X5: DTL (31 Dec 20X4) $2,000 Cr; Current tax payable (prior year under/over provision) $10,000 Dr. Current year tax estimate is $20,000. Taxable temporary differences at 31 Dec 20X5 are $30,000 (tax rate 20%).</p><p class='font-semibold text-slate-900'>What amount should be shown as the tax charge in the statement of profit or loss?</p>", "options": [{"key": "A", "text": "$30,000"}, {"key": "B", "text": "$36,000"}, {"key": "C", "text": "$34,000"}, {"key": "D", "text": "$60,000"}], "correct": "C", "explanation": "Current year estimate ($20,000) + Prior year under-provision ($10,000 Dr) + DTL increase ($30k × 20% = $6,000 − $2,000 = $4,000) = <strong>$34,000</strong>."}, {"num": 58, "section": "A", "type": "mcq", "topic": "IFRS 10 Subsidiaries", "marks": 2, "stem": "<p class='font-semibold text-slate-900 mb-2'>Which of the following should be accounted for as subsidiaries in the consolidated financial statements of Preece Co?</p><ol class='list-none pl-2 space-y-1.5 mb-2'><li>i) Gilber Co: Preece owns 40% and holds options to purchase another 20% exercisable immediately.</li><li>ii) Grovez Co: Preece owns 60% and has appointed the majority of the board.</li><li>iii) Roge Co: Preece owns 80%; Roge Co is loss-making and Preece is considering selling it in the near future.</li></ol>", "options": [{"key": "A", "text": "1 and 3 only"}, {"key": "B", "text": "1, 2 and 3"}, {"key": "C", "text": "2 and 3 only"}, {"key": "D", "text": "1 and 2 only"}], "correct": "B", "explanation": "All three are subsidiaries: substantive exercisable options give 60% potential voting rights (i); 60% + board control (ii); 80% loss-making subsidiary is still consolidated (iii)."}, {"num": 59, "section": "A", "type": "mcq", "topic": "IAS 21 Presentation Currency", "marks": 2, "stem": "<p class='font-semibold text-slate-900 mb-2'>Which of the following statements regarding presentation currency is/are correct in accordance with IAS 21?</p><ol class='list-none pl-2 space-y-1.5 mb-2'><li>(1) An entity may choose to present its financial statements in a currency other than its functional currency</li><li>(2) The presentation currency is the currency of the primary economic environment in which the entity operates</li><li>(3) Where foreign currency exchange rates fluctuate significantly, an entity should translate a foreign currency transaction using the exchange rate on the date of the transaction</li></ol>", "options": [{"key": "A", "text": "1 only"}, {"key": "B", "text": "2 and 3"}, {"key": "C", "text": "1 and 3"}, {"key": "D", "text": "2 only"}], "correct": "C", "explanation": "(1) and (3) are correct under IAS 21; (2) describes functional currency."}, {"num": 60, "section": "A", "type": "mcq", "topic": "Not-for-Profit Entities", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>Which of the following best describes the extent to which IFRS Standards are relevant to not-for-profit entities?</p>", "options": [{"key": "A", "text": "IFRS Standards may be appropriate for use by some not-for-profit entities if they are engaged in commercial activities"}, {"key": "B", "text": "All IFRS Standards can be applied to all entities irrespective of whether or not they are profit oriented"}, {"key": "C", "text": "All not-for-profit entities must apply IFRS Standards"}, {"key": "D", "text": "IFRS Standards are not relevant to not-for-profit entities"}], "correct": "A", "explanation": "IFRS Standards are designed for profit-oriented entities, though they may be appropriate for some NFP entities engaged in commercial activities (<strong>A</strong>)."}, {"num": 61, "section": "A", "type": "dropdown_table", "topic": "IAS 23 & IAS 16", "marks": 2, "stem": "<p class='mb-2'>Roti Co obtained a $3m 6% loan on 1 Jan 20X1 to construct retail premises. Construction began 1 April 20X1 ($5m total cost), ready for use 1 January 20X2, officially launched 1 March 20X2.</p><p class='font-semibold text-slate-900'>Select the borrowing costs to be capitalised for 20X1 and the date depreciation will begin.</p>", "headers": ["Requirement", "Answer"], "rows": [{"id": "bc", "label": "Borrowing costs to be capitalised", "options": ["$135,000", "$180,000", "$225,000", "$300,000"], "correct": "$135,000"}, {"id": "dt", "label": "Date that depreciation will begin", "options": ["1 January 20X2", "1 March 20X2"], "correct": "1 January 20X2"}], "explanation": "9 months capitalisation (Apr–Dec): $3m × 6% × 9/12 = <strong>$135,000</strong>. Depreciation starts when ready for use: <strong>1 January 20X2</strong>."}, {"num": 62, "section": "A", "type": "multi", "selectCount": 2, "topic": "IAS 16 Revaluation", "marks": 2, "stem": "<p class='font-semibold text-slate-900'>In relation to the revaluation of non-current assets, which TWO of the following are correct in accordance with IAS 16 <em>Property, Plant and Equipment</em>?</p>", "options": [{"key": "A", "text": "Transfers from revaluation surplus to retained earnings are made through profit or loss"}, {"key": "B", "text": "A revaluation surplus arises when a non-current asset is sold at a profit"}, {"key": "C", "text": "The revaluation surplus is part of equity in the statement of financial position"}, {"key": "D", "text": "The frequency of revaluation depends on any volatility in the fair value of the asset"}], "correct": ["C", "D"], "explanation": "Revaluation surplus is part of equity (<strong>C</strong>) and revaluation frequency depends on fair value volatility (<strong>D</strong>). Reserve transfers never go through P&amp;L (corrected from source PDF green box)."}, {"num": 63, "section": "A", "type": "mcq", "topic": "IFRS 9 Fair Value const STORAGE_KEY = 'acca_fr_cbe_state_v1';

let state = {
  view: 'home', // 'home' | 'instructions' | 'exam' | 'review_screen' | 'results'
  activeExamId: null,
  timerMode: { exam1: 'acca', exam2: 'acca', exam3: 'acca', exam4: 'acca', exam5: 'acca', exam6: 'acca' }, // 'acca' | 'paper' | 'untimed'
  currentQIndex: 0,
  answers: {},      // { [examId]: { [qNum]: value } }
  flags: {},        // { [examId]: { [qNum]: true } }
  visited: {},      // { [examId]: { [qNum]: true } }
  struck: {},       // { [examId]: { [`${qNum}_${key}`]: true } }
  scratchpad: { exam1: '', exam2: '', exam3: '', exam4: '', exam5: '', exam6: '' },
  highlights: {},   // { [examId]: { [key]: html } }
  savedTimers: {},  // { [examId]: { timeRemainingSec, elapsedSec, mode } }
  timeRemainingSec: 0,
  elapsedSec: 0,
  timerHidden: false,
  timerPaused: false,
  highlightMode: false,
  strikeMode: false,
  showCalc: false,
  showScratch: false,
  calcPos: { left: null, top: 112 },
  scratchPos: { left: 16, top: 112 },
  showNavigator: false,
  navFilter: 'all', // 'all' | 'incomplete' | 'flagged'
  showHelpModal: false,
  showSubmitModal: false,
  resultsFilter: 'all', // 'all' | 'incorrect' | 'correct' | 'flagged'
  multiNotice: '',
  toastMsg: '',
  history: {}, // { [examId]: { score, total, pct, date, timeTakenSec, mode } }
  calcDisplay: '0',
  calcExpr: '',
  calcResetNext: false
};

let timerInterval = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.history) state.history = parsed.history;
      if (parsed.scratchpad) state.scratchpad = Object.assign(state.scratchpad, parsed.scratchpad);
      if (parsed.answers) state.answers = parsed.answers;
      if (parsed.flags) state.flags = parsed.flags;
      if (parsed.visited) state.visited = parsed.visited;
      if (parsed.struck) state.struck = parsed.struck;
      if (parsed.timerMode) state.timerMode = Object.assign(state.timerMode, parsed.timerMode);
      if (parsed.savedTimers) state.savedTimers = parsed.savedTimers;
    }
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      history: state.history,
      scratchpad: state.scratchpad,
      answers: state.answers,
      flags: state.flags,
      visited: state.visited,
      struck: state.struck,
      timerMode: state.timerMode,
      savedTimers: state.savedTimers
    }));
  } catch (e) {}
}

function getExam(id = state.activeExamId) {
  return EXAMS.find(e => e.id === id);
}

function getExamAnswers(examId = state.activeExamId) {
  if (!state.answers[examId]) state.answers[examId] = {};
  return state.answers[examId];
}

function getExamFlags(examId = state.activeExamId) {
  if (!state.flags[examId]) state.flags[examId] = {};
  return state.flags[examId];
}

function getExamVisited(examId = state.activeExamId) {
  if (!state.visited[examId]) state.visited[examId] = {};
  return state.visited[examId];
}

function getExamStruck(examId = state.activeExamId) {
  if (!state.struck[examId]) state.struck[examId] = {};
  return state.struck[examId];
}

function isQuestionAnswered(q, ans) {
  if (ans === undefined || ans === null) return false;
  if (q.type === 'mcq') return typeof ans === 'string' && ans.length > 0;
  if (q.type === 'multi') return Array.isArray(ans) && ans.length === q.selectCount;
  if (q.type === 'number') return typeof ans === 'string' && ans.trim().length > 0;
  if (q.type === 'tf_matrix') { const cols = q.cols || ['True', 'False']; return typeof ans === 'object' && q.rows.every(r => cols.includes(ans[r.id])); }
  if (q.type === 'dropdown_table') return typeof ans === 'object' && q.rows.every(r => ans[r.id] && ans[r.id].length > 0);
  return false;
}

function isQuestionPartial(q, ans) {
  if (!ans) return false;
  if (isQuestionAnswered(q, ans)) return false;
  if (q.type === 'multi') return Array.isArray(ans) && ans.length > 0;
  if (q.type === 'tf_matrix' || q.type === 'dropdown_table') return typeof ans === 'object' && Object.values(ans).some(v => v && v.length > 0);
  return false;
}

function normalizeNum(str) {
  return String(str || '').toLowerCase().replace(/[\$,\s]/g, '').replace(/million/g, 'million');
}

function isAnswerCorrect(q, ans) {
  if (!isQuestionAnswered(q, ans)) return false;
  if (q.type === 'mcq') return ans === q.correct;
  if (q.type === 'multi') {
    const a = [...ans].sort().join(',');
    const c = [...q.correct].sort().join(',');
    return a === c;
  }
  if (q.type === 'number') {
    const norm = normalizeNum(ans);
    return q.accepted.some(acc => {
      const aNorm = normalizeNum(acc);
      if (norm === aNorm) return true;
      const n1 = parseFloat(norm);
      const n2 = parseFloat(aNorm);
      return !isNaN(n1) && !isNaN(n2) && norm.replace(/[^\d.-]/g,'') === norm && Math.abs(n1 - n2) < 0.001;
    });
  }
  if (q.type === 'tf_matrix' || q.type === 'dropdown_table') {
    return q.rows.every(r => ans[r.id] === r.correct);
  }
  return false;
}

function formatTime(totalSec) {
  const s = Math.max(0, Math.floor(totalSec));
  const hrs = Math.floor(s / 3600);
  const mins = Math.floor((s % 3600) / 60);
  const secs = s % 60;
  const pad = n => String(n).padStart(2, '0');
  return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
}

function startTimer() {
  stopTimer();
  const exam = getExam();
  const mode = state.timerMode[exam.id] || 'acca';
  timerInterval = setInterval(() => {
    if (state.view !== 'exam' && state.view !== 'review_screen') return;
    if (state.timerPaused) return;
    state.elapsedSec += 1;
    if (mode !== 'untimed') {
      state.timeRemainingSec -= 1;
      if (state.timeRemainingSec <= 0) {
        state.timeRemainingSec = 0;
        stopTimer();
        submitExam(true);
        return;
      }
    }
    state.savedTimers[exam.id] = { timeRemainingSec: state.timeRemainingSec, elapsedSec: state.elapsedSec, mode };
    if (state.elapsedSec % 5 === 0) saveState();
    updateTimerDOM();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function updateTimerDOM() {
  const el = document.getElementById('cbe-timer-val');
  const pill = document.getElementById('cbe-timer-pill');
  if (!el || !pill) return;
  const exam = getExam();
  const mode = state.timerMode[exam.id] || 'acca';
  if (state.timerHidden) {
    el.textContent = 'Hidden';
    pill.className = 'flex items-center gap-2 px-3 py-1 rounded text-xs sm:text-sm font-mono-num bg-slate-700/70 text-slate-200 cursor-pointer border border-slate-500/50';
    return;
  }
  if (mode === 'untimed') {
    el.textContent = formatTime(state.elapsedSec);
    pill.className = 'flex items-center gap-2 px-3 py-1 rounded text-xs sm:text-sm font-mono-num bg-slate-800/70 text-white cursor-pointer border border-slate-500/50';
  } else {
    el.textContent = formatTime(state.timeRemainingSec);
    let cls = 'flex items-center gap-2 px-3 py-1 rounded text-xs sm:text-sm font-mono-num cursor-pointer border ';
    if (state.timeRemainingSec <= 300) {
      cls += 'timer-critical text-white border-red-400 font-bold';
    } else if (state.timeRemainingSec <= 900) {
      cls += 'bg-amber-600 text-white border-amber-400 font-semibold';
    } else {
      cls += 'bg-slate-900/50 text-white border-slate-500/50';
    }
    pill.className = cls;
  }
}

function openInstructions(examId) {
  state.activeExamId = examId;
  state.view = 'instructions';
  render();
}

function launchExam(examId, resetAnswers = false) {
  state.activeExamId = examId;
  const exam = getExam(examId);
  const mode = state.timerMode[examId] || 'acca';
  const mins = mode === 'acca' ? exam.accaMinutes : (mode === 'paper' ? exam.paperMinutes : 0);
  if (resetAnswers) {
    state.answers[examId] = {};
    state.flags[examId] = {};
    state.visited[examId] = {};
    state.struck[examId] = {};
    state.highlights[examId] = {};
    delete state.savedTimers[examId];
    state.timeRemainingSec = mins * 60;
    state.elapsedSec = 0;
    saveState();
  } else {
    const saved = state.savedTimers[examId];
    if (saved && saved.mode === mode && saved.elapsedSec > 0) {
      state.timeRemainingSec = saved.timeRemainingSec;
      state.elapsedSec = saved.elapsedSec;
    } else {
      state.timeRemainingSec = mins * 60;
      state.elapsedSec = 0;
    }
  }
  state.multiNotice = '';
  state.currentQIndex = 0;
  state.timerPaused = false;
  state.timerHidden = false;
  state.highlightMode = false;
  state.strikeMode = false;
  state.showNavigator = false;
  state.showSubmitModal = false;
  state.showHelpModal = false;
  getExamVisited(examId)[1] = true;
  state.view = 'exam';
  startTimer();
  render();
}

function goToQuestion(index) {
  const exam = getExam();
  if (index < 0 || index >= exam.questions.length) return;
  state.currentQIndex = index;
  state.multiNotice = '';
  const q = exam.questions[index];
  getExamVisited(exam.id)[q.num] = true;
  state.view = 'exam';
  state.showNavigator = false;
  saveState();
  render();
  const mainPane = document.getElementById('question-pane');
  if (mainPane) mainPane.scrollTop = 0;
}

function submitExam(autoTimeout = false) {
  stopTimer();
  const exam = getExam();
  const ansMap = getExamAnswers(exam.id);
  let correctCount = 0;
  exam.questions.forEach(q => {
    if (isAnswerCorrect(q, ansMap[q.num])) correctCount += 1;
  });
  const score = correctCount * exam.marksPerQuestion;
  const pct = Math.round((score / exam.totalMarks) * 100);
  state.history[exam.id] = {
    score,
    total: exam.totalMarks,
    correctCount,
    pct,
    date: new Date().toLocaleString(),
    timeTakenSec: state.elapsedSec,
    mode: state.timerMode[exam.id] || 'acca',
    autoTimeout
  };
  state.showSubmitModal = false;
  state.showNavigator = false;
  state.showCalc = false;
  state.showScratch = false;
  state.resultsFilter = 'all';
  delete state.savedTimers[exam.id];
  state.view = 'results';
  saveState();
  render();
}

// ============================================================================
// HIGHLIGHTER TOOL (Authentic ACCA CBE yellow highlight)
// ============================================================================
function applyHighlightSelection() {
  if (!state.highlightMode) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const container = range.commonAncestorContainer;
  const host = (container.nodeType === 1 ? container : container.parentElement).closest('[data-highlightable="true"]');
  if (!host) return;
  try {
    const span = document.createElement('span');
    span.className = 'cbe-highlight';
    range.surroundContents(span);
    sel.removeAllRanges();
    const key = host.getAttribute('data-hl-key');
    if (!state.highlights[state.activeExamId]) state.highlights[state.activeExamId] = {};
    state.highlights[state.activeExamId][key] = host.innerHTML;
  } catch (e) {
    // Selection spans across multiple block nodes
    sel.removeAllRanges();
  }
}

function clearCurrentHighlights() {
  if (state.highlights[state.activeExamId]) {
    const exam = getExam();
    const q = exam.questions[state.currentQIndex];
    delete state.highlights[state.activeExamId][`q_${q.num}`];
    if (q.scenarioId) delete state.highlights[state.activeExamId][`sc_${q.scenarioId}`];
  }
  render();
}

// ============================================================================
// CALCULATOR LOGIC
// ============================================================================
function calcPress(val) {
  if (val === 'C') {
    state.calcDisplay = '0';
    state.calcExpr = '';
    state.calcResetNext = false;
  } else if (val === 'CE') {
    state.calcDisplay = '0';
  } else if (val === 'BACK') {
    state.calcDisplay = state.calcDisplay.length > 1 ? state.calcDisplay.slice(0, -1) : '0';
  } else if (val === 'SQRT') {
    const n = parseFloat(state.calcDisplay);
    state.calcDisplay = (!isNaN(n) && n >= 0) ? String(Number(Math.sqrt(n).toFixed(8))) : 'Error';
    state.calcResetNext = true;
  } else if (val === 'SIGN') {
    if (state.calcDisplay !== '0' && state.calcDisplay !== 'Error') {
      state.calcDisplay = state.calcDisplay.startsWith('-') ? state.calcDisplay.slice(1) : '-' + state.calcDisplay;
    }
  } else if (val === '%') {
    const n = parseFloat(state.calcDisplay);
    if (!isNaN(n)) state.calcDisplay = String(Number((n / 100).toFixed(8)));
  } else if (['+', '-', '*', '/'].includes(val)) {
    state.calcExpr = state.calcDisplay + ' ' + val + ' ';
    state.calcResetNext = true;
  } else if (val === '=') {
    try {
      const expr = (state.calcExpr + state.calcDisplay).replace(/[^0-9+\-*/.() ]/g, '');
      const result = Function('"use strict"; return (' + expr + ')')();
      if (!isFinite(result) || isNaN(result)) {
        state.calcDisplay = 'Error';
      } else {
        state.calcDisplay = String(Number(result.toFixed(8)));
      }
      state.calcExpr = '';
      state.calcResetNext = true;
    } catch (e) {
      state.calcDisplay = 'Error';
      state.calcExpr = '';
      state.calcResetNext = true;
    }
  } else {
    if (state.calcResetNext || state.calcDisplay === '0' || state.calcDisplay === 'Error') {
      state.calcDisplay = val === '.' ? '0.' : val;
      state.calcResetNext = false;
    } else {
      if (val === '.' && state.calcDisplay.includes('.')) return;
      state.calcDisplay += val;
    }
  }
  const disp = document.getElementById('calc-display');
  const expEl = document.getElementById('calc-expr');
  if (disp) disp.textContent = state.calcDisplay;
  if (expEl) expEl.textContent = state.calcExpr || '\u00A0';
}

function updateAnsweredCountDOM() {
  const el = document.getElementById('cbe-answered-count');
  if (!el) return;
  const exam = getExam();
  if (!exam) return;
  const ansMap = getExamAnswers(exam.id);
  const answeredCount = exam.questions.filter(item => isQuestionAnswered(item, ansMap[item.num])).length;
  el.textContent = `${answeredCount}/${exam.totalQuestions}`;
}

function updateNumPreviewDOM(q, rawVal) {
  const prev = document.getElementById('num-preview-val');
  if (!prev) return;
  const cleaned = String(rawVal || '').trim();
  if (!cleaned) {
    prev.textContent = '';
    return;
  }
  prev.textContent = `Preview: ${q.prefix || ''}${cleaned}${q.suffix ? ' ' + q.suffix : ''}`;
}

let toastTimer = null;
function showToast(msg) {
  state.toastMsg = msg;
  const el = document.getElementById('cbe-toast');
  if (el) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    state.toastMsg = '';
    const t = document.getElementById('cbe-toast');
    if (t) t.classList.add('hidden');
  }, 2200);
}

  } else if (state.view === 'exam') {

}
